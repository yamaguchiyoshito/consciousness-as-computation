<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" role="img" aria-labelledby="title desc">
<title id="title">目的関数の重みは、時間でも文脈でも変わる</title>
<desc id="desc">年齢に伴う推移と、同じ時点での状況による違い</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#5d6873" stroke-width="1.4"/></marker><marker id="arrow-teal" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#2b7a8c" stroke-width="1.6"/></marker><marker id="arrow-terra" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#d0693a" stroke-width="1.6"/></marker><marker id="arrow-indigo" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#5a4fcf" stroke-width="1.6"/></marker><marker id="arrow-ink" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#232a33" stroke-width="1.6"/></marker><pattern id="hatch03f" patternUnits="userSpaceOnUse" width="7" height="7" patternTransform="rotate(45)"><rect width="7" height="7" fill="#ffffff"/><line x1="0" y1="0" x2="0" y2="7" stroke="#2b7a8c" stroke-width="2.5"/></pattern></defs>
<rect width="1200" height="660" rx="20" fill="#f7f5ef"/>
<g font-family='system-ui, -apple-system, "Hiragino Kaku Gothic ProN", "Noto Sans CJK JP", Meiryo, sans-serif'>
<text x="50.0" y="52.0" fill="#2b7a8c" font-size="18" text-anchor="start" font-weight="700">CONSCIOUSNESS     03     図3-6</text>
<text x="50.0" y="103.0" fill="#232a33" font-size="34" text-anchor="start" font-weight="700">目的関数の重みは、時間でも文脈でも変わる</text>
<text x="50.0" y="141.0" fill="#5d6873" font-size="21" text-anchor="start" font-weight="400">年齢に伴う推移と、同じ時点での状況による違い</text>
<line x1="50.0" y1="166.0" x2="1150.0" y2="166.0" stroke="#d8d4c8" stroke-width="1"/>
<rect x="60" y="205" width="640" height="400" rx="16" fill="none" stroke="#c9c4b6" stroke-width="2" stroke-dasharray="7 7"/>
<text x="380.0" y="239.0" fill="#232a33" font-size="22" text-anchor="middle" font-weight="700">年齢に伴う重みの推移</text>
<line x1="110.0" y1="520.0" x2="660.0" y2="520.0" stroke="#232a33" stroke-width="1.5" marker-end="url(#arrow-ink)"/>
<line x1="110.0" y1="520.0" x2="110.0" y2="280.0" stroke="#232a33" stroke-width="1.5" marker-end="url(#arrow-ink)"/>
<text x="150.0" y="544.0" fill="#5d6873" font-size="14" text-anchor="middle" font-weight="400">20代</text>
<text x="380.0" y="544.0" fill="#5d6873" font-size="14" text-anchor="middle" font-weight="400">40代</text>
<text x="610.0" y="544.0" fill="#5d6873" font-size="14" text-anchor="middle" font-weight="400">60代</text>
<path d="M130,300 C300,310 450,420 630,460" fill="none" stroke="#d0693a" stroke-width="3.5"/>
<text x="640.0" y="488.0" fill="#d0693a" font-size="14" text-anchor="end" font-weight="700">承認・競争</text>
<path d="M130,470 C300,460 450,350 630,305" fill="none" stroke="#2b7a8c" stroke-width="3.5"/>
<text x="640.0" y="298.0" fill="#2b7a8c" font-size="14" text-anchor="end" font-weight="700">健康・家族</text>
<text x="380.0" y="580.0" fill="#5d6873" font-size="13" text-anchor="middle" font-weight="400">価値観の変化は、重み付けの変化と自己表象の更新として説明できる</text>
<rect x="740" y="205" width="400" height="400" rx="16" fill="none" stroke="#c9c4b6" stroke-width="2" stroke-dasharray="7 7"/>
<text x="940.0" y="239.0" fill="#232a33" font-size="22" text-anchor="middle" font-weight="700">同じ時点での文脈の違い</text>
<rect x="764.0" y="380.0" width="22.0" height="120.0" rx="4" fill="#d0693a" stroke="#d0693a" stroke-width="2"/>
<rect x="790.0" y="460.0" width="22.0" height="40.0" rx="4" fill="url(#hatch03f)" stroke="#2b7a8c" stroke-width="2"/>
<rect x="816.0" y="450.0" width="22.0" height="50.0" rx="4" fill="#ffffff" stroke="#5a4fcf" stroke-width="2"/>
<text x="800.0" y="524.0" fill="#232a33" font-size="14" text-anchor="middle" font-weight="700">職場</text>
<rect x="884.0" y="460.0" width="22.0" height="40.0" rx="4" fill="#d0693a" stroke="#d0693a" stroke-width="2"/>
<rect x="910.0" y="370.0" width="22.0" height="130.0" rx="4" fill="url(#hatch03f)" stroke="#2b7a8c" stroke-width="2"/>
<rect x="936.0" y="455.0" width="22.0" height="45.0" rx="4" fill="#ffffff" stroke="#5a4fcf" stroke-width="2"/>
<text x="920.0" y="524.0" fill="#232a33" font-size="14" text-anchor="middle" font-weight="700">家庭</text>
<rect x="1004.0" y="465.0" width="22.0" height="35.0" rx="4" fill="#d0693a" stroke="#d0693a" stroke-width="2"/>
<rect x="1030.0" y="455.0" width="22.0" height="45.0" rx="4" fill="url(#hatch03f)" stroke="#2b7a8c" stroke-width="2"/>
<rect x="1056.0" y="365.0" width="22.0" height="135.0" rx="4" fill="#ffffff" stroke="#5a4fcf" stroke-width="2"/>
<text x="1040.0" y="524.0" fill="#232a33" font-size="14" text-anchor="middle" font-weight="700">趣味</text>
<line x1="780.0" y1="500.0" x2="1120.0" y2="500.0" stroke="#232a33" stroke-width="1.5"/>
<rect x="770.0" y="243.0" width="16.0" height="16.0" rx="3" fill="#d0693a" stroke="#d0693a" stroke-width="2"/>
<text x="794.0" y="257.0" fill="#232a33" font-size="14" text-anchor="start" font-weight="400">効率・成果</text>
<rect x="770.0" y="269.0" width="16.0" height="16.0" rx="3" fill="url(#hatch03f)" stroke="#2b7a8c" stroke-width="2"/>
<text x="794.0" y="283.0" fill="#232a33" font-size="14" text-anchor="start" font-weight="400">愛着・安定</text>
<rect x="770.0" y="295.0" width="16.0" height="16.0" rx="3" fill="#ffffff" stroke="#5a4fcf" stroke-width="2"/>
<text x="794.0" y="309.0" fill="#232a33" font-size="14" text-anchor="start" font-weight="400">好奇心・楽しさ</text>
<text x="940.0" y="580.0" fill="#5d6873" font-size="13" text-anchor="middle" font-weight="400">どれか一つだけが本当の自分ではない</text>
<text x="50.0" y="632.0" fill="#5d6873" font-size="18" text-anchor="start" font-weight="400">右の文脈による違いは、第7回の「分人」につながる。</text>
</g>
</svg>
