<text x="50.0" y="632.0" fill="#5d6873" font-size="18" text-anchor="start" font-weight="400">目的関数モデルでは三つを「自己表象が肉体外の対象と結びつく現象」として統一的に扱い、仕組みの違いは図7-7の要素で表す。</text>
