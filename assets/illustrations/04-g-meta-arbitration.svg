<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" role="img" aria-labelledby="title desc">
<title id="title">意識を、目的の優先順位を調整するメタ処理として考える</title>
<desc id="desc">個別の目的を達成する処理の上位で、どの情報と目的を優先するかを決める</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#5d6873" stroke-width="1.4"/></marker><marker id="arrow-teal" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#2b7a8c" stroke-width="1.6"/></marker><marker id="arrow-terra" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#d0693a" stroke-width="1.6"/></marker><marker id="arrow-indigo" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#5a4fcf" stroke-width="1.6"/></marker><marker id="arrow-ink" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#232a33" stroke-width="1.6"/></marker></defs>
<rect width="1200" height="660" rx="20" fill="#f7f5ef"/>
<g font-family='system-ui, -apple-system, "Hiragino Kaku Gothic ProN", "Noto Sans CJK JP", Meiryo, sans-serif'>
<text x="50.0" y="52.0" fill="#2b7a8c" font-size="18" text-anchor="start" font-weight="700">CONSCIOUSNESS     04     図4-7</text>
<text x="50.0" y="103.0" fill="#232a33" font-size="34" text-anchor="start" font-weight="700">意識を、目的の優先順位を調整するメタ処理として考える</text>
<text x="50.0" y="141.0" fill="#5d6873" font-size="21" text-anchor="start" font-weight="400">個別の目的を達成する処理の上位で、どの情報と目的を優先するかを決める</text>
<line x1="50.0" y1="166.0" x2="1150.0" y2="166.0" stroke="#d8d4c8" stroke-width="1"/>
<rect x="250.0" y="215.0" width="700.0" height="130.0" rx="16" fill="#dfe9eb" stroke="#2b7a8c" stroke-width="2"/>
<text x="600.0" y="255.0" fill="#2b7a8c" font-size="22" text-anchor="middle" font-weight="700">メタ処理：どの情報と目的を優先するか</text>
<text x="600.0" y="285.0" fill="#232a33" font-size="15" text-anchor="middle" font-weight="400">現在の状態を認識し、将来の結果を予測し、競合する目的を調停する</text>
<text x="600.0" y="312.0" fill="#5d6873" font-size="14" text-anchor="middle" font-weight="400">不確実性や目的間の競合が生じたときに関与する</text>
<rect x="130.0" y="440.0" width="320.0" height="100.0" rx="14" fill="#ffffff" stroke="#d0693a" stroke-width="2"/>
<text x="290.0" y="485.0" fill="#d0693a" font-size="22" text-anchor="middle" font-weight="700">食欲</text>
<text x="290.0" y="510.0" fill="#5d6873" font-size="13" text-anchor="middle" font-weight="400">短期：空腹という刺激が食事を促す</text>
<rect x="750.0" y="440.0" width="320.0" height="100.0" rx="14" fill="#ffffff" stroke="#5a4fcf" stroke-width="2"/>
<text x="910.0" y="485.0" fill="#5a4fcf" font-size="22" text-anchor="middle" font-weight="700">健康の維持</text>
<text x="910.0" y="510.0" fill="#5d6873" font-size="13" text-anchor="middle" font-weight="400">長期：食事を制限したい</text>
<line x1="290.0" y1="440.0" x2="420.0" y2="345.0" stroke="#d0693a" stroke-width="2.5" marker-end="url(#arrow-terra)" stroke-dasharray="8 7"/>
<line x1="910.0" y1="440.0" x2="780.0" y2="345.0" stroke="#5a4fcf" stroke-width="2.5" marker-end="url(#arrow-indigo)" stroke-dasharray="8 7"/>
<text x="600.0" y="420.0" fill="#232a33" font-size="18" text-anchor="middle" font-weight="700">競合</text>
<line x1="450.0" y1="490.0" x2="750.0" y2="490.0" stroke="#5d6873" stroke-width="2" marker-end="url(#arrow)" marker-start="url(#arrow)" stroke-dasharray="8 7"/>
<line x1="600.0" y1="345.0" x2="600.0" y2="560.0" stroke="#2b7a8c" stroke-width="3" marker-end="url(#arrow-teal)"/>
<rect x="520.0" y="560.0" width="160.0" height="50.0" rx="14" fill="#ffffff" stroke="#2b7a8c" stroke-width="2"/>
<text x="600.0" y="591.5" fill="#2b7a8c" font-size="18" text-anchor="middle" font-weight="700">行動</text>
<text x="1100.0" y="600.0" fill="#5d6873" font-size="13" text-anchor="end" font-weight="400">すべての調停が意識的に行われるわけではない</text>
<text x="50.0" y="632.0" fill="#5d6873" font-size="18" text-anchor="start" font-weight="400">意識がすべての意思決定を統括しているという主張ではなく、複雑な状況での統合と調停に関与するという機能的な仮説。</text>
</g>
</svg>
