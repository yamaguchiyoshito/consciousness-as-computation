<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc">
<title id="title">仮説を支持するためだけでなく、反証するために実験する</title>
<desc id="desc">想定している構造を取り除いても同じ機能が成立するなら、仮説を再検討する</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#5d6873" stroke-width="1.4"/></marker><marker id="arrow-teal" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#2b7a8c" stroke-width="1.6"/></marker><marker id="arrow-terra" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#d0693a" stroke-width="1.6"/></marker><marker id="arrow-indigo" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#5a4fcf" stroke-width="1.6"/></marker><marker id="arrow-ink" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#232a33" stroke-width="1.6"/></marker></defs>
<rect width="1200" height="640" rx="20" fill="#f7f5ef"/>
<g font-family='system-ui, -apple-system, "Hiragino Kaku Gothic ProN", "Noto Sans CJK JP", Meiryo, sans-serif'>
<text x="50.0" y="52.0" fill="#2b7a8c" font-size="18" text-anchor="start" font-weight="700">CONSCIOUSNESS     09     図9-14</text>
<text x="50.0" y="103.0" fill="#232a33" font-size="34" text-anchor="start" font-weight="700">仮説を支持するためだけでなく、反証するために実験する</text>
<text x="50.0" y="141.0" fill="#5d6873" font-size="21" text-anchor="start" font-weight="400">想定している構造を取り除いても同じ機能が成立するなら、仮説を再検討する</text>
<line x1="50.0" y1="166.0" x2="1150.0" y2="166.0" stroke="#d8d4c8" stroke-width="1"/>
<rect x="380.0" y="215.0" width="440.0" height="70.0" rx="14" fill="#ffffff" stroke="#232a33" stroke-width="2"/>
<text x="600.0" y="256.5" fill="#232a33" font-size="18" text-anchor="middle" font-weight="700">自己表象を取り除く（アブレーション）</text>
<line x1="600.0" y1="285.0" x2="600.0" y2="330.0" stroke="#5d6873" stroke-width="2.2" marker-end="url(#arrow)"/>
<rect x="400.0" y="330.0" width="400.0" height="60.0" rx="14" fill="#ffffff" stroke="#5a4fcf" stroke-width="2"/>
<text x="600.0" y="366.5" fill="#5a4fcf" font-size="18" text-anchor="middle" font-weight="700">機能は維持されたか？</text>
<path d="M400.0,360.0 Q300.0,360.0 250.0,430.0" fill="none" stroke="#2b7a8c" stroke-width="2.5" marker-end="url(#arrow-teal)"/>
<path d="M800.0,360.0 Q900.0,360.0 950.0,430.0" fill="none" stroke="#d0693a" stroke-width="2.5" marker-end="url(#arrow-terra)"/>
<text x="280.0" y="345.0" fill="#2b7a8c" font-size="14" text-anchor="middle" font-weight="700">低下した</text>
<text x="920.0" y="345.0" fill="#d0693a" font-size="14" text-anchor="middle" font-weight="700">維持された</text>
<rect x="90.0" y="430.0" width="320.0" height="90.0" rx="14" fill="#ffffff" stroke="#2b7a8c" stroke-width="2"/>
<text x="250.0" y="470.0" fill="#2b7a8c" font-size="18" text-anchor="middle" font-weight="700">自己表象の機能を支持</text>
<text x="250.0" y="494.0" fill="#5d6873" font-size="12" text-anchor="middle" font-weight="400">一貫性や適応性に寄与していた</text>
<rect x="790.0" y="430.0" width="320.0" height="90.0" rx="14" fill="#ffffff" stroke="#d0693a" stroke-width="2"/>
<text x="950.0" y="470.0" fill="#d0693a" font-size="18" text-anchor="middle" font-weight="700">仮説を再検討</text>
<text x="950.0" y="494.0" fill="#5d6873" font-size="12" text-anchor="middle" font-weight="400">同じ機能を別の構造で実現できる</text>
<text x="600.0" y="560.0" fill="#5d6873" font-size="13" text-anchor="middle" font-weight="400">目的関数の相互作用、共有記憶、物語による更新についても同じ論理で検証する</text>
<text x="600.0" y="585.0" fill="#5d6873" font-size="13" text-anchor="middle" font-weight="400">重要なのは、理論に合うようにシステムを作ることではない</text>
<text x="50.0" y="612.0" fill="#5d6873" font-size="18" text-anchor="start" font-weight="400">どちらの結果でも、意識と自己の理解は前進する。</text>
</g>
</svg>
