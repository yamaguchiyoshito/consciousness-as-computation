<text x="600.0" y="600.0" fill="#232a33" font-size="15" text-anchor="middle" font-weight="400">F* = argmax_(F′ ⊆ F) J(F′)　　J は本モデル独自の統合度の評価関数</text>
<text x="50.0" y="632.0" fill="#5d6873" font-size="18" text-anchor="start" font-weight="400">J は IIT のΦと同一ではない。最も統合された組がそのまま自己になるとも限らず、機能的な条件が別に要る。</text>
