<text x="50.0" y="103.0" fill="#232a33" font-size="34" text-anchor="start" font-weight="700">統合の仮説を検証する三つのシステム</text>
<text x="50.0" y="141.0" fill="#5d6873" font-size="21" text-anchor="start" font-weight="400">目的関数が独立している構成から、相互作用と自己表象を順に加える</text>
