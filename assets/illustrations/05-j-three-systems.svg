<text x="970.0" y="530.0" fill="#232a33" font-size="14" text-anchor="middle" font-weight="700">自己表象を導入</text>
<text x="50.0" y="612.0" fill="#5d6873" font-size="18" text-anchor="start" font-weight="400">行動の違いを観測する。行動の複雑さと因果的な情報統合は同じ指標ではない。第9回の比較実験へつながる。</text>
