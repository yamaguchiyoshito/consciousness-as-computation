<text x="720.0" y="430.0" fill="#5d6873" font-size="13" text-anchor="middle" font-weight="400">ハードプロブレム</text>
<circle cx="840.0" cy="360.0" r="24" fill="#ffffff"/>
<circle cx="840.0" cy="360.0" r="24" fill="none" stroke="#5a4fcf" stroke-width="2.5"/>
