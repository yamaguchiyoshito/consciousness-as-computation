<text x="840.0" y="410.0" fill="#232a33" font-size="15" text-anchor="middle" font-weight="700">分人</text>
<text x="840.0" y="430.0" fill="#5d6873" font-size="13" text-anchor="middle" font-weight="400">複数の自分と拡張</text>
<circle cx="960.0" cy="360.0" r="24" fill="#ffffff"/>
