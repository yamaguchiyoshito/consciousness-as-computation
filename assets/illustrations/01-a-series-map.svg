<text x="240.0" y="430.0" fill="#5d6873" font-size="13" text-anchor="middle" font-weight="400">認識する働き</text>
<text x="240.0" y="447.0" fill="#5d6873" font-size="13" text-anchor="middle" font-weight="400">と表象</text>
