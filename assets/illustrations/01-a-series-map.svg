<text x="960.0" y="410.0" fill="#232a33" font-size="15" text-anchor="middle" font-weight="700">物語</text>
<text x="960.0" y="430.0" fill="#5d6873" font-size="13" text-anchor="middle" font-weight="400">目的関数の学習</text>
<text x="960.0" y="447.0" fill="#5d6873" font-size="13" text-anchor="middle" font-weight="400">と修復</text>
<circle cx="1080.0" cy="360.0" r="24" fill="#ffffff"/>
<circle cx="1080.0" cy="360.0" r="24" fill="none" stroke="#5d6873" stroke-width="2.5"/>
<text x="1080.0" y="366.0" fill="#5d6873" font-size="17" text-anchor="middle" font-weight="700">9</text>
<text x="1080.0" y="410.0" fill="#232a33" font-size="15" text-anchor="middle" font-weight="700">計算機</text>
<text x="1080.0" y="430.0" fill="#5d6873" font-size="13" text-anchor="middle" font-weight="400">機能的近似と検証</text>
<text x="600.0" y="500.0" fill="#232a33" font-size="17" text-anchor="middle" font-weight="700">「自分」は発見されるのではなく、情報処理によって構築される</text>
<text x="600.0" y="528.0" fill="#5d6873" font-size="14" text-anchor="middle" font-weight="400">各回は独立した読み物であり、末尾の一段落が次回へつながる</text>
<text x="50.0" y="592.0" fill="#5d6873" font-size="18" text-anchor="start" font-weight="400">第1〜2回で仮説を立て、第3〜5回でモデルを組み、第6〜8回で体験と複数の自己を扱い、第9回で計算機に載せる。</text>
