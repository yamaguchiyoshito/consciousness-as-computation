<text x="600.0" y="410.0" fill="#232a33" font-size="15" text-anchor="middle" font-weight="700">統合</text>
<text x="600.0" y="430.0" fill="#5d6873" font-size="13" text-anchor="middle" font-weight="400">関係の中の自分</text>
