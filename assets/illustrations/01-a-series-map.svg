<text x="360.0" y="430.0" fill="#5d6873" font-size="13" text-anchor="middle" font-weight="400">交差点に</text>
<text x="360.0" y="447.0" fill="#5d6873" font-size="13" text-anchor="middle" font-weight="400">生まれる自己</text>
