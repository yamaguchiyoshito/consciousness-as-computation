<text x="50.0" y="103.0" fill="#232a33" font-size="34" text-anchor="start" font-weight="700">連載の地図</text>
<text x="50.0" y="141.0" fill="#5d6873" font-size="21" text-anchor="start" font-weight="400">全9回・4部の流れ</text>
