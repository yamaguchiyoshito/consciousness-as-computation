<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" role="img" aria-labelledby="title desc">
<title id="title">自己表象は予測処理と目的関数を結びつける</title>
<desc id="desc">三つの要素が循環し、行動の結果が世界モデルと自己表象を更新する</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#5d6873" stroke-width="1.4"/></marker><marker id="arrow-teal" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#2b7a8c" stroke-width="1.6"/></marker><marker id="arrow-terra" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#d0693a" stroke-width="1.6"/></marker><marker id="arrow-indigo" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#5a4fcf" stroke-width="1.6"/></marker><marker id="arrow-ink" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#232a33" stroke-width="1.6"/></marker></defs>
<rect width="1200" height="660" rx="20" fill="#f7f5ef"/>
<g font-family='system-ui, -apple-system, "Hiragino Kaku Gothic ProN", "Noto Sans CJK JP", Meiryo, sans-serif'>
<text x="50.0" y="52.0" fill="#2b7a8c" font-size="18" text-anchor="start" font-weight="700">CONSCIOUSNESS     04     図4-8</text>
<text x="50.0" y="103.0" fill="#232a33" font-size="34" text-anchor="start" font-weight="700">自己表象は予測処理と目的関数を結びつける</text>
<text x="50.0" y="141.0" fill="#5d6873" font-size="21" text-anchor="start" font-weight="400">三つの要素が循環し、行動の結果が世界モデルと自己表象を更新する</text>
<line x1="50.0" y1="166.0" x2="1150.0" y2="166.0" stroke="#d8d4c8" stroke-width="1"/>
<rect x="150.0" y="240.0" width="250.0" height="90.0" rx="14" fill="#ffffff" stroke="#2b7a8c" stroke-width="2"/>
<text x="275.0" y="280.0" fill="#2b7a8c" font-size="22" text-anchor="middle" font-weight="700">世界モデル</text>
<text x="275.0" y="309.0" fill="#5d6873" font-size="17" text-anchor="middle" font-weight="400">外界を推定し将来を予測する</text>
<rect x="800.0" y="240.0" width="250.0" height="90.0" rx="14" fill="#ffffff" stroke="#5a4fcf" stroke-width="2"/>
<text x="925.0" y="280.0" fill="#5a4fcf" font-size="22" text-anchor="middle" font-weight="700">目的関数群</text>
<text x="925.0" y="309.0" fill="#5d6873" font-size="17" text-anchor="middle" font-weight="400">予測された状態や行動を評価する</text>
<rect x="475.0" y="490.0" width="250.0" height="90.0" rx="14" fill="#ffffff" stroke="#d0693a" stroke-width="2"/>
<text x="600.0" y="530.0" fill="#d0693a" font-size="22" text-anchor="middle" font-weight="700">自己表象</text>
<text x="600.0" y="559.0" fill="#5d6873" font-size="17" text-anchor="middle" font-weight="400">状態・能力・価値観を表現する</text>
<line x1="400.0" y1="275.0" x2="800.0" y2="275.0" stroke="#2b7a8c" stroke-width="2.5" marker-end="url(#arrow-teal)"/>
<text x="600.0" y="262.0" fill="#2b7a8c" font-size="17" text-anchor="middle" font-weight="700">行動の結果を予測する</text>
<line x1="900.0" y1="330.0" x2="650.0" y2="490.0" stroke="#5a4fcf" stroke-width="2.5" marker-end="url(#arrow-indigo)"/>
<text x="838.0" y="362.0" fill="#5a4fcf" font-size="17" text-anchor="end" font-weight="700">評価が自己像を変える</text>
<line x1="550.0" y1="490.0" x2="300.0" y2="330.0" stroke="#d0693a" stroke-width="2.5" marker-end="url(#arrow-terra)"/>
<text x="370.0" y="420.0" fill="#d0693a" font-size="17" text-anchor="start" font-weight="700">予測に影響する</text>
<line x1="700.0" y1="490.0" x2="950.0" y2="330.0" stroke="#d0693a" stroke-width="1.8" marker-end="url(#arrow-terra)" stroke-dasharray="8 7"/>
<text x="905.0" y="470.0" fill="#d0693a" font-size="15" text-anchor="middle" font-weight="400">重みに影響する</text>
<line x1="556.0" y1="380.0" x2="400.0" y2="310.0" stroke="#5d6873" stroke-width="1.8" marker-end="url(#arrow)" stroke-dasharray="8 7"/>
<text x="515.0" y="338.0" fill="#5d6873" font-size="15" text-anchor="middle" font-weight="400">更新</text>
<line x1="600.0" y1="446.0" x2="600.0" y2="490.0" stroke="#5d6873" stroke-width="1.8" marker-end="url(#arrow)" stroke-dasharray="8 7"/>
<text x="612.0" y="474.0" fill="#5d6873" font-size="15" text-anchor="start" font-weight="400">更新</text>
<circle cx="600.0" cy="400.0" r="46" fill="#ffffff"/>
<circle cx="600.0" cy="400.0" r="46" fill="none" stroke="#5d6873" stroke-width="2" stroke-dasharray="7 6"/>
<text x="600.0" y="395.0" fill="#232a33" font-size="16" text-anchor="middle" font-weight="700">行動の</text>
<text x="600.0" y="415.0" fill="#232a33" font-size="16" text-anchor="middle" font-weight="700">結果</text>
<text x="50.0" y="632.0" fill="#5d6873" font-size="18" text-anchor="start" font-weight="400">一度形成された自己表象は、その後の情報処理を制約し方向づける。この循環で「自分」は維持され、更新される。</text>
</g>
</svg>
