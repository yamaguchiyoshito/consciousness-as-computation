<text x="50.0" y="752.0" fill="#5d6873" font-size="18" text-anchor="start" font-weight="400">各要素が相互に影響し循環する構造が必要になる。自己表象→世界モデルの破線は第8回の循環（図8-11）に対応する。</text>
