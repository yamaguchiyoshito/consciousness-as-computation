<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
<title id="title">四つのジャンルが再構成する評価環境</title>
<desc id="desc">現実で強く働く評価基準や制約に対して、別の評価環境を提示する</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#5d6873" stroke-width="1.4"/></marker><marker id="arrow-teal" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#2b7a8c" stroke-width="1.6"/></marker><marker id="arrow-terra" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#d0693a" stroke-width="1.6"/></marker><marker id="arrow-indigo" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#5a4fcf" stroke-width="1.6"/></marker></defs>
<rect width="1200" height="760" rx="20" fill="#f7f5ef"/>
<g font-family='system-ui, -apple-system, "Hiragino Kaku Gothic ProN", "Noto Sans CJK JP", Meiryo, sans-serif'>
<text x="50.0" y="52.0" fill="#2b7a8c" font-size="18" text-anchor="start" font-weight="700">CONSCIOUSNESS     08     図8-2</text>
<text x="50.0" y="103.0" fill="#232a33" font-size="34" text-anchor="start" font-weight="700">四つのジャンルが再構成する評価環境</text>
<text x="50.0" y="141.0" fill="#5d6873" font-size="21" text-anchor="start" font-weight="400">現実で強く働く評価基準や制約に対して、別の評価環境を提示する</text>
<line x1="50.0" y1="166.0" x2="1150.0" y2="166.0" stroke="#d8d4c8" stroke-width="1"/>
<rect x="60" y="200" width="520" height="230" rx="16" fill="none" stroke="#c9c4b6" stroke-width="2" stroke-dasharray="7 7"/>
<text x="320.0" y="234.0" fill="#232a33" font-size="22" text-anchor="middle" font-weight="700">異世界転生もの</text>
<text x="320.0" y="410.0" fill="#5d6873" font-size="15" text-anchor="middle" font-weight="400">社会的制約を取り除いた評価環境</text>
<rect x="620" y="200" width="520" height="230" rx="16" fill="none" stroke="#c9c4b6" stroke-width="2" stroke-dasharray="7 7"/>
<text x="880.0" y="234.0" fill="#232a33" font-size="22" text-anchor="middle" font-weight="700">追放もの</text>
<text x="880.0" y="410.0" fill="#5d6873" font-size="15" text-anchor="middle" font-weight="400">評価者の誤りによる自己評価の回復</text>
<rect x="60" y="460" width="520" height="230" rx="16" fill="none" stroke="#c9c4b6" stroke-width="2" stroke-dasharray="7 7"/>
<text x="320.0" y="494.0" fill="#232a33" font-size="22" text-anchor="middle" font-weight="700">日常系</text>
<text x="320.0" y="670.0" fill="#5d6873" font-size="15" text-anchor="middle" font-weight="400">競争以外の価値基準の提示</text>
<rect x="620" y="460" width="520" height="230" rx="16" fill="none" stroke="#c9c4b6" stroke-width="2" stroke-dasharray="7 7"/>
<text x="880.0" y="494.0" fill="#232a33" font-size="22" text-anchor="middle" font-weight="700">悪役令嬢もの</text>
<text x="880.0" y="670.0" fill="#5d6873" font-size="15" text-anchor="middle" font-weight="400">既定の未来を書き換える可能性</text>
<rect x="100.0" y="295.0" width="110.0" height="40.0" rx="20.0" fill="#ffffff" stroke="#2b7a8c" stroke-width="2"/>
<text x="155.0" y="321.1" fill="#2b7a8c" font-size="17" text-anchor="middle" font-weight="700">能力</text>
<rect x="275.0" y="270.0" width="30.0" height="90.0" rx="4" fill="#ece9e0" stroke="#5d6873" stroke-width="2" stroke-dasharray="8 7"/>
<line x1="274.0" y1="299.0" x2="306.0" y2="331.0" stroke="#d0693a" stroke-width="3.5"/>
<line x1="274.0" y1="331.0" x2="306.0" y2="299.0" stroke="#d0693a" stroke-width="3.5"/>
<text x="290.0" y="385.0" fill="#5d6873" font-size="14" text-anchor="middle" font-weight="400">社会的制約</text>
<line x1="210.0" y1="315.0" x2="270.0" y2="315.0" stroke="#2b7a8c" stroke-width="2.5"/>
<line x1="310.0" y1="315.0" x2="410.0" y2="315.0" stroke="#2b7a8c" stroke-width="2.5" marker-end="url(#arrow-teal)"/>
<rect x="420.0" y="295.0" width="110.0" height="40.0" rx="20.0" fill="#ffffff" stroke="#2b7a8c" stroke-width="2"/>
<text x="475.0" y="321.1" fill="#2b7a8c" font-size="17" text-anchor="middle" font-weight="700">評価</text>
<rect x="660.0" y="295.0" width="150.0" height="40.0" rx="20.0" fill="#ffffff" stroke="#5d6873" stroke-width="2"/>
<text x="735.0" y="321.1" fill="#5d6873" font-size="17" text-anchor="middle" font-weight="700">低い他者評価</text>
<line x1="810.0" y1="308.0" x2="950.0" y2="285.0" stroke="#d8d4c8" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="8 7"/>
<line x1="873.0" y1="283.0" x2="891.0" y2="301.0" stroke="#5d6873" stroke-width="2"/>
<line x1="873.0" y1="301.0" x2="891.0" y2="283.0" stroke="#5d6873" stroke-width="2"/>
<rect x="960.0" y="262.0" width="140.0" height="40.0" rx="20.0" fill="#ffffff" stroke="#5d6873" stroke-width="2"/>
<text x="1030.0" y="288.1" fill="#5d6873" font-size="17" text-anchor="middle" font-weight="700">自分の能力</text>
<line x1="810.0" y1="322.0" x2="950.0" y2="350.0" stroke="#d0693a" stroke-width="2.5" marker-end="url(#arrow-terra)"/>
<rect x="960.0" y="330.0" width="150.0" height="40.0" rx="20.0" fill="#ffffff" stroke="#d0693a" stroke-width="2"/>
<text x="1035.0" y="356.1" fill="#d0693a" font-size="17" text-anchor="middle" font-weight="700">評価者の誤り</text>
<text x="880.0" y="385.0" fill="#5d6873" font-size="14" text-anchor="middle" font-weight="400">原因の帰属先を評価者側へ</text>
<rect x="180.0" y="515.0" width="70.0" height="110.0" rx="4" fill="#ece9e0" stroke="#5d6873" stroke-width="2" stroke-dasharray="8 7"/>
<rect x="180.0" y="575.0" width="70.0" height="50.0" rx="4" fill="#5d6873" stroke="#5d6873" stroke-width="2"/>
<line x1="215.0" y1="505.0" x2="215.0" y2="565.0" stroke="#d0693a" stroke-width="2.5" marker-end="url(#arrow-terra)"/>
<text x="215.0" y="645.0" fill="#232a33" font-size="15" text-anchor="middle" font-weight="700">競争・達成</text>
<rect x="370.0" y="515.0" width="70.0" height="110.0" rx="4" fill="#2b7a8c" stroke="#2b7a8c" stroke-width="2"/>
<text x="405.0" y="645.0" fill="#232a33" font-size="15" text-anchor="middle" font-weight="700">関係・日常</text>
<text x="500.0" y="570.0" fill="#5d6873" font-size="14" text-anchor="middle" font-weight="400">重みの</text>
<text x="500.0" y="590.0" fill="#5d6873" font-size="14" text-anchor="middle" font-weight="400">相対化</text>
<circle cx="690.0" cy="590.0" r="9" fill="#232a33"/>
<text x="690.0" y="625.0" fill="#232a33" font-size="15" text-anchor="middle" font-weight="700">現在</text>
<line x1="700.0" y1="590.0" x2="1040.0" y2="590.0" stroke="#5d6873" stroke-width="2.5" marker-end="url(#arrow)" stroke-dasharray="8 7"/>
<text x="1050.0" y="596.0" fill="#5d6873" font-size="15" text-anchor="start" font-weight="400">既定の結末</text>
<path d="M820.0,590.0 Q920.0,590.0 1040.0,530.0" fill="none" stroke="#2b7a8c" stroke-width="2.5" marker-end="url(#arrow-teal)"/>
<text x="1050.0" y="536.0" fill="#2b7a8c" font-size="15" text-anchor="start" font-weight="700">別の未来</text>
<text x="820.0" y="560.0" fill="#2b7a8c" font-size="14" text-anchor="middle" font-weight="400">結末を予測し</text>
<text x="820.0" y="578.0" fill="#2b7a8c" font-size="14" text-anchor="middle" font-weight="400">行動を変える</text>
<text x="50.0" y="732.0" fill="#5d6873" font-size="18" text-anchor="start" font-weight="400">ジャンルの流行を単一の社会心理で説明することはできない。機能を読むための分析モデルである。</text>
</g>
</svg>
