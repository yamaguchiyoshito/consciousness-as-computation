<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" role="img" aria-labelledby="title desc">
<title id="title">自分らしさスコアは状況で動く</title>
<desc id="desc">痛みは部位への注意を跳ね上げ、習熟は道具を身体の延長にする</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#5d6873" stroke-width="1.4"/></marker><marker id="arrow-teal" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#2b7a8c" stroke-width="1.6"/></marker><marker id="arrow-terra" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#d0693a" stroke-width="1.6"/></marker><marker id="arrow-indigo" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#5a4fcf" stroke-width="1.6"/></marker><marker id="arrow-ink" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#232a33" stroke-width="1.6"/></marker></defs>
<rect width="1200" height="660" rx="20" fill="#f7f5ef"/>
<g font-family='system-ui, -apple-system, "Hiragino Kaku Gothic ProN", "Noto Sans CJK JP", Meiryo, sans-serif'>
<text x="50.0" y="52.0" fill="#2b7a8c" font-size="18" text-anchor="start" font-weight="700">CONSCIOUSNESS     02     図2-4</text>
<text x="50.0" y="103.0" fill="#232a33" font-size="34" text-anchor="start" font-weight="700">自分らしさスコアは状況で動く</text>
<text x="50.0" y="141.0" fill="#5d6873" font-size="21" text-anchor="start" font-weight="400">痛みは部位への注意を跳ね上げ、習熟は道具を身体の延長にする</text>
<line x1="50.0" y1="166.0" x2="1150.0" y2="166.0" stroke="#d8d4c8" stroke-width="1"/>
<line x1="110.0" y1="540.0" x2="1000.0" y2="540.0" stroke="#232a33" stroke-width="1.5" marker-end="url(#arrow-ink)"/>
<line x1="110.0" y1="540.0" x2="110.0" y2="240.0" stroke="#232a33" stroke-width="1.5" marker-end="url(#arrow-ink)"/>
<text x="1010.0" y="546.0" fill="#232a33" font-size="15" text-anchor="start" font-weight="400">時間</text>
<text x="122.0" y="234.0" fill="#232a33" font-size="15" text-anchor="start" font-weight="400">自分らしさスコア</text>
<line x1="110.0" y1="270.0" x2="960.0" y2="270.0" stroke="#2b7a8c" stroke-width="3.5"/>
<text x="970.0" y="275.0" fill="#2b7a8c" font-size="14" text-anchor="start" font-weight="700">脳・心臓：常に高い</text>
<path d="M110,480 L430,480 C440,480 445,330 470,330 L520,330 C545,330 550,470 560,472 L960,472" fill="none" stroke="#d0693a" stroke-width="3.5"/>
<text x="495.0" y="312.0" fill="#d0693a" font-size="14" text-anchor="middle" font-weight="700">痛みが生じる</text>
<text x="970.0" y="478.0" fill="#d0693a" font-size="14" text-anchor="start" font-weight="700">普段は意識しない部位</text>
<path d="M110,520 C400,520 650,350 960,340" fill="none" stroke="#5a4fcf" stroke-width="3.5"/>
<text x="970.0" y="345.0" fill="#5a4fcf" font-size="14" text-anchor="start" font-weight="700">習熟した道具</text>
<text x="600.0" y="600.0" fill="#5d6873" font-size="14" text-anchor="middle" font-weight="400">スコアは対象ごとに異なり、同じ対象でも状況で変わる。単一の数値が脳内にあるという主張ではない</text>
<text x="50.0" y="632.0" fill="#5d6873" font-size="18" text-anchor="start" font-weight="400">第7回で、この考え方を肉体の外側の対象へ拡張し、五つの要素で説明する。</text>
</g>
</svg>
