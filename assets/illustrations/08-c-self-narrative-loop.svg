<text x="600.0" y="422.0" fill="#232a33" font-size="15" text-anchor="middle" font-weight="400">自分についての物語が</text>
<text x="600.0" y="444.0" fill="#232a33" font-size="15" text-anchor="middle" font-weight="400">次の行動を方向づける</text>
<text x="50.0" y="692.0" fill="#5d6873" font-size="18" text-anchor="start" font-weight="400">私たちは物語を読むだけでなく、自分を物語として構築し、その物語に従って行動している可能性がある。</text>
