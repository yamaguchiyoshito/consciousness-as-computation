<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
<title id="title">意識的処理と無意識的処理</title>
<desc id="desc">膨大な処理の一部だけが意識的な認識や判断に関与する</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#5d6873" stroke-width="1.4"/></marker><marker id="arrow-teal" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#2b7a8c" stroke-width="1.6"/></marker><marker id="arrow-terra" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#d0693a" stroke-width="1.6"/></marker><marker id="arrow-indigo" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#5a4fcf" stroke-width="1.6"/></marker><marker id="arrow-ink" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#232a33" stroke-width="1.6"/></marker></defs>
<rect width="1200" height="680" rx="20" fill="#f7f5ef"/>
<g font-family='system-ui, -apple-system, "Hiragino Kaku Gothic ProN", "Noto Sans CJK JP", Meiryo, sans-serif'>
<text x="50.0" y="52.0" fill="#2b7a8c" font-size="18" text-anchor="start" font-weight="700">CONSCIOUSNESS     02     図2-3</text>
<text x="50.0" y="103.0" fill="#232a33" font-size="34" text-anchor="start" font-weight="700">意識的処理と無意識的処理</text>
<text x="50.0" y="141.0" fill="#5d6873" font-size="21" text-anchor="start" font-weight="400">膨大な処理の一部だけが意識的な認識や判断に関与する</text>
<line x1="50.0" y1="166.0" x2="1150.0" y2="166.0" stroke="#d8d4c8" stroke-width="1"/>
<rect x="60.0" y="400.0" width="150.0" height="50.0" rx="25.0" fill="#232a33" stroke="#232a33" stroke-width="2"/>
<text x="135.0" y="431.8" fill="#ffffff" font-size="19" text-anchor="middle" font-weight="700">感覚器官</text>
<text x="135.0" y="475.0" fill="#5d6873" font-size="14" text-anchor="middle" font-weight="400">外界の情報を受信</text>
<rect x="260" y="200" width="640" height="180" rx="16" fill="none" stroke="#c9c4b6" stroke-width="2" stroke-dasharray="7 7"/>
<text x="580.0" y="234.0" fill="#232a33" font-size="22" text-anchor="middle" font-weight="700">無意識的処理</text>
<rect x="260" y="440" width="640" height="180" rx="16" fill="none" stroke="#c9c4b6" stroke-width="2" stroke-dasharray="7 7"/>
<text x="580.0" y="474.0" fill="#232a33" font-size="22" text-anchor="middle" font-weight="700">意識的処理</text>
<rect x="285.0" y="255.0" width="140.0" height="56.0" rx="14" fill="#ffffff" stroke="#2b7a8c" stroke-width="2"/>
<text x="355.0" y="288.4" fill="#2b7a8c" font-size="15" text-anchor="middle" font-weight="700">信号の変換</text>
<rect x="440.0" y="255.0" width="140.0" height="56.0" rx="14" fill="#ffffff" stroke="#2b7a8c" stroke-width="2"/>
<text x="510.0" y="288.4" fill="#2b7a8c" font-size="15" text-anchor="middle" font-weight="700">特徴の抽出</text>
<rect x="595.0" y="255.0" width="140.0" height="56.0" rx="14" fill="#ffffff" stroke="#2b7a8c" stroke-width="2"/>
<text x="665.0" y="288.4" fill="#2b7a8c" font-size="15" text-anchor="middle" font-weight="700">習慣的な行動制御</text>
<rect x="750.0" y="255.0" width="140.0" height="56.0" rx="14" fill="#ffffff" stroke="#2b7a8c" stroke-width="2"/>
<text x="820.0" y="288.4" fill="#2b7a8c" font-size="15" text-anchor="middle" font-weight="700">自動的な予測</text>
<rect x="285.0" y="495.0" width="140.0" height="56.0" rx="14" fill="#ffffff" stroke="#5a4fcf" stroke-width="2"/>
<text x="355.0" y="528.0" fill="#5a4fcf" font-size="14" text-anchor="middle" font-weight="700">注意対象の選択</text>
<rect x="440.0" y="495.0" width="140.0" height="56.0" rx="14" fill="#ffffff" stroke="#5a4fcf" stroke-width="2"/>
<text x="510.0" y="528.0" fill="#5a4fcf" font-size="14" text-anchor="middle" font-weight="700">情報の評価</text>
<rect x="595.0" y="495.0" width="140.0" height="56.0" rx="14" fill="#ffffff" stroke="#5a4fcf" stroke-width="2"/>
<text x="665.0" y="528.0" fill="#5a4fcf" font-size="14" text-anchor="middle" font-weight="700">判断の検討</text>
<rect x="750.0" y="495.0" width="140.0" height="56.0" rx="14" fill="#ffffff" stroke="#5a4fcf" stroke-width="2"/>
<text x="820.0" y="528.0" fill="#5a4fcf" font-size="14" text-anchor="middle" font-weight="700">自己表象との関連づけ</text>
<text x="580.0" y="345.0" fill="#5d6873" font-size="14" text-anchor="middle" font-weight="400">歩行や熟練した読書：注意を向けずに進む</text>
<text x="580.0" y="585.0" fill="#5d6873" font-size="14" text-anchor="middle" font-weight="400">理解できない文章：読み返し、意味を確認し、文脈を考える</text>
<path d="M210.0,415.0 Q235.0,300.0 260.0,290.0" fill="none" stroke="#2b7a8c" stroke-width="2.5" marker-end="url(#arrow-teal)"/>
<path d="M210.0,440.0 Q235.0,540.0 260.0,530.0" fill="none" stroke="#5a4fcf" stroke-width="2.5" marker-end="url(#arrow-indigo)"/>
<line x1="430.0" y1="380.0" x2="430.0" y2="440.0" stroke="#5d6873" stroke-width="1.8" marker-end="url(#arrow)" marker-start="url(#arrow)" stroke-dasharray="8 7"/>
<line x1="580.0" y1="380.0" x2="580.0" y2="440.0" stroke="#5d6873" stroke-width="1.8" marker-end="url(#arrow)" marker-start="url(#arrow)" stroke-dasharray="8 7"/>
<line x1="730.0" y1="380.0" x2="730.0" y2="440.0" stroke="#5d6873" stroke-width="1.8" marker-end="url(#arrow)" marker-start="url(#arrow)" stroke-dasharray="8 7"/>
<text x="880.0" y="415.0" fill="#5d6873" font-size="14" text-anchor="end" font-weight="400">相互作用</text>
<rect x="960.0" y="380.0" width="180.0" height="90.0" rx="14" fill="#ffffff" stroke="#232a33" stroke-width="2"/>
<text x="1050.0" y="420.0" fill="#232a33" font-size="19" text-anchor="middle" font-weight="700">行動・予測</text>
<text x="1050.0" y="445.0" fill="#5d6873" font-size="13" text-anchor="middle" font-weight="400">処理結果の反映</text>
<path d="M900.0,290.0 Q940.0,300.0 960.0,400.0" fill="none" stroke="#2b7a8c" stroke-width="2.5" marker-end="url(#arrow-teal)"/>
<path d="M900.0,530.0 Q940.0,520.0 960.0,450.0" fill="none" stroke="#5a4fcf" stroke-width="2.5" marker-end="url(#arrow-indigo)"/>
<text x="50.0" y="652.0" fill="#5d6873" font-size="18" text-anchor="start" font-weight="400">意識がすべての情報処理を実行しているのではない。どの情報が意識的処理の対象になるかは第4回で扱う。</text>
</g>
</svg>
