<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" role="img" aria-labelledby="title desc">
<title id="title">「本当の自分」モデルと分人モデル</title>
<desc id="desc">役割の内側に唯一の自分があるのか、複数の自分の集合が個人なのか</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#5d6873" stroke-width="1.4"/></marker><marker id="arrow-teal" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#2b7a8c" stroke-width="1.6"/></marker><marker id="arrow-terra" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#d0693a" stroke-width="1.6"/></marker><marker id="arrow-indigo" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#5a4fcf" stroke-width="1.6"/></marker><marker id="arrow-ink" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#232a33" stroke-width="1.6"/></marker><radialGradient id="g07a-1"><stop offset="0" stop-color="#2b7a8c" stop-opacity="0.35"/><stop offset="0.55" stop-color="#2b7a8c" stop-opacity="0.16"/><stop offset="1" stop-color="#2b7a8c" stop-opacity="0"/></radialGradient><radialGradient id="g07a-2"><stop offset="0" stop-color="#d0693a" stop-opacity="0.35"/><stop offset="0.55" stop-color="#d0693a" stop-opacity="0.16"/><stop offset="1" stop-color="#d0693a" stop-opacity="0"/></radialGradient><radialGradient id="g07a-3"><stop offset="0" stop-color="#5a4fcf" stop-opacity="0.35"/><stop offset="0.55" stop-color="#5a4fcf" stop-opacity="0.16"/><stop offset="1" stop-color="#5a4fcf" stop-opacity="0"/></radialGradient><radialGradient id="g07a-4"><stop offset="0" stop-color="#5d6873" stop-opacity="0.35"/><stop offset="0.55" stop-color="#5d6873" stop-opacity="0.16"/><stop offset="1" stop-color="#5d6873" stop-opacity="0"/></radialGradient></defs>
<rect width="1200" height="660" rx="20" fill="#f7f5ef"/>
<g font-family='system-ui, -apple-system, "Hiragino Kaku Gothic ProN", "Noto Sans CJK JP", Meiryo, sans-serif'>
<text x="50.0" y="52.0" fill="#2b7a8c" font-size="18" text-anchor="start" font-weight="700">CONSCIOUSNESS     07     図7-1</text>
<text x="50.0" y="103.0" fill="#232a33" font-size="34" text-anchor="start" font-weight="700">「本当の自分」モデルと分人モデル</text>
<text x="50.0" y="141.0" fill="#5d6873" font-size="21" text-anchor="start" font-weight="400">役割の内側に唯一の自分があるのか、複数の自分の集合が個人なのか</text>
<line x1="50.0" y1="166.0" x2="1150.0" y2="166.0" stroke="#d8d4c8" stroke-width="1"/>
<rect x="60" y="205" width="500" height="390" rx="16" fill="none" stroke="#c9c4b6" stroke-width="2" stroke-dasharray="7 7"/>
<text x="310.0" y="239.0" fill="#232a33" font-size="22" text-anchor="middle" font-weight="700">「本当の自分」モデル</text>
<circle cx="310.0" cy="410.0" r="150" fill="#ffffff"/>
<circle cx="310.0" cy="410.0" r="150" fill="none" stroke="#d8d4c8" stroke-width="2.5" stroke-dasharray="7 6"/>
<text x="310.0" y="282.0" fill="#5d6873" font-size="13" text-anchor="middle" font-weight="400">役割：職場</text>
<circle cx="310.0" cy="410.0" r="105" fill="#ffffff"/>
<circle cx="310.0" cy="410.0" r="105" fill="none" stroke="#d8d4c8" stroke-width="2.5" stroke-dasharray="7 6"/>
<text x="310.0" y="327.0" fill="#5d6873" font-size="13" text-anchor="middle" font-weight="400">役割：家庭</text>
<circle cx="310.0" cy="410.0" r="60" fill="#ffffff"/>
<circle cx="310.0" cy="410.0" r="60" fill="none" stroke="#d0693a" stroke-width="2.5"/>
<text x="310.0" y="416.0" fill="#d0693a" font-size="15" text-anchor="middle" font-weight="700">本当の自分</text>
<text x="310.0" y="575.0" fill="#5d6873" font-size="14" text-anchor="middle" font-weight="400">役割を剥がせば、本来の自己が残るという前提</text>
<rect x="640" y="205" width="500" height="390" rx="16" fill="none" stroke="#c9c4b6" stroke-width="2" stroke-dasharray="7 7"/>
<text x="890.0" y="239.0" fill="#232a33" font-size="22" text-anchor="middle" font-weight="700">分人モデル</text>
<circle cx="890.0" cy="330.0" r="95" fill="url(#g07a-1)"/>
<circle cx="890.0" cy="330.0" r="62" fill="none" stroke="#2b7a8c" stroke-width="2.2"/>
<text x="890.0" y="297.0" fill="#2b7a8c" font-size="13" text-anchor="middle" font-weight="700">職場の分人</text>
<circle cx="960.0" cy="400.0" r="95" fill="url(#g07a-2)"/>
<circle cx="960.0" cy="400.0" r="62" fill="none" stroke="#d0693a" stroke-width="2.2"/>
<text x="998.0" y="405.0" fill="#d0693a" font-size="13" text-anchor="middle" font-weight="700">家庭の分人</text>
<circle cx="890.0" cy="470.0" r="95" fill="url(#g07a-3)"/>
<circle cx="890.0" cy="470.0" r="62" fill="none" stroke="#5a4fcf" stroke-width="2.2"/>
<text x="890.0" y="513.0" fill="#5a4fcf" font-size="13" text-anchor="middle" font-weight="700">友人との分人</text>
<circle cx="820.0" cy="400.0" r="95" fill="url(#g07a-4)"/>
<circle cx="820.0" cy="400.0" r="62" fill="none" stroke="#5d6873" stroke-width="2.2"/>
<text x="782.0" y="405.0" fill="#5d6873" font-size="13" text-anchor="middle" font-weight="700">趣味の分人</text>
<text x="890.0" y="406.0" fill="#232a33" font-size="16" text-anchor="middle" font-weight="700">個人</text>
<text x="890.0" y="575.0" fill="#5d6873" font-size="14" text-anchor="middle" font-weight="400">どれも偽物ではない。分人の集合がひとりの個人を構成する</text>
<text x="50.0" y="632.0" fill="#5d6873" font-size="18" text-anchor="start" font-weight="400">分人は平野啓一郎の概念である。これを目的関数の重みとして表すのは本連載独自の解釈。</text>
</g>
</svg>
