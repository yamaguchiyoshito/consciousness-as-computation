<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc">
<title id="title">変わるものと、つなぐもの</title>
<desc id="desc">十年前の自分と現在の自分は、性質の一致ではなく情報処理の連続性でつながる</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#5d6873" stroke-width="1.4"/></marker><marker id="arrow-teal" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#2b7a8c" stroke-width="1.6"/></marker><marker id="arrow-terra" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#d0693a" stroke-width="1.6"/></marker><marker id="arrow-indigo" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#5a4fcf" stroke-width="1.6"/></marker><marker id="arrow-ink" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#232a33" stroke-width="1.6"/></marker><linearGradient id="g07j-1" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2b7a8c" stop-opacity="0.25"/><stop offset="1" stop-color="#2b7a8c" stop-opacity="0.25"/></linearGradient></defs>
<rect width="1200" height="640" rx="20" fill="#f7f5ef"/>
<g font-family='system-ui, -apple-system, "Hiragino Kaku Gothic ProN", "Noto Sans CJK JP", Meiryo, sans-serif'>
<text x="50.0" y="52.0" fill="#2b7a8c" font-size="18" text-anchor="start" font-weight="700">CONSCIOUSNESS     07     図7-10</text>
<text x="50.0" y="103.0" fill="#232a33" font-size="34" text-anchor="start" font-weight="700">変わるものと、つなぐもの</text>
<text x="50.0" y="141.0" fill="#5d6873" font-size="21" text-anchor="start" font-weight="400">十年前の自分と現在の自分は、性質の一致ではなく情報処理の連続性でつながる</text>
<line x1="50.0" y1="166.0" x2="1150.0" y2="166.0" stroke="#d8d4c8" stroke-width="1"/>
<text x="160.0" y="232.0" fill="#232a33" font-size="17" text-anchor="middle" font-weight="700">十年前の自分</text>
<text x="1040.0" y="232.0" fill="#232a33" font-size="17" text-anchor="middle" font-weight="700">現在の自分</text>
<text x="70.0" y="300.0" fill="#d0693a" font-size="15" text-anchor="start" font-weight="700">変わるもの</text>
<text x="230.0" y="304.0" fill="#5d6873" font-size="13" text-anchor="start" font-weight="400">価値観</text>
<rect x="370.0" y="288.0" width="180.0" height="26.0" rx="13" fill="#ffffff" stroke="#d0693a" stroke-width="2"/>
<text x="460.0" y="305.0" fill="#232a33" font-size="12" text-anchor="middle" font-weight="400">承認・競争</text>
<line x1="560.0" y1="300.0" x2="630.0" y2="300.0" stroke="#d0693a" stroke-width="1.5" marker-end="url(#arrow-terra)" stroke-dasharray="8 7"/>
<rect x="640.0" y="288.0" width="180.0" height="26.0" rx="13" fill="#ffffff" stroke="#d0693a" stroke-width="2"/>
<text x="730.0" y="305.0" fill="#232a33" font-size="12" text-anchor="middle" font-weight="400">健康・家族</text>
<text x="230.0" y="340.0" fill="#5d6873" font-size="13" text-anchor="start" font-weight="400">能力</text>
<rect x="370.0" y="324.0" width="180.0" height="26.0" rx="13" fill="#ffffff" stroke="#d0693a" stroke-width="2"/>
<text x="460.0" y="341.0" fill="#232a33" font-size="12" text-anchor="middle" font-weight="400">未熟</text>
<line x1="560.0" y1="336.0" x2="630.0" y2="336.0" stroke="#d0693a" stroke-width="1.5" marker-end="url(#arrow-terra)" stroke-dasharray="8 7"/>
<rect x="640.0" y="324.0" width="180.0" height="26.0" rx="13" fill="#ffffff" stroke="#d0693a" stroke-width="2"/>
<text x="730.0" y="341.0" fill="#232a33" font-size="12" text-anchor="middle" font-weight="400">熟練</text>
<text x="230.0" y="376.0" fill="#5d6873" font-size="13" text-anchor="start" font-weight="400">人間関係・役割</text>
<rect x="370.0" y="360.0" width="180.0" height="26.0" rx="13" fill="#ffffff" stroke="#d0693a" stroke-width="2"/>
<text x="460.0" y="377.0" fill="#232a33" font-size="12" text-anchor="middle" font-weight="400">学生</text>
<line x1="560.0" y1="372.0" x2="630.0" y2="372.0" stroke="#d0693a" stroke-width="1.5" marker-end="url(#arrow-terra)" stroke-dasharray="8 7"/>
<rect x="640.0" y="360.0" width="180.0" height="26.0" rx="13" fill="#ffffff" stroke="#d0693a" stroke-width="2"/>
<text x="730.0" y="377.0" fill="#232a33" font-size="12" text-anchor="middle" font-weight="400">親・管理者</text>
<text x="230.0" y="412.0" fill="#5d6873" font-size="13" text-anchor="start" font-weight="400">関心の対象</text>
<rect x="370.0" y="396.0" width="180.0" height="26.0" rx="13" fill="#ffffff" stroke="#d0693a" stroke-width="2"/>
<text x="460.0" y="413.0" fill="#232a33" font-size="12" text-anchor="middle" font-weight="400">競技</text>
<line x1="560.0" y1="408.0" x2="630.0" y2="408.0" stroke="#d0693a" stroke-width="1.5" marker-end="url(#arrow-terra)" stroke-dasharray="8 7"/>
<rect x="640.0" y="396.0" width="180.0" height="26.0" rx="13" fill="#ffffff" stroke="#d0693a" stroke-width="2"/>
<text x="730.0" y="413.0" fill="#232a33" font-size="12" text-anchor="middle" font-weight="400">育てること</text>
<text x="70.0" y="480.0" fill="#2b7a8c" font-size="15" text-anchor="start" font-weight="700">つなぐもの</text>
<rect x="230" y="462" width="820" height="70" rx="35" fill="url(#g07j-1)"/>
<text x="640.0" y="492.0" fill="#2b7a8c" font-size="16" text-anchor="middle" font-weight="700">記憶 ／ ナラティブ ／ 身体の連続性 ／ 他者からの認識</text>
<text x="640.0" y="518.0" fill="#232a33" font-size="12" text-anchor="middle" font-weight="400">過去の経験を現在の自己と結びつけ、将来の自分を予測する</text>
<text x="600.0" y="580.0" fill="#5d6873" font-size="13" text-anchor="middle" font-weight="400">自己は、変化しないから連続しているのではない。変化した経験が次の自己の形成に影響し続けることで連続性を持つ</text>
<text x="50.0" y="612.0" fill="#5d6873" font-size="18" text-anchor="start" font-weight="400">記憶の連続性と主観的な意識の連続性が同じものかどうかは、未解決の問題として残る。</text>
</g>
</svg>
