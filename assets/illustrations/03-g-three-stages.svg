<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc">
<title id="title">目的関数を持つことと、意識を持つことは同じではない</title>
<desc id="desc">三つの段階のうち、目的関数モデルが直接扱うのは前の二つ</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#5d6873" stroke-width="1.4"/></marker><marker id="arrow-teal" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#2b7a8c" stroke-width="1.6"/></marker><marker id="arrow-terra" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#d0693a" stroke-width="1.6"/></marker><marker id="arrow-indigo" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#5a4fcf" stroke-width="1.6"/></marker><marker id="arrow-ink" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#232a33" stroke-width="1.6"/></marker></defs>
<rect width="1200" height="640" rx="20" fill="#f7f5ef"/>
<g font-family='system-ui, -apple-system, "Hiragino Kaku Gothic ProN", "Noto Sans CJK JP", Meiryo, sans-serif'>
<text x="50.0" y="52.0" fill="#2b7a8c" font-size="18" text-anchor="start" font-weight="700">CONSCIOUSNESS     03     図3-7</text>
<text x="50.0" y="103.0" fill="#232a33" font-size="34" text-anchor="start" font-weight="700">目的関数を持つことと、意識を持つことは同じではない</text>
<text x="50.0" y="141.0" fill="#5d6873" font-size="21" text-anchor="start" font-weight="400">三つの段階のうち、目的関数モデルが直接扱うのは前の二つ</text>
<line x1="50.0" y1="166.0" x2="1150.0" y2="166.0" stroke="#d8d4c8" stroke-width="1"/>
<rect x="70.0" y="400.0" width="340.0" height="92.0" rx="14" fill="#ffffff" stroke="#2b7a8c" stroke-width="2"/>
<text x="240.0" y="441.0" fill="#2b7a8c" font-size="17" text-anchor="middle" font-weight="700">① 目的関数に基づく行動選択</text>
<text x="240.0" y="466.0" fill="#5d6873" font-size="13" text-anchor="middle" font-weight="400">囲碁AI・ロボット・最適化アルゴリズムにもある</text>
<rect x="430.0" y="310.0" width="340.0" height="92.0" rx="14" fill="#ffffff" stroke="#2b7a8c" stroke-width="2"/>
<text x="600.0" y="351.0" fill="#2b7a8c" font-size="17" text-anchor="middle" font-weight="700">② 共通対象についての自己表象の形成</text>
<text x="600.0" y="376.0" fill="#5d6873" font-size="13" text-anchor="middle" font-weight="400">複数の目的関数が参照する対象を内部に表象する</text>
<rect x="790.0" y="220.0" width="340.0" height="92.0" rx="14" fill="#ffffff" stroke="#d0693a" stroke-width="2" stroke-dasharray="8 7"/>
<text x="960.0" y="261.0" fill="#d0693a" font-size="17" text-anchor="middle" font-weight="700">③ 主観的な体験が伴うこと</text>
<text x="960.0" y="286.0" fill="#5d6873" font-size="13" text-anchor="middle" font-weight="400">なぜ「感じる」のか。このモデルでは説明できない</text>
<line x1="410.0" y1="446.0" x2="430.0" y2="446.0" stroke="#5d6873" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="770.0" y1="356.0" x2="790.0" y2="356.0" stroke="#5d6873" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="70.0" y1="520.0" x2="770.0" y2="520.0" stroke="#2b7a8c" stroke-width="3"/>
<text x="420.0" y="548.0" fill="#2b7a8c" font-size="15" text-anchor="middle" font-weight="700">目的関数モデルが扱う範囲（計算機で検証できる）</text>
<line x1="790.0" y1="520.0" x2="1130.0" y2="520.0" stroke="#d0693a" stroke-width="3" stroke-dasharray="8 7"/>
<text x="960.0" y="548.0" fill="#d0693a" font-size="15" text-anchor="middle" font-weight="700">第5・6回で検討</text>
<text x="50.0" y="612.0" fill="#5d6873" font-size="18" text-anchor="start" font-weight="400">複数の評価関数で行動を選ぶプログラムが、自分自身を認識しているとは限らない。</text>
</g>
</svg>
