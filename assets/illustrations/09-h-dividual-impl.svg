<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
<title id="title">分人を文脈依存の混合モデルとして実装する</title>
<desc id="desc">三つの文脈で重みを切り替えながら、記憶と自己表象を共有する</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#5d6873" stroke-width="1.4"/></marker><marker id="arrow-teal" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#2b7a8c" stroke-width="1.6"/></marker><marker id="arrow-terra" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#d0693a" stroke-width="1.6"/></marker><marker id="arrow-indigo" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#5a4fcf" stroke-width="1.6"/></marker><marker id="arrow-ink" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#232a33" stroke-width="1.6"/></marker></defs>
<rect width="1200" height="680" rx="20" fill="#f7f5ef"/>
<g font-family='system-ui, -apple-system, "Hiragino Kaku Gothic ProN", "Noto Sans CJK JP", Meiryo, sans-serif'>
<text x="50.0" y="52.0" fill="#2b7a8c" font-size="18" text-anchor="start" font-weight="700">CONSCIOUSNESS     09     図9-8</text>
<text x="50.0" y="103.0" fill="#232a33" font-size="34" text-anchor="start" font-weight="700">分人を文脈依存の混合モデルとして実装する</text>
<text x="50.0" y="141.0" fill="#5d6873" font-size="21" text-anchor="start" font-weight="400">三つの文脈で重みを切り替えながら、記憶と自己表象を共有する</text>
<line x1="50.0" y1="166.0" x2="1150.0" y2="166.0" stroke="#d8d4c8" stroke-width="1"/>
<rect x="90.0" y="255.0" width="300.0" height="70.0" rx="14" fill="#ffffff" stroke="#2b7a8c" stroke-width="2"/>
<text x="240.0" y="285.0" fill="#2b7a8c" font-size="18" text-anchor="middle" font-weight="700">競争環境</text>
<text x="240.0" y="310.0" fill="#5d6873" font-size="13" text-anchor="middle" font-weight="400">重視：効率・達成</text>
<line x1="240.0" y1="325.0" x2="240.0" y2="370.0" stroke="#2b7a8c" stroke-width="2" marker-end="url(#arrow-teal)"/>
<rect x="150.0" y="370.0" width="180.0" height="50.0" rx="14" fill="#ffffff" stroke="#2b7a8c" stroke-width="2"/>
<text x="240.0" y="400.8" fill="#2b7a8c" font-size="16" text-anchor="middle" font-weight="700">w^(1)</text>
<line x1="240.0" y1="420.0" x2="240.0" y2="470.0" stroke="#2b7a8c" stroke-width="2" marker-end="url(#arrow-teal)" stroke-dasharray="8 7"/>
<rect x="450.0" y="255.0" width="300.0" height="70.0" rx="14" fill="#ffffff" stroke="#d0693a" stroke-width="2"/>
<text x="600.0" y="285.0" fill="#d0693a" font-size="18" text-anchor="middle" font-weight="700">協力環境</text>
<text x="600.0" y="310.0" fill="#5d6873" font-size="13" text-anchor="middle" font-weight="400">重視：信頼・関係</text>
<line x1="600.0" y1="325.0" x2="600.0" y2="370.0" stroke="#d0693a" stroke-width="2" marker-end="url(#arrow-terra)"/>
<rect x="510.0" y="370.0" width="180.0" height="50.0" rx="14" fill="#ffffff" stroke="#d0693a" stroke-width="2"/>
<text x="600.0" y="400.8" fill="#d0693a" font-size="16" text-anchor="middle" font-weight="700">w^(2)</text>
<line x1="600.0" y1="420.0" x2="600.0" y2="470.0" stroke="#d0693a" stroke-width="2" marker-end="url(#arrow-terra)" stroke-dasharray="8 7"/>
<rect x="810.0" y="255.0" width="300.0" height="70.0" rx="14" fill="#ffffff" stroke="#5a4fcf" stroke-width="2"/>
<text x="960.0" y="285.0" fill="#5a4fcf" font-size="18" text-anchor="middle" font-weight="700">探索環境</text>
<text x="960.0" y="310.0" fill="#5d6873" font-size="13" text-anchor="middle" font-weight="400">重視：好奇心・情報</text>
<line x1="960.0" y1="325.0" x2="960.0" y2="370.0" stroke="#5a4fcf" stroke-width="2" marker-end="url(#arrow-indigo)"/>
<rect x="870.0" y="370.0" width="180.0" height="50.0" rx="14" fill="#ffffff" stroke="#5a4fcf" stroke-width="2"/>
<text x="960.0" y="400.8" fill="#5a4fcf" font-size="16" text-anchor="middle" font-weight="700">w^(3)</text>
<line x1="960.0" y1="420.0" x2="960.0" y2="470.0" stroke="#5a4fcf" stroke-width="2" marker-end="url(#arrow-indigo)" stroke-dasharray="8 7"/>
<rect x="90.0" y="470.0" width="1020.0" height="80.0" rx="14" fill="#dfe9eb" stroke="#232a33" stroke-width="2"/>
<text x="600.0" y="502.0" fill="#232a33" font-size="18" text-anchor="middle" font-weight="700">共有する記憶・自己表象</text>
<text x="600.0" y="528.0" fill="#5d6873" font-size="13" text-anchor="middle" font-weight="400">文脈ごとに独立したエージェントを用意するのではなく、同じ個人の中で行動方針が切り替わる</text>
<path d="M600.0,252.0 Q420.0,170.0 240.0,252.0" fill="none" stroke="#d0693a" stroke-width="2" marker-end="url(#arrow-terra)" stroke-dasharray="8 7"/>
<text x="420.0" y="198.0" fill="#d0693a" font-size="12" text-anchor="middle" font-weight="400">協力環境の成功が競争環境の判断へ影響するか</text>
<text x="600.0" y="605.0" fill="#5d6873" font-size="13" text-anchor="middle" font-weight="400">ある文脈での経験が別の文脈での判断に及ぶかを観測し、分人間の情報共有を検証する</text>
<text x="50.0" y="652.0" fill="#5d6873" font-size="18" text-anchor="start" font-weight="400">第7回の混合モデル（式7-2）の実装。文脈 c から混合係数 π_j(c) を計算し、重みを合成する（式9-6）。</text>
</g>
</svg>
