<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
<title id="title">文脈が分人を選び、基盤は共有される</title>
<desc id="desc">切り替えと共有の両方があるから、同じ「自分」として認識できる</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#5d6873" stroke-width="1.4"/></marker><marker id="arrow-teal" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#2b7a8c" stroke-width="1.6"/></marker><marker id="arrow-terra" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#d0693a" stroke-width="1.6"/></marker><marker id="arrow-indigo" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#5a4fcf" stroke-width="1.6"/></marker></defs>
<rect width="1200" height="680" rx="20" fill="#f7f5ef"/>
<g font-family='system-ui, -apple-system, "Hiragino Kaku Gothic ProN", "Noto Sans CJK JP", Meiryo, sans-serif'>
<text x="50.0" y="52.0" fill="#2b7a8c" font-size="18" text-anchor="start" font-weight="700">CONSCIOUSNESS     07     図7-2</text>
<text x="50.0" y="103.0" fill="#232a33" font-size="34" text-anchor="start" font-weight="700">文脈が分人を選び、基盤は共有される</text>
<text x="50.0" y="141.0" fill="#5d6873" font-size="21" text-anchor="start" font-weight="400">切り替えと共有の両方があるから、同じ「自分」として認識できる</text>
<line x1="50.0" y1="166.0" x2="1150.0" y2="166.0" stroke="#d8d4c8" stroke-width="1"/>
<rect x="60.0" y="300.0" width="150.0" height="50.0" rx="25.0" fill="#232a33" stroke="#232a33" stroke-width="2"/>
<text x="135.0" y="332.2" fill="#ffffff" font-size="20" text-anchor="middle" font-weight="700">文脈 c</text>
<text x="135.0" y="375.0" fill="#5d6873" font-size="14" text-anchor="middle" font-weight="400">状況・相手・環境</text>
<line x1="210.0" y1="325.0" x2="280.0" y2="325.0" stroke="#5d6873" stroke-width="2.2" marker-end="url(#arrow)"/>
<rect x="280.0" y="285.0" width="220.0" height="80.0" rx="14" fill="#ffffff" stroke="#232a33" stroke-width="2"/>
<text x="390.0" y="320.0" fill="#232a33" font-size="20" text-anchor="middle" font-weight="700">混合係数 π(c)</text>
<text x="390.0" y="349.0" fill="#5d6873" font-size="17" text-anchor="middle" font-weight="400">どの分人をどの程度</text>
<rect x="620.0" y="215.0" width="230.0" height="64.0" rx="14" fill="#ffffff" stroke="#2b7a8c" stroke-width="2"/>
<text x="735.0" y="253.8" fill="#2b7a8c" font-size="19" text-anchor="middle" font-weight="700">職場の分人 w⁽¹⁾</text>
<path d="M500.0,325.0 Q560.0,286.0 620.0,247.0" fill="none" stroke="#2b7a8c" stroke-width="2.2" marker-end="url(#arrow-teal)"/>
<text x="560.0" y="278.0" fill="#2b7a8c" font-size="15" text-anchor="middle" font-weight="700">0.7</text>
<path d="M850.0,247.0 Q900.0,298.5 940.0,350.0" fill="none" stroke="#2b7a8c" stroke-width="2.2" marker-end="url(#arrow-teal)"/>
<rect x="620.0" y="305.0" width="230.0" height="64.0" rx="14" fill="#ffffff" stroke="#d0693a" stroke-width="2"/>
<text x="735.0" y="343.8" fill="#d0693a" font-size="19" text-anchor="middle" font-weight="700">家庭の分人 w⁽²⁾</text>
<path d="M500.0,325.0 Q560.0,331.0 620.0,337.0" fill="none" stroke="#d0693a" stroke-width="2.2" marker-end="url(#arrow-terra)"/>
<text x="560.0" y="323.0" fill="#d0693a" font-size="15" text-anchor="middle" font-weight="700">0.2</text>
<path d="M850.0,337.0 Q900.0,343.5 940.0,350.0" fill="none" stroke="#d0693a" stroke-width="2.2" marker-end="url(#arrow-terra)"/>
<rect x="620.0" y="395.0" width="230.0" height="64.0" rx="14" fill="#ffffff" stroke="#5a4fcf" stroke-width="2"/>
<text x="735.0" y="433.8" fill="#5a4fcf" font-size="19" text-anchor="middle" font-weight="700">趣味の分人 w⁽³⁾</text>
<path d="M500.0,325.0 Q560.0,376.0 620.0,427.0" fill="none" stroke="#5a4fcf" stroke-width="2.2" marker-end="url(#arrow-indigo)"/>
<text x="560.0" y="368.0" fill="#5a4fcf" font-size="15" text-anchor="middle" font-weight="700">0.1</text>
<path d="M850.0,427.0 Q900.0,388.5 940.0,350.0" fill="none" stroke="#5a4fcf" stroke-width="2.2" marker-end="url(#arrow-indigo)"/>
<rect x="940.0" y="310.0" width="210.0" height="80.0" rx="14" fill="#ffffff" stroke="#232a33" stroke-width="2"/>
<text x="1045.0" y="345.0" fill="#232a33" font-size="19" text-anchor="middle" font-weight="700">重みの合成 w(c)</text>
<text x="1045.0" y="371.0" fill="#5d6873" font-size="14" text-anchor="middle" font-weight="400">w(c) = Σ πⱼ(c) w⁽ʲ⁾</text>
<line x1="1045.0" y1="390.0" x2="1045.0" y2="440.0" stroke="#5d6873" stroke-width="2.2" marker-end="url(#arrow)"/>
<rect x="940.0" y="440.0" width="210.0" height="60.0" rx="14" fill="#ffffff" stroke="#232a33" stroke-width="2"/>
<text x="1045.0" y="476.8" fill="#232a33" font-size="19" text-anchor="middle" font-weight="700">行動の選択</text>
<rect x="60.0" y="545.0" width="1090.0" height="80.0" rx="14" fill="#dfe9eb" stroke="#2b7a8c" stroke-width="2"/>
<text x="605.0" y="580.0" fill="#2b7a8c" font-size="20" text-anchor="middle" font-weight="700">分人が共有する基盤</text>
<text x="605.0" y="606.0" fill="#232a33" font-size="15" text-anchor="middle" font-weight="400">記憶 ／ 身体 ／ 自己表象 ── どの分人の経験も、同じ個人の履歴として蓄積される</text>
<line x1="690.0" y1="545.0" x2="690.0" y2="462.0" stroke="#2b7a8c" stroke-width="1.5" marker-end="url(#arrow-teal)" stroke-dasharray="8 7"/>
<line x1="735.0" y1="545.0" x2="735.0" y2="462.0" stroke="#2b7a8c" stroke-width="1.5" marker-end="url(#arrow-teal)" stroke-dasharray="8 7"/>
<line x1="780.0" y1="545.0" x2="780.0" y2="462.0" stroke="#2b7a8c" stroke-width="1.5" marker-end="url(#arrow-teal)" stroke-dasharray="8 7"/>
<text x="50.0" y="652.0" fill="#5d6873" font-size="18" text-anchor="start" font-weight="400">混合エキスパートモデルと形式的に似ているが、数学的な類似性が心理的な分人の仕組みを証明するわけではない。</text>
</g>
</svg>
