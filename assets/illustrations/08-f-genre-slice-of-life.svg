<text x="370.0" y="504.0" fill="#232a33" font-size="12" text-anchor="middle" font-weight="700">季節の変化</text>
<rect x="450.0" y="430.0" width="60.0" height="50.0" rx="4" fill="#2b7a8c" stroke="#2b7a8c" stroke-width="2" opacity="0.9"/>
<text x="480.0" y="504.0" fill="#232a33" font-size="12" text-anchor="middle" font-weight="700">何もない時間</text>
<line x1="680.0" y1="480.0" x2="1120.0" y2="480.0" stroke="#232a33" stroke-width="1.5"/>
<rect x="720.0" y="410.0" width="60.0" height="70.0" rx="4" fill="#5d6873" stroke="#5d6873" stroke-width="2" opacity="0.9"/>
<text x="750.0" y="504.0" fill="#232a33" font-size="12" text-anchor="middle" font-weight="700">競争・達成</text>
