<text x="860.0" y="504.0" fill="#232a33" font-size="12" text-anchor="middle" font-weight="700">会話・食事</text>
<rect x="940.0" y="290.0" width="60.0" height="190.0" rx="4" fill="#2b7a8c" stroke="#2b7a8c" stroke-width="2" opacity="0.9"/>
<text x="970.0" y="504.0" fill="#232a33" font-size="12" text-anchor="middle" font-weight="700">季節の変化</text>
<rect x="1050.0" y="300.0" width="60.0" height="180.0" rx="4" fill="#2b7a8c" stroke="#2b7a8c" stroke-width="2" opacity="0.9"/>
<text x="1080.0" y="504.0" fill="#232a33" font-size="12" text-anchor="middle" font-weight="700">何もない時間</text>
<line x1="560.0" y1="360.0" x2="640.0" y2="360.0" stroke="#d0693a" stroke-width="3" marker-end="url(#arrow-terra)"/>
<text x="600.0" y="340.0" fill="#d0693a" font-size="13" text-anchor="middle" font-weight="700">重みの相対化</text>
<text x="600.0" y="540.0" fill="#5d6873" font-size="13" text-anchor="middle" font-weight="400">競争に勝たなくてもよい。成果を残さなくてもよい。そのような環境を物語の中に構築する</text>
<text x="50.0" y="572.0" fill="#5d6873" font-size="18" text-anchor="start" font-weight="400">達成という目的関数を完全に否定するわけではない。重視する場面とそうでない場面がある。</text>
