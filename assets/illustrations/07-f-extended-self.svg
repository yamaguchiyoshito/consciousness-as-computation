<circle cx="682.0" cy="533.5" r="9" fill="#d0693a"/>
<text x="698.0" y="539.5" fill="#232a33" font-size="17" text-anchor="start" font-weight="700">SNSアカウント</text>
<circle cx="360.0" cy="252.2" r="48" fill="url(#g07f-8)"/>
<circle cx="360.0" cy="252.2" r="9" fill="#5d6873"/>
<text x="344.0" y="258.2" fill="#232a33" font-size="17" text-anchor="end" font-weight="700">見知らぬ物</text>
<rect x="840.0" y="225.0" width="300.0" height="300.0" rx="14" fill="#ffffff" stroke="#d8d4c8" stroke-width="2"/>
<text x="990.0" y="262.0" fill="#232a33" font-size="20" text-anchor="middle" font-weight="700">距離を決める要素</text>
<text x="870.0" y="310.0" fill="#232a33" font-size="16" text-anchor="start" font-weight="400">制御：対象を制御できる程度</text>
<text x="870.0" y="348.0" fill="#232a33" font-size="16" text-anchor="start" font-weight="400">予測：変化を予測できる程度</text>
<text x="870.0" y="386.0" fill="#232a33" font-size="16" text-anchor="start" font-weight="400">記憶：経験と記憶の結びつき</text>
<text x="870.0" y="424.0" fill="#232a33" font-size="16" text-anchor="start" font-weight="400">価値：目的や価値観との関係</text>
<text x="870.0" y="462.0" fill="#232a33" font-size="16" text-anchor="start" font-weight="400">関係：対象を通じた他者との関係</text>
<text x="990.0" y="508.0" fill="#5d6873" font-size="14" text-anchor="middle" font-weight="400">SelfScore(x, c) = h(…, c)</text>
<text x="50.0" y="712.0" fill="#5d6873" font-size="18" text-anchor="start" font-weight="400">スコアは説明のための工学的な仮説であり、脳内に単一の数値が存在するという主張ではない。</text>
