or="#5a4fcf" stop-opacity="0"/></radialGradient><radialGradient id="g07f-6"><stop offset="0" stop-color="#d0693a" stop-opacity="0.4"/><stop offset="0.55" stop-color="#d0693a" stop-opacity="0.18"/><stop offset="1" stop-color="#d0693a" stop-opacity="0"/></radialGradient><radialGradient id="g07f-7"><stop offset="0" stop-color="#d0693a" stop-opacity="0.4"/><stop offset="0.55" stop-color="#d0693a" stop-opacity="0.18"/><stop offset="1" stop-color="#d0693a" stop-opacity="0"/></radialGradient><radialGradient id="g07f-8"><stop offset="0" stop-color="#5d6873" stop-opacity="0.4"/><stop offset="0.55" stop-color="#5d6873" stop-opacity="0.18"/><stop offset="1" stop-color="#5d6873" stop-opacity="0"/></radialGradient></defs>
<rect width="1200" height="740" rx="20" fill="#f7f5ef"/>
