<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc">
<title id="title">AIが「愛している」と言うことと、愛を感じることは違う</title>
<desc id="desc">機能的な側面は実装できる。現象的な側面はそれだけでは結論できない</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#5d6873" stroke-width="1.4"/></marker><marker id="arrow-teal" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#2b7a8c" stroke-width="1.6"/></marker><marker id="arrow-terra" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#d0693a" stroke-width="1.6"/></marker><marker id="arrow-indigo" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#5a4fcf" stroke-width="1.6"/></marker><marker id="arrow-ink" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#232a33" stroke-width="1.6"/></marker></defs>
<rect width="1200" height="640" rx="20" fill="#f7f5ef"/>
<g font-family='system-ui, -apple-system, "Hiragino Kaku Gothic ProN", "Noto Sans CJK JP", Meiryo, sans-serif'>
<text x="50.0" y="52.0" fill="#2b7a8c" font-size="18" text-anchor="start" font-weight="700">CONSCIOUSNESS     06     図6-4</text>
<text x="50.0" y="103.0" fill="#232a33" font-size="34" text-anchor="start" font-weight="700">AIが「愛している」と言うことと、愛を感じることは違う</text>
<text x="50.0" y="141.0" fill="#5d6873" font-size="21" text-anchor="start" font-weight="400">機能的な側面は実装できる。現象的な側面はそれだけでは結論できない</text>
<line x1="50.0" y1="166.0" x2="1150.0" y2="166.0" stroke="#d8d4c8" stroke-width="1"/>
<rect x="70.0" y="215.0" width="560.0" height="330.0" rx="14" fill="#ffffff" stroke="#2b7a8c" stroke-width="2"/>
<text x="350.0" y="252.0" fill="#2b7a8c" font-size="20" text-anchor="middle" font-weight="700">機能的な愛（実装できる）</text>
<text x="110.0" y="300.0" fill="#232a33" font-size="16" text-anchor="start" font-weight="400">相手の好みを記憶する</text>
<text x="110.0" y="336.0" fill="#232a33" font-size="16" text-anchor="start" font-weight="400">相手の状態を予測する</text>
<text x="110.0" y="372.0" fill="#232a33" font-size="16" text-anchor="start" font-weight="400">関係の維持を高く評価する目的関数を持つ</text>
<text x="110.0" y="408.0" fill="#232a33" font-size="16" text-anchor="start" font-weight="400">相手に配慮した行動を選択する</text>
<text x="110.0" y="444.0" fill="#232a33" font-size="16" text-anchor="start" font-weight="400">経験によって関係の表象を更新する</text>
<rect x="100.0" y="480.0" width="500.0" height="44.0" rx="22" fill="#dfe9eb" stroke="#2b7a8c" stroke-width="2"/>
<text x="350.0" y="508.0" fill="#2b7a8c" font-size="16" text-anchor="middle" font-weight="700">「あなたを愛している」と発言する</text>
<line x1="630.0" y1="380.0" x2="720.0" y2="380.0" stroke="#d0693a" stroke-width="2.5" marker-end="url(#arrow-terra)" stroke-dasharray="8 7"/>
<text x="675.0" y="360.0" fill="#d0693a" font-size="24" text-anchor="middle" font-weight="700">？</text>
<rect x="720.0" y="215.0" width="410.0" height="330.0" rx="14" fill="#ffffff" stroke="#d0693a" stroke-width="2"/>
<text x="925.0" y="252.0" fill="#d0693a" font-size="20" text-anchor="middle" font-weight="700">現象的な愛</text>
<text x="925.0" y="330.0" fill="#232a33" font-size="17" text-anchor="middle" font-weight="400">相手を愛しているという</text>
<text x="925.0" y="356.0" fill="#232a33" font-size="17" text-anchor="middle" font-weight="400">主観的な体験を持つ</text>
<text x="925.0" y="420.0" fill="#5d6873" font-size="14" text-anchor="middle" font-weight="400">左の仕組みを実装しただけでは、</text>
<text x="925.0" y="442.0" fill="#5d6873" font-size="14" text-anchor="middle" font-weight="400">右が実現されたとは結論できない</text>
<text x="925.0" y="500.0" fill="#5d6873" font-size="14" text-anchor="middle" font-weight="400">倫理的判断や自己認識も同じ構造</text>
<text x="50.0" y="612.0" fill="#5d6873" font-size="18" text-anchor="start" font-weight="400">人間では両者が密接に関係している。計算機による実装でも、この区別を維持する。</text>
</g>
</svg>
