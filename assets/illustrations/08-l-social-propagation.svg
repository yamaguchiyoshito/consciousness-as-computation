<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
<title id="title">物語は個人の内部と社会の間を循環する</title>
<desc id="desc">自分についての物語が共有され、他者の目的関数に影響し、新しい共通体験になる</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#5d6873" stroke-width="1.4"/></marker><marker id="arrow-teal" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#2b7a8c" stroke-width="1.6"/></marker><marker id="arrow-terra" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#d0693a" stroke-width="1.6"/></marker><marker id="arrow-indigo" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#5a4fcf" stroke-width="1.6"/></marker><marker id="arrow-ink" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#232a33" stroke-width="1.6"/></marker></defs>
<rect width="1200" height="760" rx="20" fill="#f7f5ef"/>
<g font-family='system-ui, -apple-system, "Hiragino Kaku Gothic ProN", "Noto Sans CJK JP", Meiryo, sans-serif'>
<text x="50.0" y="52.0" fill="#2b7a8c" font-size="18" text-anchor="start" font-weight="700">CONSCIOUSNESS     08     図8-12</text>
<text x="50.0" y="103.0" fill="#232a33" font-size="34" text-anchor="start" font-weight="700">物語は個人の内部と社会の間を循環する</text>
<text x="50.0" y="141.0" fill="#5d6873" font-size="21" text-anchor="start" font-weight="400">自分についての物語が共有され、他者の目的関数に影響し、新しい共通体験になる</text>
<line x1="50.0" y1="166.0" x2="1150.0" y2="166.0" stroke="#d8d4c8" stroke-width="1"/>
<path d="M658.9,294.0 Q695.4,289.7 710.0,323.5" fill="none" stroke="#5d6873" stroke-width="2.2" marker-end="url(#arrow)"/>
<path d="M768.9,425.5 Q790.9,455.0 768.9,484.5" fill="none" stroke="#5d6873" stroke-width="2.2" marker-end="url(#arrow)"/>
<path d="M710.0,586.5 Q695.4,620.3 658.9,616.0" fill="none" stroke="#5d6873" stroke-width="2.2" marker-end="url(#arrow)"/>
<path d="M541.1,616.0 Q504.6,620.3 490.0,586.5" fill="none" stroke="#5d6873" stroke-width="2.2" marker-end="url(#arrow)"/>
<path d="M431.1,484.5 Q409.1,455.0 431.1,425.5" fill="none" stroke="#5d6873" stroke-width="2.2" marker-end="url(#arrow)"/>
<path d="M490.0,323.5 Q504.6,289.7 541.1,294.0" fill="none" stroke="#5d6873" stroke-width="2.2" marker-end="url(#arrow)"/>
<circle cx="600.0" cy="260.0" r="64" fill="#ffffff"/>
<circle cx="600.0" cy="260.0" r="64" fill="none" stroke="#2b7a8c" stroke-width="2.5"/>
<text x="600.0" y="264.7" fill="#2b7a8c" font-size="13" text-anchor="middle" font-weight="700">個人の経験</text>
<circle cx="768.9" cy="357.5" r="64" fill="#ffffff"/>
<circle cx="768.9" cy="357.5" r="64" fill="none" stroke="#2b7a8c" stroke-width="2.5"/>
<text x="768.9" y="355.5" fill="#2b7a8c" font-size="13" text-anchor="middle" font-weight="700">自分についての</text>
<text x="768.9" y="372.5" fill="#2b7a8c" font-size="13" text-anchor="middle" font-weight="700">物語</text>
<circle cx="768.9" cy="552.5" r="64" fill="#ffffff"/>
<circle cx="768.9" cy="552.5" r="64" fill="none" stroke="#5a4fcf" stroke-width="2.5"/>
<text x="768.9" y="550.5" fill="#5a4fcf" font-size="13" text-anchor="middle" font-weight="700">共有</text>
<text x="768.9" y="567.5" fill="#5a4fcf" font-size="13" text-anchor="middle" font-weight="700">（会話・SNS・映像）</text>
<circle cx="600.0" cy="650.0" r="64" fill="#ffffff"/>
<circle cx="600.0" cy="650.0" r="64" fill="none" stroke="#5a4fcf" stroke-width="2.5"/>
<text x="600.0" y="648.0" fill="#5a4fcf" font-size="13" text-anchor="middle" font-weight="700">他者の解釈</text>
<text x="600.0" y="665.0" fill="#5a4fcf" font-size="13" text-anchor="middle" font-weight="700">（受け手で異なる）</text>
<circle cx="431.1" cy="552.5" r="64" fill="#ffffff"/>
<circle cx="431.1" cy="552.5" r="64" fill="none" stroke="#d0693a" stroke-width="2.5"/>
<text x="431.1" y="550.5" fill="#d0693a" font-size="13" text-anchor="middle" font-weight="700">他者の目的関数</text>
<text x="431.1" y="567.5" fill="#d0693a" font-size="13" text-anchor="middle" font-weight="700">への影響</text>
<circle cx="431.1" cy="357.5" r="64" fill="#ffffff"/>
<circle cx="431.1" cy="357.5" r="64" fill="none" stroke="#d0693a" stroke-width="2.5"/>
<text x="431.1" y="355.5" fill="#d0693a" font-size="13" text-anchor="middle" font-weight="700">新しい社会的な</text>
<text x="431.1" y="372.5" fill="#d0693a" font-size="13" text-anchor="middle" font-weight="700">共通体験</text>
<text x="600.0" y="449.0" fill="#5d6873" font-size="13" text-anchor="middle" font-weight="400">第1回の共通体験の変化へ戻る：</text>
<text x="600.0" y="469.0" fill="#5d6873" font-size="13" text-anchor="middle" font-weight="400">学習データは物理的な現実に限定されない</text>
<text x="50.0" y="732.0" fill="#5d6873" font-size="18" text-anchor="start" font-weight="400">価値観はプログラムのようにコピーされない。どう解釈し、どの程度取り入れるかは受け手の記憶・価値観・状況で異なる。</text>
