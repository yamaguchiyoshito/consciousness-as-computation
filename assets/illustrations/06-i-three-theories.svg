<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc">
<title id="title">三つの理論は、異なる対象を説明する</title>
<desc id="desc">接続はできるが、どれも単独で主観的体験の存在を導かない</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#5d6873" stroke-width="1.4"/></marker><marker id="arrow-teal" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#2b7a8c" stroke-width="1.6"/></marker><marker id="arrow-terra" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#d0693a" stroke-width="1.6"/></marker><marker id="arrow-indigo" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#5a4fcf" stroke-width="1.6"/></marker><marker id="arrow-ink" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#232a33" stroke-width="1.6"/></marker></defs>
<rect width="1200" height="640" rx="20" fill="#f7f5ef"/>
<g font-family='system-ui, -apple-system, "Hiragino Kaku Gothic ProN", "Noto Sans CJK JP", Meiryo, sans-serif'>
<text x="50.0" y="52.0" fill="#2b7a8c" font-size="18" text-anchor="start" font-weight="700">CONSCIOUSNESS     06     図6-9</text>
<text x="50.0" y="103.0" fill="#232a33" font-size="34" text-anchor="start" font-weight="700">三つの理論は、異なる対象を説明する</text>
<text x="50.0" y="141.0" fill="#5d6873" font-size="21" text-anchor="start" font-weight="400">接続はできるが、どれも単独で主観的体験の存在を導かない</text>
<line x1="50.0" y1="166.0" x2="1150.0" y2="166.0" stroke="#d8d4c8" stroke-width="1"/>
<rect x="70.0" y="215.0" width="340.0" height="220.0" rx="14" fill="#ffffff" stroke="#2b7a8c" stroke-width="2"/>
<text x="240.0" y="252.0" fill="#2b7a8c" font-size="20" text-anchor="middle" font-weight="700">目的関数モデル</text>
<text x="240.0" y="282.0" fill="#5d6873" font-size="12" text-anchor="middle" font-weight="400">説明する対象</text>
<text x="240.0" y="318.0" fill="#232a33" font-size="16" text-anchor="middle" font-weight="400">自己表象の形成</text>
<text x="240.0" y="350.0" fill="#232a33" font-size="16" text-anchor="middle" font-weight="400">目的関数の調停</text>
<text x="240.0" y="382.0" fill="#232a33" font-size="16" text-anchor="middle" font-weight="400">意思決定</text>
<rect x="430.0" y="215.0" width="340.0" height="220.0" rx="14" fill="#ffffff" stroke="#5a4fcf" stroke-width="2"/>
<text x="600.0" y="252.0" fill="#5a4fcf" font-size="20" text-anchor="middle" font-weight="700">予測処理</text>
<text x="600.0" y="282.0" fill="#5d6873" font-size="12" text-anchor="middle" font-weight="400">説明する対象</text>
<text x="600.0" y="318.0" fill="#232a33" font-size="16" text-anchor="middle" font-weight="400">世界の状態の推定</text>
<text x="600.0" y="350.0" fill="#232a33" font-size="16" text-anchor="middle" font-weight="400">感覚情報の解釈</text>
<text x="600.0" y="382.0" fill="#232a33" font-size="16" text-anchor="middle" font-weight="400">予測誤差による更新</text>
<rect x="790.0" y="215.0" width="340.0" height="220.0" rx="14" fill="#ffffff" stroke="#d0693a" stroke-width="2"/>
<text x="960.0" y="252.0" fill="#d0693a" font-size="20" text-anchor="middle" font-weight="700">統合情報理論（IIT）</text>
<text x="960.0" y="282.0" fill="#5d6873" font-size="12" text-anchor="middle" font-weight="400">説明する対象</text>
<text x="960.0" y="318.0" fill="#232a33" font-size="16" text-anchor="middle" font-weight="400">意識体験と</text>
<text x="960.0" y="350.0" fill="#232a33" font-size="16" text-anchor="middle" font-weight="400">因果的な情報統合の関係</text>
<line x1="410.0" y1="325.0" x2="430.0" y2="325.0" stroke="#5d6873" stroke-width="2" marker-end="url(#arrow)" marker-start="url(#arrow)" stroke-dasharray="8 7"/>
<line x1="770.0" y1="325.0" x2="790.0" y2="325.0" stroke="#5d6873" stroke-width="2" marker-end="url(#arrow)" marker-start="url(#arrow)" stroke-dasharray="8 7"/>
<text x="600.0" y="470.0" fill="#5d6873" font-size="14" text-anchor="middle" font-weight="400">接続</text>
<line x1="240.0" y1="480.0" x2="960.0" y2="480.0" stroke="#d8d4c8" stroke-width="1"/>
<rect x="150.0" y="500.0" width="900.0" height="70.0" rx="12" fill="#ffffff" stroke="#d0693a" stroke-width="2" stroke-dasharray="8 7"/>
<text x="600.0" y="528.0" fill="#d0693a" font-size="15" text-anchor="middle" font-weight="700">機能的な説明をどれほど詳細にしても、主観的体験の存在はそこから論理的に導かれるとは限らない</text>
<text x="600.0" y="553.0" fill="#5d6873" font-size="13" text-anchor="middle" font-weight="400">逆に、現象的意識の理論を採用しても、自己表象の形成や目的の調停は自動的には説明されない</text>
<text x="50.0" y="612.0" fill="#5d6873" font-size="18" text-anchor="start" font-weight="400">両者の問題を区別したまま接続する。これが本連載全体の前提である。</text>
</g>
</svg>
