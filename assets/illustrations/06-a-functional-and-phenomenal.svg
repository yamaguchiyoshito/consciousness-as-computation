<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" role="img" aria-labelledby="title desc">
<title id="title">機能的意識と現象的意識</title>
<desc id="desc">システムが何を行うかと、主体にどう感じられるかは別の問いである</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#5d6873" stroke-width="1.4"/></marker><marker id="arrow-teal" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#2b7a8c" stroke-width="1.6"/></marker><marker id="arrow-terra" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#d0693a" stroke-width="1.6"/></marker><marker id="arrow-indigo" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#5a4fcf" stroke-width="1.6"/></marker></defs>
<rect width="1200" height="660" rx="20" fill="#f7f5ef"/>
<g font-family='system-ui, -apple-system, "Hiragino Kaku Gothic ProN", "Noto Sans CJK JP", Meiryo, sans-serif'>
<text x="50.0" y="52.0" fill="#2b7a8c" font-size="18" text-anchor="start" font-weight="700">CONSCIOUSNESS     06     図6-1</text>
<text x="50.0" y="103.0" fill="#232a33" font-size="34" text-anchor="start" font-weight="700">機能的意識と現象的意識</text>
<text x="50.0" y="141.0" fill="#5d6873" font-size="21" text-anchor="start" font-weight="400">システムが何を行うかと、主体にどう感じられるかは別の問いである</text>
<line x1="50.0" y1="166.0" x2="1150.0" y2="166.0" stroke="#d8d4c8" stroke-width="1"/>
<rect x="90.0" y="215.0" width="400.0" height="350.0" rx="14" fill="#ffffff" stroke="#2b7a8c" stroke-width="2"/>
<text x="290.0" y="255.0" fill="#2b7a8c" font-size="24" text-anchor="middle" font-weight="700">機能的意識</text>
<text x="130.0" y="300.0" fill="#232a33" font-size="19" text-anchor="start" font-weight="400">情報を認識する</text>
<text x="130.0" y="340.0" fill="#232a33" font-size="19" text-anchor="start" font-weight="400">注意を配分する</text>
<text x="130.0" y="380.0" fill="#232a33" font-size="19" text-anchor="start" font-weight="400">状態を評価する</text>
<text x="130.0" y="420.0" fill="#232a33" font-size="19" text-anchor="start" font-weight="400">行動を選択する</text>
<text x="130.0" y="460.0" fill="#232a33" font-size="19" text-anchor="start" font-weight="400">経験を記憶する</text>
<text x="130.0" y="500.0" fill="#232a33" font-size="19" text-anchor="start" font-weight="400">自己表象を形成する</text>
<rect x="710.0" y="215.0" width="400.0" height="350.0" rx="14" fill="#ffffff" stroke="#d0693a" stroke-width="2"/>
<text x="910.0" y="255.0" fill="#d0693a" font-size="24" text-anchor="middle" font-weight="700">現象的意識</text>
<text x="750.0" y="300.0" fill="#232a33" font-size="19" text-anchor="start" font-weight="400">赤い色を見るという体験</text>
<text x="750.0" y="340.0" fill="#232a33" font-size="19" text-anchor="start" font-weight="400">痛みを感じるという体験</text>
<text x="750.0" y="380.0" fill="#232a33" font-size="19" text-anchor="start" font-weight="400">音楽を美しいと感じる体験</text>
<text x="750.0" y="420.0" fill="#232a33" font-size="19" text-anchor="start" font-weight="400">不安や喜びを感じる体験</text>
<text x="750.0" y="460.0" fill="#232a33" font-size="19" text-anchor="start" font-weight="400">自分が存在しているという感覚</text>
<line x1="490.0" y1="390.0" x2="710.0" y2="390.0" stroke="#d0693a" stroke-width="2.5" marker-end="url(#arrow-terra)" stroke-dasharray="8 7"/>
<text x="600.0" y="372.0" fill="#d0693a" font-size="30" text-anchor="middle" font-weight="700">？</text>
<text x="600.0" y="430.0" fill="#d0693a" font-size="18" text-anchor="middle" font-weight="700">ハードプロブレム</text>
<text x="600.0" y="455.0" fill="#5d6873" font-size="14" text-anchor="middle" font-weight="400">なぜ処理に体験が伴うのか</text>
<text x="290.0" y="595.0" fill="#5d6873" font-size="17" text-anchor="middle" font-weight="400">システムが何を行うか</text>
<text x="910.0" y="595.0" fill="#5d6873" font-size="17" text-anchor="middle" font-weight="400">主体にどう感じられるか</text>
<text x="50.0" y="632.0" fill="#5d6873" font-size="18" text-anchor="start" font-weight="400">機能的意識は計算機で近似できる。近似できても、現象的意識の存在が証明されたことにはならない。</text>
</g>
</svg>
