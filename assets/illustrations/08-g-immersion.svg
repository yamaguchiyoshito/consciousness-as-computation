<text x="600.0" y="436.0" fill="#d0693a" font-size="20" text-anchor="middle" font-weight="700">没入</text>
<text x="1050.0" y="400.0" fill="#5d6873" font-size="13" text-anchor="middle" font-weight="400">結びつきが強いほど</text>
<text x="1050.0" y="418.0" fill="#5d6873" font-size="13" text-anchor="middle" font-weight="400">自己表象・目的関数へ</text>
<text x="1050.0" y="436.0" fill="#5d6873" font-size="13" text-anchor="middle" font-weight="400">影響しやすい</text>
<text x="50.0" y="652.0" fill="#5d6873" font-size="18" text-anchor="start" font-weight="400">没入は自己と物語世界の境界の消失ではない。読者は登場人物に共感しながらも、自分と登場人物を区別できる。</text>
