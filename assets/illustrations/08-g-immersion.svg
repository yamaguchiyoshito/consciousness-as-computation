<text x="500.1" y="581.5" fill="#2b7a8c" font-size="12" text-anchor="middle" font-weight="700">関連づけ</text>
<circle cx="438.3" cy="377.5" r="52" fill="#ffffff"/>
<circle cx="438.3" cy="377.5" r="52" fill="none" stroke="#2b7a8c" stroke-width="2.5"/>
