<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
<title id="title">IITは問いを置き換える</title>
<desc id="desc">「なぜ処理に体験が伴うか」から「どの因果構造がどの体験に対応するか」へ</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#5d6873" stroke-width="1.4"/></marker><marker id="arrow-teal" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#2b7a8c" stroke-width="1.6"/></marker><marker id="arrow-terra" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#d0693a" stroke-width="1.6"/></marker><marker id="arrow-indigo" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#5a4fcf" stroke-width="1.6"/></marker><marker id="arrow-ink" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#232a33" stroke-width="1.6"/></marker></defs>
<rect width="1200" height="600" rx="20" fill="#f7f5ef"/>
<g font-family='system-ui, -apple-system, "Hiragino Kaku Gothic ProN", "Noto Sans CJK JP", Meiryo, sans-serif'>
<text x="50.0" y="52.0" fill="#2b7a8c" font-size="18" text-anchor="start" font-weight="700">CONSCIOUSNESS     06     図6-3</text>
<text x="50.0" y="103.0" fill="#232a33" font-size="34" text-anchor="start" font-weight="700">IITは問いを置き換える</text>
<text x="50.0" y="141.0" fill="#5d6873" font-size="21" text-anchor="start" font-weight="400">「なぜ処理に体験が伴うか」から「どの因果構造がどの体験に対応するか」へ</text>
<line x1="50.0" y1="166.0" x2="1150.0" y2="166.0" stroke="#d8d4c8" stroke-width="1"/>
<rect x="60" y="205" width="500" height="320" rx="16" fill="none" stroke="#c9c4b6" stroke-width="2" stroke-dasharray="7 7"/>
<text x="310.0" y="239.0" fill="#232a33" font-size="22" text-anchor="middle" font-weight="700">従来の問いの立て方</text>
<rect x="100.0" y="300.0" width="180.0" height="80.0" rx="14" fill="#ffffff" stroke="#232a33" stroke-width="2"/>
<text x="190.0" y="347.2" fill="#232a33" font-size="20" text-anchor="middle" font-weight="700">情報処理</text>
<rect x="340.0" y="300.0" width="180.0" height="80.0" rx="14" fill="#ffffff" stroke="#d0693a" stroke-width="2"/>
<text x="430.0" y="347.2" fill="#d0693a" font-size="20" text-anchor="middle" font-weight="700">意識体験</text>
<line x1="280.0" y1="340.0" x2="340.0" y2="340.0" stroke="#d0693a" stroke-width="2.5" marker-end="url(#arrow-terra)" stroke-dasharray="8 7"/>
<text x="310.0" y="325.0" fill="#d0693a" font-size="22" text-anchor="middle" font-weight="700">？</text>
<text x="310.0" y="430.0" fill="#5d6873" font-size="15" text-anchor="middle" font-weight="400">二つを別のものとして置き、</text>
<text x="310.0" y="452.0" fill="#5d6873" font-size="15" text-anchor="middle" font-weight="400">間の関係を説明しようとする</text>
<rect x="640" y="205" width="500" height="320" rx="16" fill="none" stroke="#c9c4b6" stroke-width="2" stroke-dasharray="7 7"/>
<text x="890.0" y="239.0" fill="#232a33" font-size="22" text-anchor="middle" font-weight="700">IITの立場</text>
<rect x="700.0" y="270.0" width="380.0" height="150.0" rx="16" fill="#dfe9eb" stroke="#2b7a8c" stroke-width="2"/>
<text x="890.0" y="305.0" fill="#2b7a8c" font-size="20" text-anchor="middle" font-weight="700">統合的な因果構造</text>
<text x="800.0" y="360.0" fill="#232a33" font-size="14" text-anchor="middle" font-weight="400">因果構造として記述</text>
<text x="980.0" y="360.0" fill="#232a33" font-size="14" text-anchor="middle" font-weight="400">体験として記述</text>
<line x1="880.0" y1="350.0" x2="900.0" y2="350.0" stroke="#d8d4c8" stroke-width="1"/>
<text x="890.0" y="395.0" fill="#2b7a8c" font-size="14" text-anchor="middle" font-weight="700">同じ現象の二つの記述</text>
<text x="890.0" y="450.0" fill="#232a33" font-size="15" text-anchor="middle" font-weight="400">問い：どのような因果構造が、</text>
<text x="890.0" y="472.0" fill="#232a33" font-size="15" text-anchor="middle" font-weight="400">どのような意識体験に対応するのか</text>
<text x="50.0" y="572.0" fill="#5d6873" font-size="18" text-anchor="start" font-weight="400">IITはハードプロブレムへの一つの理論的回答であり、問題を最終的に解決したわけではない。</text>
</g>
</svg>
