<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
<title id="title">予測を変えるか、入力を変えるか</title>
<desc id="desc">寒い部屋の例。不整合を減らす方法は内部モデルの修正だけではない</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#5d6873" stroke-width="1.4"/></marker><marker id="arrow-teal" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#2b7a8c" stroke-width="1.6"/></marker><marker id="arrow-terra" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#d0693a" stroke-width="1.6"/></marker><marker id="arrow-indigo" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#5a4fcf" stroke-width="1.6"/></marker><marker id="arrow-ink" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#232a33" stroke-width="1.6"/></marker></defs>
<rect width="1200" height="600" rx="20" fill="#f7f5ef"/>
<g font-family='system-ui, -apple-system, "Hiragino Kaku Gothic ProN", "Noto Sans CJK JP", Meiryo, sans-serif'>
<text x="50.0" y="52.0" fill="#2b7a8c" font-size="18" text-anchor="start" font-weight="700">CONSCIOUSNESS     04     図4-5</text>
<text x="50.0" y="103.0" fill="#232a33" font-size="34" text-anchor="start" font-weight="700">予測を変えるか、入力を変えるか</text>
<text x="50.0" y="141.0" fill="#5d6873" font-size="21" text-anchor="start" font-weight="400">寒い部屋の例。不整合を減らす方法は内部モデルの修正だけではない</text>
<line x1="50.0" y1="166.0" x2="1150.0" y2="166.0" stroke="#d8d4c8" stroke-width="1"/>
<rect x="470.0" y="215.0" width="260.0" height="80.0" rx="14" fill="#ffffff" stroke="#232a33" stroke-width="2"/>
<text x="600.0" y="250.0" fill="#232a33" font-size="20" text-anchor="middle" font-weight="700">感覚入力：寒い</text>
<text x="600.0" y="275.0" fill="#5d6873" font-size="13" text-anchor="middle" font-weight="400">予測との不整合</text>
<path d="M470.0,255.0 Q330.0,255.0 250.0,320.0" fill="none" stroke="#2b7a8c" stroke-width="2.5" marker-end="url(#arrow-teal)"/>
<path d="M730.0,255.0 Q870.0,255.0 950.0,320.0" fill="none" stroke="#d0693a" stroke-width="2.5" marker-end="url(#arrow-terra)"/>
<rect x="90.0" y="320.0" width="320.0" height="90.0" rx="14" fill="#ffffff" stroke="#2b7a8c" stroke-width="2"/>
<text x="250.0" y="360.0" fill="#2b7a8c" font-size="19" text-anchor="middle" font-weight="700">内部モデルを修正する</text>
<text x="250.0" y="385.0" fill="#5d6873" font-size="13" text-anchor="middle" font-weight="400">「室温は低い」と認識を更新する</text>
<rect x="790.0" y="320.0" width="320.0" height="90.0" rx="14" fill="#ffffff" stroke="#d0693a" stroke-width="2"/>
<text x="950.0" y="360.0" fill="#d0693a" font-size="19" text-anchor="middle" font-weight="700">行動で入力を変える</text>
<text x="950.0" y="385.0" fill="#5d6873" font-size="13" text-anchor="middle" font-weight="400">暖房をつける、衣服を足す</text>
<line x1="250.0" y1="410.0" x2="250.0" y2="460.0" stroke="#2b7a8c" stroke-width="2" marker-end="url(#arrow-teal)"/>
<line x1="950.0" y1="410.0" x2="950.0" y2="460.0" stroke="#d0693a" stroke-width="2" marker-end="url(#arrow-terra)"/>
<text x="250.0" y="490.0" fill="#2b7a8c" font-size="14" text-anchor="middle" font-weight="700">予測は合うが、寒さは解消しない</text>
<text x="950.0" y="490.0" fill="#d0693a" font-size="14" text-anchor="middle" font-weight="700">身体が受け取る感覚入力そのものが変わる</text>
<text x="600.0" y="545.0" fill="#5d6873" font-size="14" text-anchor="middle" font-weight="400">知覚と行動を一体として扱う考え方が、能動的推論につながる</text>
<text x="50.0" y="572.0" fill="#5d6873" font-size="18" text-anchor="start" font-weight="400">自由エネルギー原理の中心的な考え方。システムは世界への働きかけによって予測と観測の関係を変えられる。</text>
</g>
</svg>
