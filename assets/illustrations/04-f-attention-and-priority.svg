<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" role="img" aria-labelledby="title desc">
<title id="title">何が意識的な処理の対象になるのか</title>
<desc id="desc">予測誤差の大きさと、目的に照らした重要性の二段で選ばれる</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#5d6873" stroke-width="1.4"/></marker><marker id="arrow-teal" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#2b7a8c" stroke-width="1.6"/></marker><marker id="arrow-terra" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#d0693a" stroke-width="1.6"/></marker><marker id="arrow-indigo" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#5a4fcf" stroke-width="1.6"/></marker><marker id="arrow-ink" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#232a33" stroke-width="1.6"/></marker></defs>
<rect width="1200" height="660" rx="20" fill="#f7f5ef"/>
<g font-family='system-ui, -apple-system, "Hiragino Kaku Gothic ProN", "Noto Sans CJK JP", Meiryo, sans-serif'>
<text x="50.0" y="52.0" fill="#2b7a8c" font-size="18" text-anchor="start" font-weight="700">CONSCIOUSNESS     04     図4-6</text>
<text x="50.0" y="103.0" fill="#232a33" font-size="34" text-anchor="start" font-weight="700">何が意識的な処理の対象になるのか</text>
<text x="50.0" y="141.0" fill="#5d6873" font-size="21" text-anchor="start" font-weight="400">予測誤差の大きさと、目的に照らした重要性の二段で選ばれる</text>
<line x1="50.0" y1="166.0" x2="1150.0" y2="166.0" stroke="#d8d4c8" stroke-width="1"/>
<text x="190.0" y="215.0" fill="#5d6873" font-size="17" text-anchor="middle" font-weight="400">感覚器官からの入力</text>
<rect x="80.0" y="227.0" width="220.0" height="36.0" rx="18.0" fill="#ffffff" stroke="#2b7a8c" stroke-width="2"/>
<text x="190.0" y="251.1" fill="#2b7a8c" font-size="17" text-anchor="middle" font-weight="700">文章の内容</text>
<path d="M300,245 L1080,245 L1080,330" fill="none" stroke="#2b7a8c" stroke-width="2.5" marker-end="url(#arrow-teal)"/>
<text x="690.0" y="236.0" fill="#2b7a8c" font-size="14" text-anchor="middle" font-weight="400">現在の注意：予測どおりの入力が続き、誤差は小さい</text>
<rect x="430" y="265" width="220" height="310" rx="16" fill="none" stroke="#c9c4b6" stroke-width="2" stroke-dasharray="7 7"/>
<text x="540.0" y="299.0" fill="#232a33" font-size="22" text-anchor="middle" font-weight="700">予測誤差は大きいか</text>
<rect x="730" y="265" width="230" height="310" rx="16" fill="none" stroke="#c9c4b6" stroke-width="2" stroke-dasharray="7 7"/>
<text x="845.0" y="299.0" fill="#232a33" font-size="22" text-anchor="middle" font-weight="700">目的に照らして重要か</text>
<text x="540.0" y="325.0" fill="#5d6873" font-size="14" text-anchor="middle" font-weight="400">予測どおりの入力は</text>
<text x="540.0" y="343.0" fill="#5d6873" font-size="14" text-anchor="middle" font-weight="400">誤差が小さく、ここで止まる</text>
<text x="845.0" y="325.0" fill="#5d6873" font-size="14" text-anchor="middle" font-weight="400">誤差が大きくても</text>
<text x="845.0" y="343.0" fill="#5d6873" font-size="14" text-anchor="middle" font-weight="400">目的に無関係なら止まる</text>
<rect x="80.0" y="357.0" width="220.0" height="36.0" rx="18.0" fill="#ffffff" stroke="#5a4fcf" stroke-width="2"/>
<text x="190.0" y="381.1" fill="#5a4fcf" font-size="17" text-anchor="middle" font-weight="700">室温の変化</text>
<line x1="300.0" y1="375.0" x2="770.0" y2="375.0" stroke="#5a4fcf" stroke-width="2.2"/>
<line x1="778.0" y1="368.0" x2="792.0" y2="382.0" stroke="#5a4fcf" stroke-width="2"/>
<line x1="778.0" y1="382.0" x2="792.0" y2="368.0" stroke="#5a4fcf" stroke-width="2"/>
<rect x="80.0" y="407.0" width="220.0" height="36.0" rx="18.0" fill="#ffffff" stroke="#5d6873" stroke-width="2"/>
<text x="190.0" y="431.1" fill="#5d6873" font-size="17" text-anchor="middle" font-weight="700">身体の姿勢</text>
<line x1="300.0" y1="425.0" x2="470.0" y2="425.0" stroke="#d8d4c8" stroke-width="2" stroke-dasharray="8 7"/>
<line x1="478.0" y1="418.0" x2="492.0" y2="432.0" stroke="#5d6873" stroke-width="2"/>
<line x1="478.0" y1="432.0" x2="492.0" y2="418.0" stroke="#5d6873" stroke-width="2"/>
<rect x="80.0" y="457.0" width="220.0" height="36.0" rx="18.0" fill="#ffffff" stroke="#5d6873" stroke-width="2"/>
<text x="190.0" y="481.1" fill="#5d6873" font-size="17" text-anchor="middle" font-weight="700">周囲の物音</text>
<line x1="300.0" y1="475.0" x2="470.0" y2="475.0" stroke="#d8d4c8" stroke-width="2" stroke-dasharray="8 7"/>
<line x1="478.0" y1="468.0" x2="492.0" y2="482.0" stroke="#5d6873" stroke-width="2"/>
<line x1="478.0" y1="482.0" x2="492.0" y2="468.0" stroke="#5d6873" stroke-width="2"/>
<rect x="80.0" y="507.0" width="220.0" height="36.0" rx="18.0" fill="#ffffff" stroke="#d0693a" stroke-width="2"/>
<text x="190.0" y="531.1" fill="#d0693a" font-size="17" text-anchor="middle" font-weight="700">大きな音</text>
<path d="M300,525 L975,525 L975,370 L1000,370" fill="none" stroke="#d0693a" stroke-width="2.5" marker-end="url(#arrow-terra)"/>
<text x="845.0" y="555.0" fill="#5a4fcf" font-size="13" text-anchor="middle" font-weight="400">室温の変化は誤差が大きくても</text>
<text x="845.0" y="571.0" fill="#5a4fcf" font-size="13" text-anchor="middle" font-weight="400">目的に関わらないので止まる</text>
<rect x="1000.0" y="330.0" width="160.0" height="80.0" rx="14" fill="#ffffff" stroke="#232a33" stroke-width="2"/>
<text x="1080.0" y="376.8" fill="#232a33" font-size="19" text-anchor="middle" font-weight="700">注意の配分</text>
<line x1="1080.0" y1="410.0" x2="1080.0" y2="470.0" stroke="#d0693a" stroke-width="2" marker-end="url(#arrow-terra)"/>
<rect x="1000.0" y="470.0" width="160.0" height="70.0" rx="14" fill="#ffffff" stroke="#d0693a" stroke-width="2"/>
<text x="1080.0" y="511.5" fill="#d0693a" font-size="18" text-anchor="middle" font-weight="700">行動の変更</text>
<text x="1070.0" y="575.0" fill="#d0693a" font-size="14" text-anchor="middle" font-weight="400">読書を中断し、音の原因を確認する</text>
<text x="50.0" y="632.0" fill="#5d6873" font-size="18" text-anchor="start" font-weight="400">重要な情報とは予測誤差が大きい情報ではなく、現在の目的や状況に照らして処理する価値が高い情報である。</text>
</g>
</svg>
