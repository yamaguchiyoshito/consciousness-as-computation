<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc">
<title id="title">集約することと、相互依存することは違う</title>
<desc id="desc">左は分割しても働きが変わらない。右は分割すると因果構造が失われる</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#5d6873" stroke-width="1.4"/></marker><marker id="arrow-teal" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#2b7a8c" stroke-width="1.6"/></marker><marker id="arrow-terra" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#d0693a" stroke-width="1.6"/></marker><marker id="arrow-indigo" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#5a4fcf" stroke-width="1.6"/></marker><marker id="arrow-ink" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#232a33" stroke-width="1.6"/></marker></defs>
<rect width="1200" height="640" rx="20" fill="#f7f5ef"/>
<g font-family='system-ui, -apple-system, "Hiragino Kaku Gothic ProN", "Noto Sans CJK JP", Meiryo, sans-serif'>
<text x="50.0" y="52.0" fill="#2b7a8c" font-size="18" text-anchor="start" font-weight="700">CONSCIOUSNESS     05     図5-1</text>
<text x="50.0" y="103.0" fill="#232a33" font-size="34" text-anchor="start" font-weight="700">集約することと、相互依存することは違う</text>
<text x="50.0" y="141.0" fill="#5d6873" font-size="21" text-anchor="start" font-weight="400">左は分割しても働きが変わらない。右は分割すると因果構造が失われる</text>
<line x1="50.0" y1="166.0" x2="1150.0" y2="166.0" stroke="#d8d4c8" stroke-width="1"/>
<rect x="60" y="205" width="520" height="350" rx="16" fill="none" stroke="#c9c4b6" stroke-width="2" stroke-dasharray="7 7"/>
<text x="320.0" y="239.0" fill="#232a33" font-size="22" text-anchor="middle" font-weight="700">独立した処理の集合</text>
<rect x="95.0" y="265.0" width="130.0" height="70.0" rx="14" fill="#ffffff" stroke="#2b7a8c" stroke-width="2"/>
<text x="160.0" y="306.8" fill="#2b7a8c" font-size="19" text-anchor="middle" font-weight="700">安全性</text>
<line x1="160.0" y1="335.0" x2="160.0" y2="420.0" stroke="#2b7a8c" stroke-width="2" marker-end="url(#arrow-teal)"/>
<rect x="255.0" y="265.0" width="130.0" height="70.0" rx="14" fill="#ffffff" stroke="#5a4fcf" stroke-width="2"/>
<text x="320.0" y="306.8" fill="#5a4fcf" font-size="19" text-anchor="middle" font-weight="700">効率</text>
<line x1="320.0" y1="335.0" x2="320.0" y2="420.0" stroke="#5a4fcf" stroke-width="2" marker-end="url(#arrow-indigo)"/>
<rect x="415.0" y="265.0" width="130.0" height="70.0" rx="14" fill="#ffffff" stroke="#d0693a" stroke-width="2"/>
<text x="480.0" y="306.8" fill="#d0693a" font-size="19" text-anchor="middle" font-weight="700">情報獲得</text>
<line x1="480.0" y1="335.0" x2="480.0" y2="420.0" stroke="#d0693a" stroke-width="2" marker-end="url(#arrow-terra)"/>
<rect x="170.0" y="425.0" width="300.0" height="60.0" rx="14" fill="#ffffff" stroke="#232a33" stroke-width="2"/>
<text x="320.0" y="461.5" fill="#232a33" font-size="18" text-anchor="middle" font-weight="700">重み付き和  U = Σ wᵢ fᵢ</text>
<text x="320.0" y="525.0" fill="#5d6873" font-size="16" text-anchor="middle" font-weight="400">分割しても各部分の働きは変わらない</text>
<rect x="620" y="205" width="520" height="350" rx="16" fill="none" stroke="#c9c4b6" stroke-width="2" stroke-dasharray="7 7"/>
<text x="880.0" y="239.0" fill="#232a33" font-size="22" text-anchor="middle" font-weight="700">相互依存する処理の集合</text>
<rect x="700.0" y="260.0" width="130.0" height="60.0" rx="14" fill="#ffffff" stroke="#2b7a8c" stroke-width="2"/>
<text x="765.0" y="296.8" fill="#2b7a8c" font-size="19" text-anchor="middle" font-weight="700">安全性</text>
<rect x="960.0" y="260.0" width="130.0" height="60.0" rx="14" fill="#ffffff" stroke="#5a4fcf" stroke-width="2"/>
<text x="1025.0" y="296.8" fill="#5a4fcf" font-size="19" text-anchor="middle" font-weight="700">効率</text>
<rect x="830.0" y="370.0" width="130.0" height="60.0" rx="14" fill="#ffffff" stroke="#d0693a" stroke-width="2"/>
<text x="895.0" y="406.8" fill="#d0693a" font-size="19" text-anchor="middle" font-weight="700">情報獲得</text>
<line x1="830.0" y1="260.0" x2="960.0" y2="260.0" stroke="#2b7a8c" stroke-width="2.2" marker-end="url(#arrow-teal)"/>
<line x1="995.0" y1="320.0" x2="920.0" y2="372.0" stroke="#5a4fcf" stroke-width="2.2" marker-end="url(#arrow-indigo)"/>
<line x1="830.0" y1="372.0" x2="760.0" y2="320.0" stroke="#d0693a" stroke-width="2.2" marker-end="url(#arrow-terra)"/>
<text x="880.0" y="345.0" fill="#5d6873" font-size="14" text-anchor="middle" font-weight="400">互いの評価を変える</text>
<rect x="730.0" y="455.0" width="200.0" height="56.0" rx="14" fill="#ffffff" stroke="#232a33" stroke-width="2" stroke-dasharray="8 7"/>
<text x="830.0" y="489.5" fill="#232a33" font-size="18" text-anchor="middle" font-weight="700">自己表象</text>
<line x1="830.0" y1="430.0" x2="830.0" y2="455.0" stroke="#5d6873" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M930.0,480.0 Q1060.0,440.0 1030.0,320.0" fill="none" stroke="#5d6873" stroke-width="1.5" marker-end="url(#arrow)" stroke-dasharray="8 7"/>
<path d="M730.0,480.0 Q600.0,440.0 700.0,320.0" fill="none" stroke="#5d6873" stroke-width="1.5" marker-end="url(#arrow)" stroke-dasharray="8 7"/>
<text x="880.0" y="540.0" fill="#5d6873" font-size="16" text-anchor="middle" font-weight="400">分割すると因果的な関係が失われる</text>
<text x="50.0" y="612.0" fill="#5d6873" font-size="18" text-anchor="start" font-weight="400">Φは情報の量ではなく、全体に固有の因果構造が部分へどの程度還元できないかを問う。</text>
</g>
</svg>
