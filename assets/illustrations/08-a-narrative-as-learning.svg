<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
<title id="title">物語は目的関数を学習させる</title>
<desc id="desc">現実とは別の経路から、価値判断と結びついた経験を渡す</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#5d6873" stroke-width="1.4"/></marker><marker id="arrow-teal" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#2b7a8c" stroke-width="1.6"/></marker><marker id="arrow-terra" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#d0693a" stroke-width="1.6"/></marker><marker id="arrow-indigo" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#5a4fcf" stroke-width="1.6"/></marker><marker id="arrow-ink" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#232a33" stroke-width="1.6"/></marker></defs>
<rect width="1200" height="620" rx="20" fill="#f7f5ef"/>
<g font-family='system-ui, -apple-system, "Hiragino Kaku Gothic ProN", "Noto Sans CJK JP", Meiryo, sans-serif'>
<text x="50.0" y="52.0" fill="#2b7a8c" font-size="18" text-anchor="start" font-weight="700">CONSCIOUSNESS     08     図8-1</text>
<text x="50.0" y="103.0" fill="#232a33" font-size="34" text-anchor="start" font-weight="700">物語は目的関数を学習させる</text>
<text x="50.0" y="141.0" fill="#5d6873" font-size="21" text-anchor="start" font-weight="400">現実とは別の経路から、価値判断と結びついた経験を渡す</text>
<line x1="50.0" y1="166.0" x2="1150.0" y2="166.0" stroke="#d8d4c8" stroke-width="1"/>
<rect x="70.0" y="225.0" width="250.0" height="92.0" rx="14" fill="#ffffff" stroke="#2b7a8c" stroke-width="2"/>
<text x="195.0" y="266.0" fill="#2b7a8c" font-size="22" text-anchor="middle" font-weight="700">現実の経験</text>
<text x="195.0" y="295.0" fill="#5d6873" font-size="17" text-anchor="middle" font-weight="400">身体的な危険や責任が伴う</text>
<rect x="70.0" y="400.0" width="250.0" height="92.0" rx="14" fill="#ffffff" stroke="#d0693a" stroke-width="2"/>
<text x="195.0" y="441.0" fill="#d0693a" font-size="22" text-anchor="middle" font-weight="700">物語体験</text>
<text x="195.0" y="470.0" fill="#5d6873" font-size="17" text-anchor="middle" font-weight="400">追体験・代替的な経験</text>
<text x="195.0" y="525.0" fill="#5d6873" font-size="15" text-anchor="middle" font-weight="400">行動と結果の関係を示す</text>
<path d="M320.0,271.0 Q370.0,300.0 420.0,340.0" fill="none" stroke="#2b7a8c" stroke-width="2.5" marker-end="url(#arrow-teal)"/>
<path d="M320.0,446.0 Q370.0,420.0 420.0,376.0" fill="none" stroke="#d0693a" stroke-width="2.5" marker-end="url(#arrow-terra)"/>
<rect x="420.0" y="315.0" width="220.0" height="90.0" rx="14" fill="#ffffff" stroke="#232a33" stroke-width="2"/>
<text x="530.0" y="355.0" fill="#232a33" font-size="22" text-anchor="middle" font-weight="700">価値判断の学習</text>
<text x="530.0" y="384.0" fill="#5d6873" font-size="17" text-anchor="middle" font-weight="400">何が望ましいかの更新</text>
<line x1="640.0" y1="360.0" x2="700.0" y2="360.0" stroke="#5d6873" stroke-width="2.2" marker-end="url(#arrow)"/>
<rect x="700.0" y="315.0" width="260.0" height="90.0" rx="14" fill="#ffffff" stroke="#5a4fcf" stroke-width="2"/>
<text x="830.0" y="355.0" fill="#5a4fcf" font-size="20" text-anchor="middle" font-weight="700">目的関数・自己表象</text>
<text x="830.0" y="384.0" fill="#5d6873" font-size="17" text-anchor="middle" font-weight="400">の更新</text>
<line x1="960.0" y1="360.0" x2="1010.0" y2="360.0" stroke="#5d6873" stroke-width="2.2" marker-end="url(#arrow)"/>
<rect x="1010.0" y="315.0" width="140.0" height="90.0" rx="14" fill="#ffffff" stroke="#5a4fcf" stroke-width="2"/>
<text x="1080.0" y="355.0" fill="#5a4fcf" font-size="19" text-anchor="middle" font-weight="700">行動選択</text>
<text x="1080.0" y="384.0" fill="#5d6873" font-size="17" text-anchor="middle" font-weight="400">の変化</text>
<text x="690.0" y="470.0" fill="#5d6873" font-size="15" text-anchor="middle" font-weight="400">例：利己的な行動が信頼を壊し、協力が信頼を生む様子を追体験する</text>
<text x="50.0" y="592.0" fill="#5d6873" font-size="18" text-anchor="start" font-weight="400">物語の内容がそのまま目的関数として取り込まれるわけではない。現実とは異なる経路で評価基準に影響し得る。</text>
</g>
</svg>
