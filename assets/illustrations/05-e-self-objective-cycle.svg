<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc">
<title id="title">自己表象を核とする循環</title>
<desc id="desc">「自分」は結果であり、同時に次の処理に影響する内部状態である</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#5d6873" stroke-width="1.4"/></marker><marker id="arrow-teal" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#2b7a8c" stroke-width="1.6"/></marker><marker id="arrow-terra" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#d0693a" stroke-width="1.6"/></marker><marker id="arrow-indigo" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#5a4fcf" stroke-width="1.6"/></marker><marker id="arrow-ink" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#232a33" stroke-width="1.6"/></marker></defs>
<rect width="1200" height="640" rx="20" fill="#f7f5ef"/>
<g font-family='system-ui, -apple-system, "Hiragino Kaku Gothic ProN", "Noto Sans CJK JP", Meiryo, sans-serif'>
<text x="50.0" y="52.0" fill="#2b7a8c" font-size="18" text-anchor="start" font-weight="700">CONSCIOUSNESS     05     図5-5</text>
<text x="50.0" y="103.0" fill="#232a33" font-size="34" text-anchor="start" font-weight="700">自己表象を核とする循環</text>
<text x="50.0" y="141.0" fill="#5d6873" font-size="21" text-anchor="start" font-weight="400">「自分」は結果であり、同時に次の処理に影響する内部状態である</text>
<line x1="50.0" y1="166.0" x2="1150.0" y2="166.0" stroke="#d8d4c8" stroke-width="1"/>
<rect x="485.0" y="233.0" width="230.0" height="64.0" rx="14" fill="#ffffff" stroke="#2b7a8c" stroke-width="2"/>
<text x="600.0" y="271.8" fill="#2b7a8c" font-size="19" text-anchor="middle" font-weight="700">目的関数の相互作用</text>
<rect x="865.4" y="329.7" width="230.0" height="64.0" rx="14" fill="#ffffff" stroke="#d0693a" stroke-width="2"/>
<text x="980.4" y="368.6" fill="#d0693a" font-size="19" text-anchor="middle" font-weight="700">自己表象の形成</text>
<rect x="720.1" y="486.3" width="230.0" height="64.0" rx="14" fill="#ffffff" stroke="#5a4fcf" stroke-width="2"/>
<text x="835.1" y="525.1" fill="#5a4fcf" font-size="19" text-anchor="middle" font-weight="700">重み・評価への影響</text>
<rect x="249.9" y="486.3" width="230.0" height="64.0" rx="14" fill="#ffffff" stroke="#232a33" stroke-width="2"/>
<text x="364.9" y="525.1" fill="#232a33" font-size="19" text-anchor="middle" font-weight="700">行動の選択</text>
<rect x="104.6" y="329.7" width="230.0" height="64.0" rx="14" fill="#ffffff" stroke="#5d6873" stroke-width="2"/>
<text x="219.6" y="368.6" fill="#5d6873" font-size="19" text-anchor="middle" font-weight="700">経験の蓄積</text>
<line x1="721.1" y1="276.8" x2="859.3" y2="349.9" stroke="#5d6873" stroke-width="2.2" marker-end="url(#arrow)"/>
<line x1="895.4" y1="396.9" x2="920.2" y2="483.1" stroke="#5d6873" stroke-width="2.2" marker-end="url(#arrow)"/>
<line x1="710.1" y1="518.3" x2="489.9" y2="518.3" stroke="#5d6873" stroke-width="2.2" marker-end="url(#arrow)"/>
<line x1="279.8" y1="483.1" x2="304.6" y2="396.9" stroke="#5d6873" stroke-width="2.2" marker-end="url(#arrow)"/>
<line x1="340.7" y1="349.9" x2="478.9" y2="276.8" stroke="#5d6873" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="600.0" y="395.0" fill="#232a33" font-size="16" text-anchor="middle" font-weight="400">「自分」は情報処理の出力であると同時に、</text>
<text x="600.0" y="419.0" fill="#232a33" font-size="16" text-anchor="middle" font-weight="400">将来の情報処理に影響する内部状態である</text>
<text x="600.0" y="449.0" fill="#5d6873" font-size="14" text-anchor="middle" font-weight="400">循環が続くことで自己は構築され続ける</text>
<text x="50.0" y="612.0" fill="#5d6873" font-size="18" text-anchor="start" font-weight="400">目的関数の統合とIITの因果的な情報統合は同一ではない。両者の対応は本連載の仮説である。</text>
</g>
</svg>
