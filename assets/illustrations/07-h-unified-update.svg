<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="580" viewBox="0 0 1200 580" role="img" aria-labelledby="title desc">
<title id="title">分人の切り替えも、自己の拡張も、同じ自己表象の更新である</title>
<desc id="desc">変化する変数が違うだけで、どちらも S(t) = G(F, W, M, R, C) の更新になる</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#5d6873" stroke-width="1.4"/></marker><marker id="arrow-teal" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#2b7a8c" stroke-width="1.6"/></marker><marker id="arrow-terra" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#d0693a" stroke-width="1.6"/></marker><marker id="arrow-indigo" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#5a4fcf" stroke-width="1.6"/></marker><marker id="arrow-ink" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#232a33" stroke-width="1.6"/></marker></defs>
<rect width="1200" height="580" rx="20" fill="#f7f5ef"/>
<g font-family='system-ui, -apple-system, "Hiragino Kaku Gothic ProN", "Noto Sans CJK JP", Meiryo, sans-serif'>
<text x="50.0" y="52.0" fill="#2b7a8c" font-size="18" text-anchor="start" font-weight="700">CONSCIOUSNESS     07     図7-8</text>
<text x="50.0" y="103.0" fill="#232a33" font-size="34" text-anchor="start" font-weight="700">分人の切り替えも、自己の拡張も、同じ自己表象の更新である</text>
<text x="50.0" y="141.0" fill="#5d6873" font-size="21" text-anchor="start" font-weight="400">変化する変数が違うだけで、どちらも S(t) = G(F, W, M, R, C) の更新になる</text>
<line x1="50.0" y1="166.0" x2="1150.0" y2="166.0" stroke="#d8d4c8" stroke-width="1"/>
<rect x="350.0" y="225.0" width="500.0" height="150.0" rx="16" fill="#dfe9eb" stroke="#2b7a8c" stroke-width="2"/>
<text x="600.0" y="265.0" fill="#2b7a8c" font-size="19" text-anchor="middle" font-weight="700">自己表象  S(t) = G( F, W(t), M(t), R(t), C(t) )　（式7-4）</text>
<text x="600.0" y="297.0" fill="#232a33" font-size="14" text-anchor="middle" font-weight="400">F：目的関数の集合　W：重み　M：記憶</text>
<text x="600.0" y="321.0" fill="#232a33" font-size="14" text-anchor="middle" font-weight="400">R：他者・外部対象との関係　C：文脈</text>
<text x="600.0" y="353.0" fill="#5d6873" font-size="14" text-anchor="middle" font-weight="400">G：これらを統合する処理</text>
<rect x="70.0" y="245.0" width="230.0" height="110.0" rx="14" fill="#ffffff" stroke="#d0693a" stroke-width="2"/>
<text x="185.0" y="295.0" fill="#d0693a" font-size="20" text-anchor="middle" font-weight="700">分人の切り替え</text>
<text x="185.0" y="321.0" fill="#5d6873" font-size="14" text-anchor="middle" font-weight="400">主に W(t) と C(t) が変わる</text>
<rect x="900.0" y="245.0" width="230.0" height="110.0" rx="14" fill="#ffffff" stroke="#5a4fcf" stroke-width="2"/>
<text x="1015.0" y="295.0" fill="#5a4fcf" font-size="20" text-anchor="middle" font-weight="700">自己の拡張</text>
<text x="1015.0" y="321.0" fill="#5d6873" font-size="14" text-anchor="middle" font-weight="400">主に R(t) が変わる</text>
<line x1="300.0" y1="300.0" x2="350.0" y2="300.0" stroke="#d0693a" stroke-width="2.5" marker-end="url(#arrow-terra)"/>
<line x1="900.0" y1="300.0" x2="850.0" y2="300.0" stroke="#5a4fcf" stroke-width="2.5" marker-end="url(#arrow-indigo)"/>
<text x="185.0" y="395.0" fill="#5d6873" font-size="14" text-anchor="middle" font-weight="400">文脈で目的関数の</text>
<text x="185.0" y="415.0" fill="#5d6873" font-size="14" text-anchor="middle" font-weight="400">重み付けが変わる</text>
<text x="1015.0" y="395.0" fill="#5d6873" font-size="14" text-anchor="middle" font-weight="400">外部対象が自己表象と</text>
<text x="1015.0" y="415.0" fill="#5d6873" font-size="14" text-anchor="middle" font-weight="400">結びつく程度が変わる</text>
<text x="600.0" y="450.0" fill="#232a33" font-size="15" text-anchor="middle" font-weight="700">共通点：固定的な自己を前提とせず、自己表象の構成が動的に更新される</text>
<text x="600.0" y="480.0" fill="#5d6873" font-size="14" text-anchor="middle" font-weight="400">例：あるゲームでは大胆な分人が現れ、そのキャラクターが自己の延長として認識される</text>
<text x="50.0" y="552.0" fill="#5d6873" font-size="18" text-anchor="start" font-weight="400">両者は独立ではなく、相互に関係しながら変化する。</text>
</g>
</svg>
