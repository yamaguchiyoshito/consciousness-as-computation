<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc">
<title id="title">物語は傷ついた自己評価を再較正する</title>
<desc id="desc">現実の出来事は変えずに、出来事への評価と解釈を変える</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#5d6873" stroke-width="1.4"/></marker><marker id="arrow-teal" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#2b7a8c" stroke-width="1.6"/></marker><marker id="arrow-terra" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#d0693a" stroke-width="1.6"/></marker><marker id="arrow-indigo" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#5a4fcf" stroke-width="1.6"/></marker><marker id="arrow-ink" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#232a33" stroke-width="1.6"/></marker></defs>
<rect width="1200" height="640" rx="20" fill="#f7f5ef"/>
<g font-family='system-ui, -apple-system, "Hiragino Kaku Gothic ProN", "Noto Sans CJK JP", Meiryo, sans-serif'>
<text x="50.0" y="52.0" fill="#2b7a8c" font-size="18" text-anchor="start" font-weight="700">CONSCIOUSNESS     08     図8-3</text>
<text x="50.0" y="103.0" fill="#232a33" font-size="34" text-anchor="start" font-weight="700">物語は傷ついた自己評価を再較正する</text>
<text x="50.0" y="141.0" fill="#5d6873" font-size="21" text-anchor="start" font-weight="400">現実の出来事は変えずに、出来事への評価と解釈を変える</text>
<line x1="50.0" y1="166.0" x2="1150.0" y2="166.0" stroke="#d8d4c8" stroke-width="1"/>
<rect x="70.0" y="230.0" width="230.0" height="70.0" rx="14" fill="#ffffff" stroke="#5d6873" stroke-width="2"/>
<text x="185.0" y="271.1" fill="#5d6873" font-size="17" text-anchor="middle" font-weight="700">現実での失敗</text>
<line x1="300.0" y1="265.0" x2="345.0" y2="265.0" stroke="#5d6873" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="345.0" y="230.0" width="230.0" height="70.0" rx="14" fill="#ffffff" stroke="#5d6873" stroke-width="2"/>
<text x="460.0" y="271.1" fill="#5d6873" font-size="17" text-anchor="middle" font-weight="700">自己評価の低下</text>
<line x1="575.0" y1="265.0" x2="620.0" y2="265.0" stroke="#5d6873" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="620.0" y="230.0" width="230.0" height="70.0" rx="14" fill="#ffffff" stroke="#5d6873" stroke-width="2"/>
<text x="735.0" y="271.1" fill="#5d6873" font-size="17" text-anchor="middle" font-weight="700">将来の予測が悪化</text>
<line x1="850.0" y1="265.0" x2="895.0" y2="265.0" stroke="#5d6873" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="895.0" y="230.0" width="230.0" height="70.0" rx="14" fill="#ffffff" stroke="#5d6873" stroke-width="2"/>
<text x="1010.0" y="271.1" fill="#5d6873" font-size="17" text-anchor="middle" font-weight="700">挑戦を避ける</text>
<text x="460.0" y="325.0" fill="#5d6873" font-size="14" text-anchor="middle" font-weight="400">「自分には能力がない」「努力しても報われない」</text>
<rect x="70.0" y="420.0" width="420.0" height="90.0" rx="14" fill="#ffffff" stroke="#d0693a" stroke-width="2"/>
<text x="280.0" y="460.0" fill="#d0693a" font-size="18" text-anchor="middle" font-weight="700">物語による代替的な経験</text>
<text x="280.0" y="485.0" fill="#5d6873" font-size="13" text-anchor="middle" font-weight="400">評価者が誤っていた／成功以外にも価値がある</text>
<line x1="490.0" y1="465.0" x2="540.0" y2="465.0" stroke="#d0693a" stroke-width="2.5" marker-end="url(#arrow-terra)"/>
<rect x="540.0" y="420.0" width="260.0" height="90.0" rx="14" fill="#ffffff" stroke="#d0693a" stroke-width="2"/>
<text x="670.0" y="460.0" fill="#d0693a" font-size="18" text-anchor="middle" font-weight="700">評価基準の再構成</text>
<text x="670.0" y="485.0" fill="#5d6873" font-size="13" text-anchor="middle" font-weight="400">出来事の解釈が変わる</text>
<rect x="720.0" y="335.0" width="320.0" height="40.0" rx="20.0" fill="#ffffff" stroke="#d0693a" stroke-width="2"/>
<text x="880.0" y="360.4" fill="#d0693a" font-size="15" text-anchor="middle" font-weight="700">予測と行動が変わり得る</text>
<path d="M800.0,465.0 Q880.0,450.0 880.0,377.0" fill="none" stroke="#d0693a" stroke-width="2.5" marker-end="url(#arrow-terra)"/>
<text x="600.0" y="565.0" fill="#232a33" font-size="14" text-anchor="middle" font-weight="400">現実での失敗 → 自己評価の低下 → 物語による代替的な経験 → 評価基準の再構成</text>
<text x="50.0" y="612.0" fill="#5d6873" font-size="18" text-anchor="start" font-weight="400">「修復」は比喩であり、医学的な治療と同等の効果を主張するものではない。</text>
</g>
</svg>
