<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
<title id="title">物語を支える共通体験の基盤が広がる</title>
<desc id="desc">物理的な世界の経験に、デジタル空間の経験が加わる</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#5d6873" stroke-width="1.4"/></marker><marker id="arrow-teal" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#2b7a8c" stroke-width="1.6"/></marker><marker id="arrow-terra" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#d0693a" stroke-width="1.6"/></marker><marker id="arrow-indigo" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#5a4fcf" stroke-width="1.6"/></marker><marker id="arrow-ink" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#232a33" stroke-width="1.6"/></marker></defs>
<rect width="1200" height="650" rx="20" fill="#f7f5ef"/>
<g font-family='system-ui, -apple-system, "Hiragino Kaku Gothic ProN", "Noto Sans CJK JP", Meiryo, sans-serif'>
<text x="50.0" y="52.0" fill="#2b7a8c" font-size="18" text-anchor="start" font-weight="700">CONSCIOUSNESS     01     図1-3</text>
<text x="50.0" y="103.0" fill="#232a33" font-size="34" text-anchor="start" font-weight="700">物語を支える共通体験の基盤が広がる</text>
<text x="50.0" y="141.0" fill="#5d6873" font-size="21" text-anchor="start" font-weight="400">物理的な世界の経験に、デジタル空間の経験が加わる</text>
<line x1="50.0" y1="166.0" x2="1150.0" y2="166.0" stroke="#d8d4c8" stroke-width="1"/>
<rect x="60" y="205" width="500" height="260" rx="16" fill="none" stroke="#c9c4b6" stroke-width="2" stroke-dasharray="7 7"/>
<text x="310.0" y="239.0" fill="#232a33" font-size="22" text-anchor="middle" font-weight="700">物理的な世界の共通体験</text>
<rect x="640" y="205" width="500" height="260" rx="16" fill="none" stroke="#c9c4b6" stroke-width="2" stroke-dasharray="7 7"/>
<text x="890.0" y="239.0" fill="#232a33" font-size="22" text-anchor="middle" font-weight="700">デジタル空間の共通体験</text>
<rect x="90.0" y="255.0" width="440.0" height="54.0" rx="14" fill="#ffffff" stroke="#2b7a8c" stroke-width="2"/>
<text x="310.0" y="277.0" fill="#2b7a8c" font-size="18" text-anchor="middle" font-weight="700">学校</text>
<text x="310.0" y="303.0" fill="#5d6873" font-size="14" text-anchor="middle" font-weight="400">教室・部活・試験・文化祭</text>
<rect x="90.0" y="321.0" width="440.0" height="54.0" rx="14" fill="#ffffff" stroke="#2b7a8c" stroke-width="2"/>
<text x="310.0" y="343.0" fill="#2b7a8c" font-size="18" text-anchor="middle" font-weight="700">職場</text>
<text x="310.0" y="369.0" fill="#5d6873" font-size="14" text-anchor="middle" font-weight="400">人間関係・仕事上の葛藤</text>
<rect x="90.0" y="387.0" width="440.0" height="54.0" rx="14" fill="#ffffff" stroke="#2b7a8c" stroke-width="2"/>
<text x="310.0" y="409.0" fill="#2b7a8c" font-size="18" text-anchor="middle" font-weight="700">恋愛</text>
<text x="310.0" y="435.0" fill="#5d6873" font-size="14" text-anchor="middle" font-weight="400">対人関係の経験</text>
<rect x="670.0" y="255.0" width="440.0" height="54.0" rx="14" fill="#ffffff" stroke="#d0693a" stroke-width="2"/>
<text x="890.0" y="277.0" fill="#d0693a" font-size="18" text-anchor="middle" font-weight="700">ゲーム世界</text>
<text x="890.0" y="303.0" fill="#5d6873" font-size="14" text-anchor="middle" font-weight="400">レベル・スキル・クエスト・アイテム</text>
<rect x="670.0" y="321.0" width="440.0" height="54.0" rx="14" fill="#ffffff" stroke="#d0693a" stroke-width="2"/>
<text x="890.0" y="343.0" fill="#d0693a" font-size="18" text-anchor="middle" font-weight="700">SNS</text>
<text x="890.0" y="369.0" fill="#5d6873" font-size="14" text-anchor="middle" font-weight="400">アカウント・フォロワー・配信</text>
<rect x="670.0" y="387.0" width="440.0" height="54.0" rx="14" fill="#ffffff" stroke="#d0693a" stroke-width="2"/>
<text x="890.0" y="409.0" fill="#d0693a" font-size="18" text-anchor="middle" font-weight="700">アバター</text>
<text x="890.0" y="435.0" fill="#5d6873" font-size="14" text-anchor="middle" font-weight="400">VTuber・仮想の姿での関係</text>
<path d="M310.0,465.0 Q400.0,530.0 500.0,530.0" fill="none" stroke="#2b7a8c" stroke-width="2.5" marker-end="url(#arrow-teal)"/>
<path d="M890.0,465.0 Q800.0,530.0 700.0,530.0" fill="none" stroke="#d0693a" stroke-width="2.5" marker-end="url(#arrow-terra)"/>
<rect x="480.0" y="500.0" width="240.0" height="60.0" rx="14" fill="#ffffff" stroke="#232a33" stroke-width="2"/>
<text x="600.0" y="536.5" fill="#232a33" font-size="18" text-anchor="middle" font-weight="700">物語を理解する共通言語</text>
<text x="600.0" y="580.0" fill="#5d6873" font-size="15" text-anchor="middle" font-weight="400">置き換わる、あるいは拡張される</text>
<text x="50.0" y="622.0" fill="#5d6873" font-size="18" text-anchor="start" font-weight="400">学校や職場が共通体験でなくなったわけではない。基盤が物理的な世界だけに限定されなくなった。</text>
