<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
<title id="title">物語は分人の重みを変える</title>
<desc id="desc">仕事の分人の重みが、物語の前後でどう変わるか</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#5d6873" stroke-width="1.4"/></marker><marker id="arrow-teal" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#2b7a8c" stroke-width="1.6"/></marker><marker id="arrow-terra" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#d0693a" stroke-width="1.6"/></marker><marker id="arrow-indigo" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#5a4fcf" stroke-width="1.6"/></marker><marker id="arrow-ink" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#232a33" stroke-width="1.6"/></marker></defs>
<rect width="1200" height="620" rx="20" fill="#f7f5ef"/>
<g font-family='system-ui, -apple-system, "Hiragino Kaku Gothic ProN", "Noto Sans CJK JP", Meiryo, sans-serif'>
<text x="50.0" y="52.0" fill="#2b7a8c" font-size="18" text-anchor="start" font-weight="700">CONSCIOUSNESS     08     図8-11</text>
<text x="50.0" y="103.0" fill="#232a33" font-size="34" text-anchor="start" font-weight="700">物語は分人の重みを変える</text>
<text x="50.0" y="141.0" fill="#5d6873" font-size="21" text-anchor="start" font-weight="400">仕事の分人の重みが、物語の前後でどう変わるか</text>
<line x1="50.0" y1="166.0" x2="1150.0" y2="166.0" stroke="#d8d4c8" stroke-width="1"/>
<line x1="160.0" y1="480.0" x2="950.0" y2="480.0" stroke="#232a33" stroke-width="1.5"/>
<rect x="200.0" y="300.0" width="34.0" height="180.0" rx="4" fill="#d8d4c8" stroke="#d8d4c8" stroke-width="2"/>
<rect x="240.0" y="370.0" width="34.0" height="110.0" rx="4" fill="#2b7a8c" stroke="#2b7a8c" stroke-width="2" opacity="0.9"/>
<text x="237.0" y="506.0" fill="#232a33" font-size="15" text-anchor="middle" font-weight="700">競争</text>
<rect x="350.0" y="320.0" width="34.0" height="160.0" rx="4" fill="#d8d4c8" stroke="#d8d4c8" stroke-width="2"/>
<rect x="390.0" y="350.0" width="34.0" height="130.0" rx="4" fill="#2b7a8c" stroke="#2b7a8c" stroke-width="2" opacity="0.9"/>
<text x="387.0" y="506.0" fill="#232a33" font-size="15" text-anchor="middle" font-weight="700">達成</text>
<rect x="500.0" y="430.0" width="34.0" height="50.0" rx="4" fill="#d8d4c8" stroke="#d8d4c8" stroke-width="2"/>
<rect x="540.0" y="340.0" width="34.0" height="140.0" rx="4" fill="#2b7a8c" stroke="#2b7a8c" stroke-width="2" opacity="0.9"/>
<text x="537.0" y="506.0" fill="#232a33" font-size="15" text-anchor="middle" font-weight="700">挑戦</text>
<rect x="650.0" y="420.0" width="34.0" height="60.0" rx="4" fill="#d8d4c8" stroke="#d8d4c8" stroke-width="2"/>
<rect x="690.0" y="370.0" width="34.0" height="110.0" rx="4" fill="#2b7a8c" stroke="#2b7a8c" stroke-width="2" opacity="0.9"/>
<text x="687.0" y="506.0" fill="#232a33" font-size="15" text-anchor="middle" font-weight="700">関係</text>
<rect x="800.0" y="440.0" width="34.0" height="40.0" rx="4" fill="#d8d4c8" stroke="#d8d4c8" stroke-width="2"/>
<rect x="840.0" y="390.0" width="34.0" height="90.0" rx="4" fill="#2b7a8c" stroke="#2b7a8c" stroke-width="2" opacity="0.9"/>
<text x="837.0" y="506.0" fill="#232a33" font-size="15" text-anchor="middle" font-weight="700">休息</text>
<rect x="880.0" y="250.0" width="18.0" height="18.0" rx="3" fill="#d8d4c8" stroke="#d8d4c8" stroke-width="2"/>
<text x="908.0" y="264.0" fill="#232a33" font-size="14" text-anchor="start" font-weight="400">物語を読む前</text>
<rect x="880.0" y="280.0" width="18.0" height="18.0" rx="3" fill="#2b7a8c" stroke="#2b7a8c" stroke-width="2"/>
<text x="908.0" y="294.0" fill="#232a33" font-size="14" text-anchor="start" font-weight="400">物語を読んだ後</text>
<text x="1000.0" y="350.0" fill="#5d6873" font-size="13" text-anchor="middle" font-weight="400">例：失敗から立ち直る物語、</text>
<text x="1000.0" y="368.0" fill="#5d6873" font-size="13" text-anchor="middle" font-weight="400">日常系の物語に触れたあと</text>
<text x="600.0" y="555.0" fill="#5d6873" font-size="14" text-anchor="middle" font-weight="400">同じ状況に直面しても、以前とは異なる判断を行う可能性がある</text>
<text x="50.0" y="592.0" fill="#5d6873" font-size="18" text-anchor="start" font-weight="400">物語を読めば必ず重みが変わるわけではない。変化は目的関数の重みと自己表象の更新として捉えられる。</text>
