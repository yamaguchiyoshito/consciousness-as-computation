<circle cx="518.8" cy="246.8" r="3" fill="#d8d4c8"/>
<circle cx="1038.7" cy="272.4" r="3" fill="#d8d4c8"/>
<text x="50.0" y="240.0" fill="#232a33" font-size="24" text-anchor="start" font-weight="700">意識は「自分」を発見するのではなく、</text>
<text x="50.0" y="278.0" fill="#232a33" font-size="24" text-anchor="start" font-weight="700">構築しているのかもしれない。</text>
<text x="50.0" y="330.0" fill="#5d6873" font-size="19" text-anchor="start" font-weight="400">現実とバーチャルの境界から出発し、</text>
<text x="50.0" y="362.0" fill="#5d6873" font-size="19" text-anchor="start" font-weight="400">目的関数、予測処理、情報統合、</text>
<text x="50.0" y="394.0" fill="#5d6873" font-size="19" text-anchor="start" font-weight="400">現象的意識、分人、物語を経て、</text>
<text x="50.0" y="426.0" fill="#5d6873" font-size="19" text-anchor="start" font-weight="400">「自分」を計算可能な構造として</text>
<text x="50.0" y="458.0" fill="#5d6873" font-size="19" text-anchor="start" font-weight="400">捉え直す。</text>
<text x="50.0" y="652.0" fill="#5d6873" font-size="18" text-anchor="start" font-weight="400">全9回　境界を問う ／ 自己のモデル ／ 体験と複数の自己 ／ 計算機で確かめる</text>
