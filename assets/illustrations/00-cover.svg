<text x="780.0" y="222.0" fill="#2b7a8c" font-size="17" text-anchor="middle" font-weight="700">「自分」＝情報処理が引く境界</text>
<text x="1120.0" y="630.0" fill="#5d6873" font-size="18" text-anchor="end" font-weight="400">外界</text>
<circle cx="1026.2" cy="499.6" r="3" fill="#d8d4c8"/>
<circle cx="995.1" cy="617.7" r="3" fill="#d8d4c8"/>
