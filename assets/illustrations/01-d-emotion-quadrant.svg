<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" role="img" aria-labelledby="title desc">
<title id="title">対象の存在と、感情の現実性は別の問いである</title>
<desc id="desc">仮想の対象に対しても、現実の感情が生じる</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#5d6873" stroke-width="1.4"/></marker><marker id="arrow-teal" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#2b7a8c" stroke-width="1.6"/></marker><marker id="arrow-terra" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#d0693a" stroke-width="1.6"/></marker><marker id="arrow-indigo" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#5a4fcf" stroke-width="1.6"/></marker><marker id="arrow-ink" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#232a33" stroke-width="1.6"/></marker></defs>
<rect width="1200" height="660" rx="20" fill="#f7f5ef"/>
<g font-family='system-ui, -apple-system, "Hiragino Kaku Gothic ProN", "Noto Sans CJK JP", Meiryo, sans-serif'>
<text x="50.0" y="52.0" fill="#2b7a8c" font-size="18" text-anchor="start" font-weight="700">CONSCIOUSNESS     01     図1-4</text>
<text x="50.0" y="103.0" fill="#232a33" font-size="34" text-anchor="start" font-weight="700">対象の存在と、感情の現実性は別の問いである</text>
<text x="50.0" y="141.0" fill="#5d6873" font-size="21" text-anchor="start" font-weight="400">仮想の対象に対しても、現実の感情が生じる</text>
<line x1="50.0" y1="166.0" x2="1150.0" y2="166.0" stroke="#d8d4c8" stroke-width="1"/>
<rect x="260.0" y="215.0" width="340.0" height="170.0" rx="0" fill="#ffffff" stroke="#d8d4c8" stroke-width="2"/>
<rect x="600.0" y="215.0" width="340.0" height="170.0" rx="0" fill="#dfe9eb" stroke="#2b7a8c" stroke-width="2"/>
<rect x="260.0" y="385.0" width="340.0" height="170.0" rx="0" fill="#ffffff" stroke="#d8d4c8" stroke-width="2"/>
<rect x="600.0" y="385.0" width="340.0" height="170.0" rx="0" fill="#ffffff" stroke="#d8d4c8" stroke-width="2"/>
<text x="430.0" y="201.0" fill="#232a33" font-size="15" text-anchor="middle" font-weight="700">対象が物理的に存在する</text>
<text x="770.0" y="201.0" fill="#232a33" font-size="15" text-anchor="middle" font-weight="700">対象は物理的に存在しない</text>
<text x="244.0" y="300.0" fill="#232a33" font-size="15" text-anchor="end" font-weight="700">感情が</text>
<text x="244.0" y="320.0" fill="#232a33" font-size="15" text-anchor="end" font-weight="700">生じる</text>
<text x="244.0" y="470.0" fill="#5d6873" font-size="15" text-anchor="end" font-weight="400">感情が</text>
<text x="244.0" y="490.0" fill="#5d6873" font-size="15" text-anchor="end" font-weight="400">生じない</text>
<text x="430.0" y="285.0" fill="#232a33" font-size="15" text-anchor="middle" font-weight="400">例：親しい人との別れ</text>
<text x="430.0" y="311.0" fill="#232a33" font-size="15" text-anchor="middle" font-weight="400">現実の対象・現実の感情</text>
<text x="770.0" y="275.0" fill="#2b7a8c" font-size="15" text-anchor="middle" font-weight="700">例：育てたキャラクターの喪失</text>
<text x="770.0" y="301.0" fill="#2b7a8c" font-size="15" text-anchor="middle" font-weight="700">SNSでの評価や批判</text>
<text x="770.0" y="327.0" fill="#2b7a8c" font-size="15" text-anchor="middle" font-weight="700">仮想の対象・現実の感情</text>
<text x="430.0" y="465.0" fill="#5d6873" font-size="15" text-anchor="middle" font-weight="400">例：通り過ぎる見知らぬ物体</text>
<text x="770.0" y="465.0" fill="#5d6873" font-size="15" text-anchor="middle" font-weight="400">例：操作していない背景の人物</text>
<text x="600.0" y="595.0" fill="#5d6873" font-size="14" text-anchor="middle" font-weight="400">感情の現実性は、対象の存在ではなく、感覚情報・記憶・予測から構築された対象への反応で決まる</text>
<text x="50.0" y="632.0" fill="#5d6873" font-size="18" text-anchor="start" font-weight="400">右上の象限が、意識は物理的な実体そのものではなく、構築された対象に反応することを示す。</text>
</g>
</svg>
