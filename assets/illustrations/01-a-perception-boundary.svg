<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
<title id="title">現実とバーチャルは、知覚の手前で合流する</title>
<desc id="desc">脳が受け取るのは感覚情報だけである</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#5d6873" stroke-width="1.4"/></marker><marker id="arrow-teal" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#2b7a8c" stroke-width="1.6"/></marker><marker id="arrow-terra" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#d0693a" stroke-width="1.6"/></marker><marker id="arrow-indigo" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#5a4fcf" stroke-width="1.6"/></marker></defs>
<rect width="1200" height="600" rx="20" fill="#f7f5ef"/>
<g font-family='system-ui, -apple-system, "Hiragino Kaku Gothic ProN", "Noto Sans CJK JP", Meiryo, sans-serif'>
<text x="50.0" y="52.0" fill="#2b7a8c" font-size="18" text-anchor="start" font-weight="700">CONSCIOUSNESS     01     図1-1</text>
<text x="50.0" y="103.0" fill="#232a33" font-size="34" text-anchor="start" font-weight="700">現実とバーチャルは、知覚の手前で合流する</text>
<text x="50.0" y="141.0" fill="#5d6873" font-size="21" text-anchor="start" font-weight="400">脳が受け取るのは感覚情報だけである</text>
<line x1="50.0" y1="166.0" x2="1150.0" y2="166.0" stroke="#d8d4c8" stroke-width="1"/>
<rect x="70.0" y="225.0" width="270.0" height="90.0" rx="14" fill="#ffffff" stroke="#2b7a8c" stroke-width="2"/>
<text x="205.0" y="265.0" fill="#2b7a8c" font-size="22" text-anchor="middle" font-weight="700">現実の光景</text>
<text x="205.0" y="294.0" fill="#5d6873" font-size="17" text-anchor="middle" font-weight="400">撮影された人物や風景</text>
<rect x="70.0" y="395.0" width="270.0" height="90.0" rx="14" fill="#ffffff" stroke="#d0693a" stroke-width="2"/>
<text x="205.0" y="435.0" fill="#d0693a" font-size="22" text-anchor="middle" font-weight="700">生成された映像</text>
<text x="205.0" y="464.0" fill="#5d6873" font-size="17" text-anchor="middle" font-weight="400">CG・生成AI</text>
<line x1="400.0" y1="205.0" x2="400.0" y2="520.0" stroke="#d8d4c8" stroke-width="2" stroke-dasharray="8 7"/>
<text x="400.0" y="548.0" fill="#5d6873" font-size="17" text-anchor="middle" font-weight="400">物理的な境界</text>
<rect x="480.0" y="310.0" width="240.0" height="90.0" rx="14" fill="#ffffff" stroke="#232a33" stroke-width="2"/>
<text x="600.0" y="350.0" fill="#232a33" font-size="22" text-anchor="middle" font-weight="700">感覚情報</text>
<text x="600.0" y="379.0" fill="#5d6873" font-size="17" text-anchor="middle" font-weight="400">光・音・圧力 → 神経信号</text>
<path d="M340.0,270.0 Q420.0,290.0 480.0,345.0" fill="none" stroke="#2b7a8c" stroke-width="2.5" marker-end="url(#arrow-teal)"/>
<path d="M340.0,440.0 Q420.0,420.0 480.0,375.0" fill="none" stroke="#d0693a" stroke-width="2.5" marker-end="url(#arrow-terra)"/>
<line x1="720.0" y1="355.0" x2="790.0" y2="355.0" stroke="#5d6873" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="790.0" y="310.0" width="160.0" height="90.0" rx="14" fill="#ffffff" stroke="#232a33" stroke-width="2"/>
<text x="870.0" y="362.9" fill="#232a33" font-size="22" text-anchor="middle" font-weight="700">認識</text>
<line x1="950.0" y1="355.0" x2="1010.0" y2="355.0" stroke="#5d6873" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="1010.0" y="310.0" width="140.0" height="90.0" rx="14" fill="#ffffff" stroke="#232a33" stroke-width="2"/>
<text x="1080.0" y="362.9" fill="#232a33" font-size="22" text-anchor="middle" font-weight="700">体験</text>
<text x="815.0" y="470.0" fill="#5d6873" font-size="18" text-anchor="middle" font-weight="400">源が異なっても、感覚情報が似ていれば体験は似る</text>
<line x1="560.0" y1="440.0" x2="1070.0" y2="440.0" stroke="#d8d4c8" stroke-width="1"/>
<text x="50.0" y="572.0" fill="#5d6873" font-size="18" text-anchor="start" font-weight="400">区別できなくなったのは物理的な実体ではなく、知覚による判別である。</text>
</g>
</svg>
