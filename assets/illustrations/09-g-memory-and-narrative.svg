<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
<title id="title">三種類の記憶からナラティブを生成し、行動へ戻す</title>
<desc id="desc">出来事・知識・自分についての認識を分け、物語として関係づける</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#5d6873" stroke-width="1.4"/></marker><marker id="arrow-teal" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#2b7a8c" stroke-width="1.6"/></marker><marker id="arrow-terra" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#d0693a" stroke-width="1.6"/></marker><marker id="arrow-indigo" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#5a4fcf" stroke-width="1.6"/></marker><marker id="arrow-ink" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#232a33" stroke-width="1.6"/></marker></defs>
<rect width="1200" height="680" rx="20" fill="#f7f5ef"/>
<g font-family='system-ui, -apple-system, "Hiragino Kaku Gothic ProN", "Noto Sans CJK JP", Meiryo, sans-serif'>
<text x="50.0" y="52.0" fill="#2b7a8c" font-size="18" text-anchor="start" font-weight="700">CONSCIOUSNESS     09     図9-7</text>
<text x="50.0" y="103.0" fill="#232a33" font-size="34" text-anchor="start" font-weight="700">三種類の記憶からナラティブを生成し、行動へ戻す</text>
<text x="50.0" y="141.0" fill="#5d6873" font-size="21" text-anchor="start" font-weight="400">出来事・知識・自分についての認識を分け、物語として関係づける</text>
<line x1="50.0" y1="166.0" x2="1150.0" y2="166.0" stroke="#d8d4c8" stroke-width="1"/>
<rect x="70.0" y="215.0" width="360.0" height="80.0" rx="14" fill="#ffffff" stroke="#2b7a8c" stroke-width="2"/>
<text x="250.0" y="250.0" fill="#2b7a8c" font-size="18" text-anchor="middle" font-weight="700">エピソード記憶</text>
<text x="250.0" y="274.0" fill="#5d6873" font-size="12" text-anchor="middle" font-weight="400">経験した具体的な出来事</text>
<text x="250.0" y="310.0" fill="#5d6873" font-size="11" text-anchor="middle" font-weight="400">「ある場所を探索して失敗した」</text>
<path d="M430.0,255.0 Q480.0,255.0 520.0,370.0" fill="none" stroke="#2b7a8c" stroke-width="2.2" marker-end="url(#arrow-teal)"/>
<rect x="70.0" y="315.0" width="360.0" height="80.0" rx="14" fill="#ffffff" stroke="#5a4fcf" stroke-width="2"/>
<text x="250.0" y="350.0" fill="#5a4fcf" font-size="18" text-anchor="middle" font-weight="700">意味記憶</text>
<text x="250.0" y="374.0" fill="#5d6873" font-size="12" text-anchor="middle" font-weight="400">経験から得た一般的な知識</text>
<text x="250.0" y="410.0" fill="#5d6873" font-size="11" text-anchor="middle" font-weight="400">「協力は探索の成功率を高める」</text>
<path d="M430.0,355.0 Q480.0,355.0 520.0,370.0" fill="none" stroke="#5a4fcf" stroke-width="2.2" marker-end="url(#arrow-indigo)"/>
<rect x="70.0" y="415.0" width="360.0" height="80.0" rx="14" fill="#ffffff" stroke="#d0693a" stroke-width="2"/>
<text x="250.0" y="450.0" fill="#d0693a" font-size="18" text-anchor="middle" font-weight="700">自己記憶</text>
<text x="250.0" y="474.0" fill="#5d6873" font-size="12" text-anchor="middle" font-weight="400">自分自身に関する情報</text>
<text x="250.0" y="510.0" fill="#5d6873" font-size="11" text-anchor="middle" font-weight="400">「自分は協力した探索に向いている」</text>
<path d="M430.0,455.0 Q480.0,455.0 520.0,370.0" fill="none" stroke="#d0693a" stroke-width="2.2" marker-end="url(#arrow-terra)"/>
<rect x="520.0" y="300.0" width="340.0" height="140.0" rx="14" fill="#ffffff" stroke="#232a33" stroke-width="2"/>
<text x="690.0" y="332.0" fill="#232a33" font-size="18" text-anchor="middle" font-weight="700">ナラティブの生成</text>
<text x="690.0" y="362.0" fill="#232a33" font-size="13" text-anchor="middle" font-weight="400">「単独で探索すると失敗しやすいが、</text>
<text x="690.0" y="382.0" fill="#232a33" font-size="13" text-anchor="middle" font-weight="400">他者と協力することで成功できる」</text>
<text x="690.0" y="415.0" fill="#5d6873" font-size="11" text-anchor="middle" font-weight="400">出来事の列挙ではなく、自分についての意味</text>
<line x1="860.0" y1="370.0" x2="920.0" y2="370.0" stroke="#5d6873" stroke-width="2.2" marker-end="url(#arrow)"/>
<rect x="920.0" y="320.0" width="220.0" height="100.0" rx="14" fill="#ffffff" stroke="#d0693a" stroke-width="2"/>
<text x="1030.0" y="365.0" fill="#d0693a" font-size="16" text-anchor="middle" font-weight="700">能力評価・行動傾向</text>
<text x="1030.0" y="390.0" fill="#5d6873" font-size="13" text-anchor="middle" font-weight="400">の抽出</text>
<path d="M1030,420 L1030,560 L250,560 L250,520" fill="none" stroke="#d0693a" stroke-width="2.2" marker-end="url(#arrow-terra)" stroke-dasharray="8 7"/>
<text x="640.0" y="550.0" fill="#d0693a" font-size="12" text-anchor="middle" font-weight="400">次の意思決定に利用する（文章として保存するだけでは機能が限定的）</text>
<text x="600.0" y="610.0" fill="#5d6873" font-size="12" text-anchor="middle" font-weight="400">実際の行動履歴と、生成されたナラティブは区別して保持する。後からの説明が本当の原因と異なることがある</text>
<text x="50.0" y="652.0" fill="#5d6873" font-size="18" text-anchor="start" font-weight="400">第7回と第8回の、記憶とナラティブが自己の連続性を形成するという仮説の計算機上での近似。</text>
</g>
</svg>
