<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
<title id="title">何を基準に、ある対象を「自分」とするのか</title>
<desc id="desc">候補となる評価基準と、次回へ持ち越す問い</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#5d6873" stroke-width="1.4"/></marker><marker id="arrow-teal" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#2b7a8c" stroke-width="1.6"/></marker><marker id="arrow-terra" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#d0693a" stroke-width="1.6"/></marker><marker id="arrow-indigo" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#5a4fcf" stroke-width="1.6"/></marker><marker id="arrow-ink" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#232a33" stroke-width="1.6"/></marker></defs>
<rect width="1200" height="600" rx="20" fill="#f7f5ef"/>
<g font-family='system-ui, -apple-system, "Hiragino Kaku Gothic ProN", "Noto Sans CJK JP", Meiryo, sans-serif'>
<text x="50.0" y="52.0" fill="#2b7a8c" font-size="18" text-anchor="start" font-weight="700">CONSCIOUSNESS     02     図2-6</text>
<text x="50.0" y="103.0" fill="#232a33" font-size="34" text-anchor="start" font-weight="700">何を基準に、ある対象を「自分」とするのか</text>
<text x="50.0" y="141.0" fill="#5d6873" font-size="21" text-anchor="start" font-weight="400">候補となる評価基準と、次回へ持ち越す問い</text>
<line x1="50.0" y1="166.0" x2="1150.0" y2="166.0" stroke="#d8d4c8" stroke-width="1"/>
<rect x="70.0" y="215.0" width="360.0" height="72.0" rx="14" fill="#ffffff" stroke="#2b7a8c" stroke-width="2"/>
<text x="250.0" y="246.0" fill="#2b7a8c" font-size="18" text-anchor="middle" font-weight="700">生命の維持に重要か</text>
<text x="250.0" y="272.0" fill="#5d6873" font-size="14" text-anchor="middle" font-weight="400">脳・心臓・身体</text>
<path d="M430.0,251.0 Q500.0,251.0 560.0,358.0" fill="none" stroke="#2b7a8c" stroke-width="2.2" marker-end="url(#arrow-teal)"/>
<rect x="70.0" y="310.0" width="360.0" height="72.0" rx="14" fill="#ffffff" stroke="#2b7a8c" stroke-width="2"/>
<text x="250.0" y="341.0" fill="#2b7a8c" font-size="18" text-anchor="middle" font-weight="700">自分の行動で制御できるか</text>
<text x="250.0" y="367.0" fill="#5d6873" font-size="14" text-anchor="middle" font-weight="400">腕・道具・アバター</text>
<path d="M430.0,346.0 Q500.0,346.0 560.0,358.0" fill="none" stroke="#2b7a8c" stroke-width="2.2" marker-end="url(#arrow-teal)"/>
<rect x="70.0" y="405.0" width="360.0" height="72.0" rx="14" fill="#ffffff" stroke="#2b7a8c" stroke-width="2"/>
<text x="250.0" y="436.0" fill="#2b7a8c" font-size="18" text-anchor="middle" font-weight="700">社会的な評価に関わるか</text>
<text x="250.0" y="462.0" fill="#5d6873" font-size="14" text-anchor="middle" font-weight="400">作品・アカウント・地位</text>
<path d="M430.0,441.0 Q500.0,441.0 560.0,358.0" fill="none" stroke="#2b7a8c" stroke-width="2.2" marker-end="url(#arrow-teal)"/>
<rect x="560.0" y="310.0" width="220.0" height="96.0" rx="14" fill="#ffffff" stroke="#232a33" stroke-width="2"/>
<text x="670.0" y="353.0" fill="#232a33" font-size="20" text-anchor="middle" font-weight="700">「自分」として</text>
<text x="670.0" y="381.0" fill="#5d6873" font-size="16" text-anchor="middle" font-weight="400">認識される対象</text>
<text x="250.0" y="520.0" fill="#5d6873" font-size="14" text-anchor="middle" font-weight="400">近くにある、長く接している、だけでは決まらない</text>
<rect x="830.0" y="240.0" width="310.0" height="240.0" rx="14" fill="#ffffff" stroke="#d0693a" stroke-width="2" stroke-dasharray="8 7"/>
<text x="985.0" y="280.0" fill="#d0693a" font-size="18" text-anchor="middle" font-weight="700">持ち越す問い</text>
<text x="860.0" y="322.0" fill="#232a33" font-size="16" text-anchor="start" font-weight="400">基準は独立しているのか。</text>
<text x="860.0" y="352.0" fill="#232a33" font-size="16" text-anchor="start" font-weight="400">それとも相互に作用して、</text>
<text x="860.0" y="382.0" fill="#232a33" font-size="16" text-anchor="start" font-weight="400">「自分」という共通の対象を</text>
<text x="860.0" y="412.0" fill="#232a33" font-size="16" text-anchor="start" font-weight="400">形成しているのか。</text>
<text x="985.0" y="455.0" fill="#d0693a" font-size="15" text-anchor="middle" font-weight="700">→ 第3回：目的関数</text>
<line x1="780.0" y1="358.0" x2="830.0" y2="358.0" stroke="#5d6873" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="8 7"/>
<text x="50.0" y="572.0" fill="#5d6873" font-size="18" text-anchor="start" font-weight="400">ここで挙げた基準は候補であり、網羅ではない。</text>
</g>
</svg>
