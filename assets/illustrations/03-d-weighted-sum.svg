<text x="600.0" y="620.0" fill="#5d6873" font-size="14" text-anchor="middle" font-weight="400">承認の重みが大きいこの例では仕事が選ばれる。健康の重みが増せば休息へ傾く。</text>
<text x="600.0" y="642.0" fill="#d0693a" font-size="14" text-anchor="middle" font-weight="400">倫理的に許されない行動は、重みに関係なく制約条件として選択肢から除外する。</text>
<text x="50.0" y="692.0" fill="#5d6873" font-size="18" text-anchor="start" font-weight="400">人間がこの式を計算して行動を決めているという主張ではない。優先順位の変化を扱うための近似である。</text>
