<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="690" viewBox="0 0 1200 690" role="img" aria-labelledby="title desc">
<title id="title">自己表象が機能していると判断する五つの条件</title>
<desc id="desc">すべて、自己表象が行動へ与える因果的な影響を問う</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#5d6873" stroke-width="1.4"/></marker><marker id="arrow-teal" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#2b7a8c" stroke-width="1.6"/></marker><marker id="arrow-terra" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#d0693a" stroke-width="1.6"/></marker><marker id="arrow-indigo" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#5a4fcf" stroke-width="1.6"/></marker><marker id="arrow-ink" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#232a33" stroke-width="1.6"/></marker></defs>
<rect width="1200" height="690" rx="20" fill="#f7f5ef"/>
<g font-family='system-ui, -apple-system, "Hiragino Kaku Gothic ProN", "Noto Sans CJK JP", Meiryo, sans-serif'>
<text x="50.0" y="52.0" fill="#2b7a8c" font-size="18" text-anchor="start" font-weight="700">CONSCIOUSNESS     09     図9-13</text>
<text x="50.0" y="103.0" fill="#232a33" font-size="34" text-anchor="start" font-weight="700">自己表象が機能していると判断する五つの条件</text>
<text x="50.0" y="141.0" fill="#5d6873" font-size="21" text-anchor="start" font-weight="400">すべて、自己表象が行動へ与える因果的な影響を問う</text>
<line x1="50.0" y1="166.0" x2="1150.0" y2="166.0" stroke="#d8d4c8" stroke-width="1"/>
<rect x="80.0" y="205.0" width="26.0" height="26.0" rx="6" fill="#ffffff" stroke="#2b7a8c" stroke-width="2"/>
<path d="M86.0,218.0 L90.9,224.0 L101.0,211.0" fill="none" stroke="#2b7a8c" stroke-width="3"/>
<text x="130.0" y="227.0" fill="#232a33" font-size="20" text-anchor="start" font-weight="700">経験から更新される</text>
<text x="600.0" y="227.0" fill="#5d6873" font-size="16" text-anchor="start" font-weight="400">成功や失敗で能力・価値観の内部状態が変わる</text>
<rect x="80.0" y="267.0" width="26.0" height="26.0" rx="6" fill="#ffffff" stroke="#2b7a8c" stroke-width="2"/>
<path d="M86.0,280.0 L90.9,286.0 L101.0,273.0" fill="none" stroke="#2b7a8c" stroke-width="3"/>
<text x="130.0" y="289.0" fill="#232a33" font-size="20" text-anchor="start" font-weight="700">将来の行動へ影響する</text>
<text x="600.0" y="289.0" fill="#5d6873" font-size="16" text-anchor="start" font-weight="400">内部状態が変わると、同じ状況で異なる行動を選ぶ</text>
<rect x="80.0" y="329.0" width="26.0" height="26.0" rx="6" fill="#ffffff" stroke="#2b7a8c" stroke-width="2"/>
<path d="M86.0,342.0 L90.9,348.0 L101.0,335.0" fill="none" stroke="#2b7a8c" stroke-width="3"/>
<text x="130.0" y="351.0" fill="#232a33" font-size="20" text-anchor="start" font-weight="700">複数の目的関数を横断して使われる</text>
<text x="600.0" y="351.0" fill="#5d6873" font-size="16" text-anchor="start" font-weight="400">能力の自己評価が好奇心・安全・承認の判断に及ぶ</text>
<rect x="80.0" y="391.0" width="26.0" height="26.0" rx="6" fill="#ffffff" stroke="#2b7a8c" stroke-width="2"/>
<path d="M86.0,404.0 L90.9,410.0 L101.0,397.0" fill="none" stroke="#2b7a8c" stroke-width="3"/>
<text x="130.0" y="413.0" fill="#232a33" font-size="20" text-anchor="start" font-weight="700">分人が変わっても記憶と自己表象を共有する</text>
<text x="600.0" y="413.0" fill="#5d6873" font-size="16" text-anchor="start" font-weight="400">異なる文脈の行動が同じ履歴として関係づけられる</text>
<rect x="80.0" y="453.0" width="26.0" height="26.0" rx="6" fill="#ffffff" stroke="#2b7a8c" stroke-width="2"/>
<path d="M86.0,466.0 L90.9,472.0 L101.0,459.0" fill="none" stroke="#2b7a8c" stroke-width="3"/>
<text x="130.0" y="475.0" fill="#232a33" font-size="20" text-anchor="start" font-weight="700">無効化すると行動が観測可能に変わる</text>
<text x="600.0" y="475.0" fill="#5d6873" font-size="16" text-anchor="start" font-weight="400">付加情報なら変わらない。組み込まれていれば変わる</text>
<line x1="60.0" y1="545.0" x2="1140.0" y2="545.0" stroke="#d8d4c8" stroke-width="1"/>
<rect x="80.0" y="565.0" width="1040.0" height="56.0" rx="12" fill="#ffffff" stroke="#d0693a" stroke-width="2" stroke-dasharray="8 7"/>
<text x="600.0" y="600.0" fill="#d0693a" font-size="17" text-anchor="middle" font-weight="700">五つを満たしても、人間と同じ主観的な自己意識が成立したことの証明にはならない。</text>
<text x="50.0" y="662.0" fill="#5d6873" font-size="18" text-anchor="start" font-weight="400">「私は自分を持っています」と発言できることは、条件に含まれない。</text>
</g>
</svg>
