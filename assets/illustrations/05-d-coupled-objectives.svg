<line x1="324.0" y1="470.0" x2="576.0" y2="270.0" stroke="#d0693a" stroke-width="1.1" marker-end="url(#arrow-terra)" stroke-dasharray="8 7"/>
<line x1="324.0" y1="470.0" x2="576.0" y2="370.0" stroke="#d0693a" stroke-width="1.1" marker-end="url(#arrow-terra)" stroke-dasharray="8 7"/>
<line x1="324.0" y1="470.0" x2="576.0" y2="470.0" stroke="#d0693a" stroke-width="1.6" marker-end="url(#arrow-terra)"/>
<line x1="320.0" y1="568.0" x2="576.0" y2="276.0" stroke="#5d6873" stroke-width="1.1" marker-end="url(#arrow)" stroke-dasharray="8 7"/>
<line x1="320.0" y1="568.0" x2="576.0" y2="376.0" stroke="#5d6873" stroke-width="1.1" marker-end="url(#arrow)" stroke-dasharray="8 7"/>
<line x1="320.0" y1="568.0" x2="576.0" y2="476.0" stroke="#5d6873" stroke-width="1.1" marker-end="url(#arrow)" stroke-dasharray="8 7"/>
<line x1="624.0" y1="270.0" x2="876.0" y2="270.0" stroke="#2b7a8c" stroke-width="1.6" marker-end="url(#arrow-teal)"/>
<line x1="624.0" y1="270.0" x2="876.0" y2="370.0" stroke="#2b7a8c" stroke-width="1.1" marker-end="url(#arrow-teal)" stroke-dasharray="8 7"/>
<line x1="624.0" y1="270.0" x2="876.0" y2="470.0" stroke="#2b7a8c" stroke-width="1.1" marker-end="url(#arrow-teal)" stroke-dasharray="8 7"/>
<line x1="624.0" y1="370.0" x2="876.0" y2="270.0" stroke="#5a4fcf" stroke-width="1.1" marker-end="url(#arrow-indigo)" stroke-dasharray="8 7"/>
<line x1="624.0" y1="370.0" x2="876.0" y2="370.0" stroke="#5a4fcf" stroke-width="1.6" marker-end="url(#arrow-indigo)"/>
<line x1="624.0" y1="370.0" x2="876.0" y2="470.0" stroke="#5a4fcf" stroke-width="1.1" marker-end="url(#arrow-indigo)" stroke-dasharray="8 7"/>
<line x1="624.0" y1="470.0" x2="876.0" y2="270.0" stroke="#d0693a" stroke-width="1.1" marker-end="url(#arrow-terra)" stroke-dasharray="8 7"/>
<line x1="624.0" y1="470.0" x2="876.0" y2="370.0" stroke="#d0693a" stroke-width="1.1" marker-end="url(#arrow-terra)" stroke-dasharray="8 7"/>
<line x1="624.0" y1="470.0" x2="876.0" y2="470.0" stroke="#d0693a" stroke-width="1.6" marker-end="url(#arrow-terra)"/>
<line x1="620.0" y1="568.0" x2="876.0" y2="276.0" stroke="#5d6873" stroke-width="1.1" marker-end="url(#arrow)" stroke-dasharray="8 7"/>
<line x1="620.0" y1="568.0" x2="876.0" y2="376.0" stroke="#5d6873" stroke-width="1.1" marker-end="url(#arrow)" stroke-dasharray="8 7"/>
<line x1="620.0" y1="568.0" x2="876.0" y2="476.0" stroke="#5d6873" stroke-width="1.1" marker-end="url(#arrow)" stroke-dasharray="8 7"/>
<circle cx="300.0" cy="270.0" r="20" fill="#ffffff"/>
<circle cx="300.0" cy="270.0" r="20" fill="none" stroke="#2b7a8c" stroke-width="2.5"/>
<circle cx="300.0" cy="370.0" r="20" fill="#ffffff"/>
<circle cx="300.0" cy="370.0" r="20" fill="none" stroke="#5a4fcf" stroke-width="2.5"/>
<circle cx="300.0" cy="470.0" r="20" fill="#ffffff"/>
<circle cx="300.0" cy="470.0" r="20" fill="none" stroke="#d0693a" stroke-width="2.5"/>
<rect x="260.0" y="562.0" width="80.0" height="36.0" rx="18" fill="#ffffff" stroke="#5d6873" stroke-width="2"/>
<text x="300.0" y="585.0" fill="#5d6873" font-size="14" text-anchor="middle" font-weight="700">s(t)</text>
<circle cx="600.0" cy="270.0" r="20" fill="#ffffff"/>
<circle cx="600.0" cy="270.0" r="20" fill="none" stroke="#2b7a8c" stroke-width="2.5"/>
<circle cx="600.0" cy="370.0" r="20" fill="#ffffff"/>
<circle cx="600.0" cy="370.0" r="20" fill="none" stroke="#5a4fcf" stroke-width="2.5"/>
<circle cx="600.0" cy="470.0" r="20" fill="#ffffff"/>
<circle cx="600.0" cy="470.0" r="20" fill="none" stroke="#d0693a" stroke-width="2.5"/>
<rect x="560.0" y="562.0" width="80.0" height="36.0" rx="18" fill="#ffffff" stroke="#5d6873" stroke-width="2"/>
<text x="600.0" y="585.0" fill="#5d6873" font-size="14" text-anchor="middle" font-weight="700">s(t+1)</text>
<circle cx="900.0" cy="270.0" r="20" fill="#ffffff"/>
<circle cx="900.0" cy="270.0" r="20" fill="none" stroke="#2b7a8c" stroke-width="2.5"/>
<circle cx="900.0" cy="370.0" r="20" fill="#ffffff"/>
<circle cx="900.0" cy="370.0" r="20" fill="none" stroke="#5a4fcf" stroke-width="2.5"/>
<circle cx="900.0" cy="470.0" r="20" fill="#ffffff"/>
<circle cx="900.0" cy="470.0" r="20" fill="none" stroke="#d0693a" stroke-width="2.5"/>
<rect x="860.0" y="562.0" width="80.0" height="36.0" rx="18" fill="#ffffff" stroke="#5d6873" stroke-width="2"/>
<text x="900.0" y="585.0" fill="#5d6873" font-size="14" text-anchor="middle" font-weight="700">s(t+2)</text>
<text x="1065.0" y="520.0" fill="#5d6873" font-size="13" text-anchor="middle" font-weight="400">外界や身体の状態 s は</text>
<text x="1065.0" y="538.0" fill="#5d6873" font-size="13" text-anchor="middle" font-weight="400">次の時刻の各更新に入る</text>
<text x="600.0" y="655.0" fill="#232a33" font-size="17" text-anchor="middle" font-weight="700">f_i(t+1) = g_i(f_1(t), f_2(t), ..., f_n(t), s(t))</text>
<text x="50.0" y="692.0" fill="#5d6873" font-size="18" text-anchor="start" font-weight="400">実線は自分自身の更新、破線は他の目的や外界からの影響。厳密には目的関数と、それを評価する内部状態を区別する。</text>
</g>
</svg>
