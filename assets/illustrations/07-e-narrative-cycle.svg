<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
<title id="title">ナラティブは異なる分人をひとつの人生に結びつける</title>
<desc id="desc">六つの段階が循環し、自己は変化しながら連続性を保つ</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#5d6873" stroke-width="1.4"/></marker><marker id="arrow-teal" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#2b7a8c" stroke-width="1.6"/></marker><marker id="arrow-terra" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#d0693a" stroke-width="1.6"/></marker><marker id="arrow-indigo" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#5a4fcf" stroke-width="1.6"/></marker><marker id="arrow-ink" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#232a33" stroke-width="1.6"/></marker></defs>
<rect width="1200" height="720" rx="20" fill="#f7f5ef"/>
<g font-family='system-ui, -apple-system, "Hiragino Kaku Gothic ProN", "Noto Sans CJK JP", Meiryo, sans-serif'>
<text x="50.0" y="52.0" fill="#2b7a8c" font-size="18" text-anchor="start" font-weight="700">CONSCIOUSNESS     07     図7-5</text>
<text x="50.0" y="103.0" fill="#232a33" font-size="34" text-anchor="start" font-weight="700">ナラティブは異なる分人をひとつの人生に結びつける</text>
<text x="50.0" y="141.0" fill="#5d6873" font-size="21" text-anchor="start" font-weight="400">六つの段階が循環し、自己は変化しながら連続性を保つ</text>
<line x1="50.0" y1="166.0" x2="1150.0" y2="166.0" stroke="#d8d4c8" stroke-width="1"/>
<path d="M650.2,269.0 Q693.3,268.4 714.3,306.0" fill="none" stroke="#5d6873" stroke-width="2.2" marker-end="url(#arrow)"/>
<path d="M764.5,393.0 Q786.5,430.0 764.5,467.0" fill="none" stroke="#5d6873" stroke-width="2.2" marker-end="url(#arrow)"/>
<path d="M714.3,554.0 Q693.3,591.6 650.2,591.0" fill="none" stroke="#5d6873" stroke-width="2.2" marker-end="url(#arrow)"/>
<path d="M549.8,591.0 Q506.7,591.6 485.7,554.0" fill="none" stroke="#5d6873" stroke-width="2.2" marker-end="url(#arrow)"/>
<path d="M435.5,467.0 Q413.5,430.0 435.5,393.0" fill="none" stroke="#5d6873" stroke-width="2.2" marker-end="url(#arrow)"/>
<path d="M485.7,306.0 Q506.7,268.4 549.8,269.0" fill="none" stroke="#5d6873" stroke-width="2.2" marker-end="url(#arrow)"/>
<circle cx="600.0" cy="240.0" r="54" fill="#ffffff"/>
<circle cx="600.0" cy="240.0" r="54" fill="none" stroke="#2b7a8c" stroke-width="2.5"/>
<text x="600.0" y="238.0" fill="#2b7a8c" font-size="13" text-anchor="middle" font-weight="700">文脈に応じた</text>
<text x="600.0" y="255.0" fill="#2b7a8c" font-size="13" text-anchor="middle" font-weight="700">分人が現れる</text>
<circle cx="764.5" cy="335.0" r="54" fill="#ffffff"/>
<circle cx="764.5" cy="335.0" r="54" fill="none" stroke="#2b7a8c" stroke-width="2.5"/>
<text x="764.5" y="333.0" fill="#2b7a8c" font-size="13" text-anchor="middle" font-weight="700">分人の重み付けで</text>
<text x="764.5" y="350.0" fill="#2b7a8c" font-size="13" text-anchor="middle" font-weight="700">行動を選ぶ</text>
<circle cx="764.5" cy="525.0" r="54" fill="#ffffff"/>
<circle cx="764.5" cy="525.0" r="54" fill="none" stroke="#5a4fcf" stroke-width="2.5"/>
<text x="764.5" y="523.0" fill="#5a4fcf" font-size="13" text-anchor="middle" font-weight="700">結果が経験として</text>
<text x="764.5" y="540.0" fill="#5a4fcf" font-size="13" text-anchor="middle" font-weight="700">記憶される</text>
<circle cx="600.0" cy="620.0" r="54" fill="#ffffff"/>
<circle cx="600.0" cy="620.0" r="54" fill="none" stroke="#d0693a" stroke-width="2.5"/>
<text x="600.0" y="618.0" fill="#d0693a" font-size="13" text-anchor="middle" font-weight="700">記憶がナラティブ</text>
<text x="600.0" y="635.0" fill="#d0693a" font-size="13" text-anchor="middle" font-weight="700">に整理される</text>
<circle cx="435.5" cy="525.0" r="54" fill="#ffffff"/>
<circle cx="435.5" cy="525.0" r="54" fill="none" stroke="#d0693a" stroke-width="2.5"/>
<text x="435.5" y="523.0" fill="#d0693a" font-size="13" text-anchor="middle" font-weight="700">ナラティブが</text>
<text x="435.5" y="540.0" fill="#d0693a" font-size="13" text-anchor="middle" font-weight="700">自己表象を更新</text>
<circle cx="435.5" cy="335.0" r="54" fill="#ffffff"/>
<circle cx="435.5" cy="335.0" r="54" fill="none" stroke="#5a4fcf" stroke-width="2.5"/>
<text x="435.5" y="333.0" fill="#5a4fcf" font-size="13" text-anchor="middle" font-weight="700">自己表象が次の</text>
<text x="435.5" y="350.0" fill="#5a4fcf" font-size="13" text-anchor="middle" font-weight="700">分人と行動へ</text>
<text x="600.0" y="424.0" fill="#232a33" font-size="14" text-anchor="middle" font-weight="400">仕事では挑戦、家庭では安定。</text>
<text x="600.0" y="446.0" fill="#232a33" font-size="14" text-anchor="middle" font-weight="400">矛盾を消さずに、同じ人生の中に配置する</text>
<text x="50.0" y="692.0" fill="#5d6873" font-size="18" text-anchor="start" font-weight="400">自己の一貫性とは、あらゆる状況で同じ行動を取ることではなく、異なる行動を同じ個人の経験として理解できることである。</text>
</g>
</svg>
