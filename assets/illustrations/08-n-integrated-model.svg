<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
<title id="title">意識・自己・物語の情報処理モデル</title>
<desc id="desc">本連載が組み立てた五つのブロックと、その間の循環</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#5d6873" stroke-width="1.4"/></marker><marker id="arrow-teal" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#2b7a8c" stroke-width="1.6"/></marker><marker id="arrow-terra" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#d0693a" stroke-width="1.6"/></marker><marker id="arrow-indigo" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#5a4fcf" stroke-width="1.6"/></marker><marker id="arrow-ink" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#232a33" stroke-width="1.6"/></marker></defs>
<rect width="1200" height="800" rx="20" fill="#f7f5ef"/>
<g font-family='system-ui, -apple-system, "Hiragino Kaku Gothic ProN", "Noto Sans CJK JP", Meiryo, sans-serif'>
<text x="50.0" y="52.0" fill="#2b7a8c" font-size="18" text-anchor="start" font-weight="700">CONSCIOUSNESS     08     図8-14</text>
<text x="50.0" y="103.0" fill="#232a33" font-size="34" text-anchor="start" font-weight="700">意識・自己・物語の情報処理モデル</text>
<text x="50.0" y="141.0" fill="#5d6873" font-size="21" text-anchor="start" font-weight="400">本連載が組み立てた五つのブロックと、その間の循環</text>
<line x1="50.0" y1="166.0" x2="1150.0" y2="166.0" stroke="#d8d4c8" stroke-width="1"/>
<rect x="70.0" y="215.0" width="340.0" height="150.0" rx="14" fill="#ffffff" stroke="#2b7a8c" stroke-width="2"/>
<text x="240.0" y="247.0" fill="#2b7a8c" font-size="18" text-anchor="middle" font-weight="700">外界との相互作用</text>
<text x="240.0" y="281.0" fill="#232a33" font-size="13" text-anchor="middle" font-weight="400">感覚情報の受信</text>
<text x="240.0" y="307.0" fill="#232a33" font-size="13" text-anchor="middle" font-weight="400">世界モデルによる予測</text>
<text x="240.0" y="333.0" fill="#232a33" font-size="13" text-anchor="middle" font-weight="400">予測誤差による更新</text>
<rect x="790.0" y="215.0" width="340.0" height="150.0" rx="14" fill="#ffffff" stroke="#5a4fcf" stroke-width="2"/>
<text x="960.0" y="247.0" fill="#5a4fcf" font-size="18" text-anchor="middle" font-weight="700">目的関数による評価</text>
<text x="960.0" y="281.0" fill="#232a33" font-size="13" text-anchor="middle" font-weight="400">生存・愛着・承認</text>
<text x="960.0" y="307.0" fill="#232a33" font-size="13" text-anchor="middle" font-weight="400">好奇心・倫理・美意識</text>
<text x="960.0" y="333.0" fill="#232a33" font-size="13" text-anchor="middle" font-weight="400">相互作用と重みの変化</text>
<rect x="430.0" y="400.0" width="340.0" height="150.0" rx="14" fill="#dfe9eb" stroke="#d0693a" stroke-width="2"/>
<text x="600.0" y="432.0" fill="#d0693a" font-size="18" text-anchor="middle" font-weight="700">自己の形成</text>
<text x="600.0" y="466.0" fill="#232a33" font-size="13" text-anchor="middle" font-weight="400">目的関数間の相互作用</text>
<text x="600.0" y="492.0" fill="#232a33" font-size="13" text-anchor="middle" font-weight="400">自己表象の形成</text>
<text x="600.0" y="518.0" fill="#232a33" font-size="13" text-anchor="middle" font-weight="400">分人の表出・肉体外への拡張</text>
<rect x="70.0" y="585.0" width="340.0" height="150.0" rx="14" fill="#ffffff" stroke="#5a4fcf" stroke-width="2"/>
<text x="240.0" y="617.0" fill="#5a4fcf" font-size="18" text-anchor="middle" font-weight="700">時間的な自己の維持</text>
<text x="240.0" y="651.0" fill="#232a33" font-size="13" text-anchor="middle" font-weight="400">エピソード記憶</text>
<text x="240.0" y="677.0" fill="#232a33" font-size="13" text-anchor="middle" font-weight="400">ナラティブの生成</text>
<text x="240.0" y="703.0" fill="#232a33" font-size="13" text-anchor="middle" font-weight="400">自己表象の更新</text>
<rect x="790.0" y="585.0" width="340.0" height="150.0" rx="14" fill="#ffffff" stroke="#2b7a8c" stroke-width="2"/>
<text x="960.0" y="617.0" fill="#2b7a8c" font-size="18" text-anchor="middle" font-weight="700">社会的な拡張</text>
<text x="960.0" y="651.0" fill="#232a33" font-size="13" text-anchor="middle" font-weight="400">物語の共有</text>
<text x="960.0" y="677.0" fill="#232a33" font-size="13" text-anchor="middle" font-weight="400">他者の経験からの学習</text>
<text x="960.0" y="703.0" fill="#232a33" font-size="13" text-anchor="middle" font-weight="400">新しい共通体験の形成</text>
<line x1="410.0" y1="290.0" x2="790.0" y2="290.0" stroke="#5d6873" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="600.0" y="280.0" fill="#5d6873" font-size="12" text-anchor="middle" font-weight="400">予測された状態を評価する</text>
<line x1="960.0" y1="365.0" x2="770.0" y2="420.0" stroke="#5a4fcf" stroke-width="2.2" marker-end="url(#arrow-indigo)"/>
<line x1="430.0" y1="420.0" x2="240.0" y2="365.0" stroke="#d0693a" stroke-width="2.2" marker-end="url(#arrow-terra)" stroke-dasharray="8 7"/>
<text x="335.0" y="362.0" fill="#d0693a" font-size="12" text-anchor="start" font-weight="400">自己表象が予測に影響</text>
<line x1="430.0" y1="530.0" x2="240.0" y2="585.0" stroke="#d0693a" stroke-width="2.2" marker-end="url(#arrow-terra)"/>
<line x1="410.0" y1="660.0" x2="430.0" y2="548.0" stroke="#5a4fcf" stroke-width="2.2" marker-end="url(#arrow-indigo)"/>
<text x="395.0" y="605.0" fill="#5a4fcf" font-size="12" text-anchor="middle" font-weight="400">更新</text>
<line x1="960.0" y1="585.0" x2="770.0" y2="530.0" stroke="#2b7a8c" stroke-width="2.2" marker-end="url(#arrow-teal)" stroke-dasharray="8 7"/>
<text x="945.0" y="548.0" fill="#2b7a8c" font-size="12" text-anchor="middle" font-weight="400">物語が価値判断を更新</text>
<line x1="410.0" y1="660.0" x2="790.0" y2="660.0" stroke="#5d6873" stroke-width="2.2" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
<text x="600.0" y="650.0" fill="#5d6873" font-size="12" text-anchor="middle" font-weight="400">自分の物語を共有し、他者から学ぶ</text>
<text x="50.0" y="772.0" fill="#5d6873" font-size="18" text-anchor="start" font-weight="400">自己の機能的な形成と変化を説明する仮説である。主観的な意識体験そのものが、なぜ存在するのかは未解決のまま残る。</text>
</g>
</svg>
