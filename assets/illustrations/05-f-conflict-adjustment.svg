<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
<title id="title">矛盾は排除されるのではなく、調整される</title>
<desc id="desc">競合する目的を同じシステムの中で扱い続ける</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#5d6873" stroke-width="1.4"/></marker><marker id="arrow-teal" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#2b7a8c" stroke-width="1.6"/></marker><marker id="arrow-terra" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#d0693a" stroke-width="1.6"/></marker><marker id="arrow-indigo" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#5a4fcf" stroke-width="1.6"/></marker><marker id="arrow-ink" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#232a33" stroke-width="1.6"/></marker></defs>
<rect width="1200" height="620" rx="20" fill="#f7f5ef"/>
<g font-family='system-ui, -apple-system, "Hiragino Kaku Gothic ProN", "Noto Sans CJK JP", Meiryo, sans-serif'>
<text x="50.0" y="52.0" fill="#2b7a8c" font-size="18" text-anchor="start" font-weight="700">CONSCIOUSNESS     05     図5-6</text>
<text x="50.0" y="103.0" fill="#232a33" font-size="34" text-anchor="start" font-weight="700">矛盾は排除されるのではなく、調整される</text>
<text x="50.0" y="141.0" fill="#5d6873" font-size="21" text-anchor="start" font-weight="400">競合する目的を同じシステムの中で扱い続ける</text>
<line x1="50.0" y1="166.0" x2="1150.0" y2="166.0" stroke="#d8d4c8" stroke-width="1"/>
<rect x="70.0" y="300.0" width="260.0" height="100.0" rx="14" fill="#ffffff" stroke="#2b7a8c" stroke-width="2"/>
<text x="200.0" y="345.0" fill="#2b7a8c" font-size="22" text-anchor="middle" font-weight="700">安全性</text>
<text x="200.0" y="370.0" fill="#5d6873" font-size="13" text-anchor="middle" font-weight="400">未知の環境への進入を避ける</text>
<rect x="870.0" y="300.0" width="260.0" height="100.0" rx="14" fill="#ffffff" stroke="#d0693a" stroke-width="2"/>
<text x="1000.0" y="345.0" fill="#d0693a" font-size="22" text-anchor="middle" font-weight="700">知的好奇心</text>
<text x="1000.0" y="370.0" fill="#5d6873" font-size="13" text-anchor="middle" font-weight="400">その環境を探索する</text>
<text x="600.0" y="230.0" fill="#232a33" font-size="18" text-anchor="middle" font-weight="700">競合</text>
<line x1="330.0" y1="350.0" x2="420.0" y2="350.0" stroke="#2b7a8c" stroke-width="2.5" marker-end="url(#arrow-teal)"/>
<line x1="870.0" y1="350.0" x2="780.0" y2="350.0" stroke="#d0693a" stroke-width="2.5" marker-end="url(#arrow-terra)"/>
<rect x="420.0" y="255.0" width="360.0" height="190.0" rx="14" fill="#ffffff" stroke="#232a33" stroke-width="2"/>
<text x="600.0" y="288.0" fill="#232a33" font-size="17" text-anchor="middle" font-weight="700">調整された行動</text>
<text x="445.0" y="325.0" fill="#232a33" font-size="15" text-anchor="start" font-weight="400">・危険性を調べながら探索する</text>
<text x="445.0" y="357.0" fill="#232a33" font-size="15" text-anchor="start" font-weight="400">・安全が確認できるまで延期する</text>
<text x="445.0" y="389.0" fill="#232a33" font-size="15" text-anchor="start" font-weight="400">・一方を優先する（他方を消さない）</text>
<line x1="590.0" y1="470.0" x2="610.0" y2="490.0" stroke="#d8d4c8" stroke-width="2.5"/>
<line x1="590.0" y1="490.0" x2="610.0" y2="470.0" stroke="#d8d4c8" stroke-width="2.5"/>
<text x="630.0" y="486.0" fill="#5d6873" font-size="14" text-anchor="start" font-weight="400">どちらかを完全に排除する、ではない</text>
<line x1="600.0" y1="445.0" x2="600.0" y2="520.0" stroke="#5d6873" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="500.0" y="520.0" width="200.0" height="50.0" rx="14" fill="#ffffff" stroke="#232a33" stroke-width="2"/>
<text x="600.0" y="550.8" fill="#232a33" font-size="16" text-anchor="middle" font-weight="700">自己表象へ反映</text>
<text x="50.0" y="592.0" fill="#5d6873" font-size="18" text-anchor="start" font-weight="400">心理的な矛盾と因果的な情報統合は異なる概念である。矛盾が多いほどΦが大きい、という主張ではない。</text>
</g>
</svg>
