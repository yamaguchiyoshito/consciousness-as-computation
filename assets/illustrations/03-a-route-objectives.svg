<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
<title id="title">評価基準が変われば最適な経路が変わる</title>
<desc id="desc">同じ三つの経路を、距離・時間・費用で評価する</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#5d6873" stroke-width="1.4"/></marker><marker id="arrow-teal" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#2b7a8c" stroke-width="1.6"/></marker><marker id="arrow-terra" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#d0693a" stroke-width="1.6"/></marker><marker id="arrow-indigo" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#5a4fcf" stroke-width="1.6"/></marker><marker id="arrow-ink" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#232a33" stroke-width="1.6"/></marker></defs>
<rect width="1200" height="620" rx="20" fill="#f7f5ef"/>
<g font-family='system-ui, -apple-system, "Hiragino Kaku Gothic ProN", "Noto Sans CJK JP", Meiryo, sans-serif'>
<text x="50.0" y="52.0" fill="#2b7a8c" font-size="18" text-anchor="start" font-weight="700">CONSCIOUSNESS     03     図3-1</text>
<text x="50.0" y="103.0" fill="#232a33" font-size="34" text-anchor="start" font-weight="700">評価基準が変われば最適な経路が変わる</text>
<text x="50.0" y="141.0" fill="#5d6873" font-size="21" text-anchor="start" font-weight="400">同じ三つの経路を、距離・時間・費用で評価する</text>
<line x1="50.0" y1="166.0" x2="1150.0" y2="166.0" stroke="#d8d4c8" stroke-width="1"/>
<circle cx="110.0" cy="420.0" r="12" fill="#232a33"/>
<text x="110.0" y="458.0" fill="#232a33" font-size="16" text-anchor="middle" font-weight="700">出発</text>
<circle cx="560.0" cy="260.0" r="12" fill="#232a33"/>
<text x="560.0" y="236.0" fill="#232a33" font-size="16" text-anchor="middle" font-weight="700">目的地</text>
<path d="M110.0,420.0 Q330.0,215.0 560.0,260.0" fill="none" stroke="#2b7a8c" stroke-width="3"/>
<text x="300.0" y="262.0" fill="#2b7a8c" font-size="15" text-anchor="middle" font-weight="700">A：最短距離</text>
<path d="M110,420 L260,420 L400,260 L560,260" fill="none" stroke="#5a4fcf" stroke-width="3"/>
<text x="330.0" y="360.0" fill="#5a4fcf" font-size="15" text-anchor="middle" font-weight="700">B：高速道路（最短時間）</text>
<path d="M110.0,420.0 Q400.0,520.0 560.0,260.0" fill="none" stroke="#d0693a" stroke-width="3"/>
<text x="330.0" y="500.0" fill="#d0693a" font-size="15" text-anchor="middle" font-weight="700">C：一般道（最小費用）</text>
<rect x="680.0" y="215.0" width="460.0" height="290.0" rx="14" fill="#ffffff" stroke="#d8d4c8" stroke-width="2"/>
<text x="910.0" y="250.0" fill="#232a33" font-size="18" text-anchor="middle" font-weight="700">評価基準ごとの最適解</text>
<text x="840.0" y="290.0" fill="#2b7a8c" font-size="16" text-anchor="middle" font-weight="700">A</text>
<text x="930.0" y="290.0" fill="#5a4fcf" font-size="16" text-anchor="middle" font-weight="700">B</text>
<text x="1020.0" y="290.0" fill="#d0693a" font-size="16" text-anchor="middle" font-weight="700">C</text>
<text x="715.0" y="341.0" fill="#232a33" font-size="16" text-anchor="start" font-weight="400">距離を評価</text>
<circle cx="840.0" cy="335.0" r="13" fill="#2b7a8c"/>
<text x="840.0" y="340.0" fill="#ffffff" font-size="13" text-anchor="middle" font-weight="700">◎</text>
<circle cx="930.0" cy="335.0" r="6" fill="#d8d4c8"/>
<circle cx="1020.0" cy="335.0" r="6" fill="#d8d4c8"/>
<text x="715.0" y="393.0" fill="#232a33" font-size="16" text-anchor="start" font-weight="400">時間を評価</text>
<circle cx="840.0" cy="387.0" r="6" fill="#d8d4c8"/>
<circle cx="930.0" cy="387.0" r="13" fill="#5a4fcf"/>
<text x="930.0" y="392.0" fill="#ffffff" font-size="13" text-anchor="middle" font-weight="700">◎</text>
<circle cx="1020.0" cy="387.0" r="6" fill="#d8d4c8"/>
<text x="715.0" y="445.0" fill="#232a33" font-size="16" text-anchor="start" font-weight="400">費用を評価</text>
<circle cx="840.0" cy="439.0" r="6" fill="#d8d4c8"/>
<circle cx="930.0" cy="439.0" r="6" fill="#d8d4c8"/>
<circle cx="1020.0" cy="439.0" r="13" fill="#d0693a"/>
<text x="1020.0" y="444.0" fill="#ffffff" font-size="13" text-anchor="middle" font-weight="700">◎</text>
<text x="910.0" y="545.0" fill="#5d6873" font-size="14" text-anchor="middle" font-weight="400">最適な x* = argmax f(x) は f の選び方で変わる</text>
<text x="50.0" y="592.0" fill="#5d6873" font-size="18" text-anchor="start" font-weight="400">評価基準はひとつではない。人間には複数の評価基準が同時に存在する。</text>
</g>
</svg>
