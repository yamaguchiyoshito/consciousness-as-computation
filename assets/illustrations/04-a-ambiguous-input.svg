<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
<title id="title">同じ感覚情報が、文脈によって違うものとして認識される</title>
<desc id="desc">認識は感覚情報と過去の経験を組み合わせた推測である</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#5d6873" stroke-width="1.4"/></marker><marker id="arrow-teal" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#2b7a8c" stroke-width="1.6"/></marker><marker id="arrow-terra" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#d0693a" stroke-width="1.6"/></marker><marker id="arrow-indigo" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#5a4fcf" stroke-width="1.6"/></marker><marker id="arrow-ink" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#232a33" stroke-width="1.6"/></marker></defs>
<rect width="1200" height="600" rx="20" fill="#f7f5ef"/>
<g font-family='system-ui, -apple-system, "Hiragino Kaku Gothic ProN", "Noto Sans CJK JP", Meiryo, sans-serif'>
<text x="50.0" y="52.0" fill="#2b7a8c" font-size="18" text-anchor="start" font-weight="700">CONSCIOUSNESS     04     図4-1</text>
<text x="50.0" y="103.0" fill="#232a33" font-size="34" text-anchor="start" font-weight="700">同じ感覚情報が、文脈によって違うものとして認識される</text>
<text x="50.0" y="141.0" fill="#5d6873" font-size="21" text-anchor="start" font-weight="400">認識は感覚情報と過去の経験を組み合わせた推測である</text>
<line x1="50.0" y1="166.0" x2="1150.0" y2="166.0" stroke="#d8d4c8" stroke-width="1"/>
<rect x="470.0" y="230.0" width="260.0" height="140.0" rx="14" fill="#ffffff" stroke="#232a33" stroke-width="2"/>
<text x="600.0" y="262.0" fill="#232a33" font-size="18" text-anchor="middle" font-weight="700">感覚情報</text>
<path d="M505,312 Q552,278 600,312 Q648,346 695,312" fill="none" stroke="#232a33" stroke-width="5"/>
<text x="600.0" y="357.0" fill="#5d6873" font-size="14" text-anchor="middle" font-weight="400">暗がりに細長いもの</text>
<rect x="70.0" y="230.0" width="330.0" height="70.0" rx="14" fill="#ffffff" stroke="#2b7a8c" stroke-width="2"/>
<text x="235.0" y="260.0" fill="#2b7a8c" font-size="18" text-anchor="middle" font-weight="700">文脈：夜道</text>
<text x="235.0" y="285.0" fill="#5d6873" font-size="13" text-anchor="middle" font-weight="400">過去に蛇を見た。蛇が出る場所だと知っている</text>
<rect x="800.0" y="230.0" width="330.0" height="70.0" rx="14" fill="#ffffff" stroke="#5a4fcf" stroke-width="2"/>
<text x="965.0" y="260.0" fill="#5a4fcf" font-size="18" text-anchor="middle" font-weight="700">文脈：室内の机の近く</text>
<text x="965.0" y="285.0" fill="#5d6873" font-size="13" text-anchor="middle" font-weight="400">電源コードがよく置かれている</text>
<path d="M400.0,265.0 Q440.0,265.0 470.0,300.0" fill="none" stroke="#2b7a8c" stroke-width="2.2" marker-end="url(#arrow-teal)"/>
<path d="M800.0,265.0 Q760.0,265.0 730.0,300.0" fill="none" stroke="#5a4fcf" stroke-width="2.2" marker-end="url(#arrow-indigo)"/>
<path d="M500.0,370.0 Q380.0,420.0 320.0,440.0" fill="none" stroke="#2b7a8c" stroke-width="2.5" marker-end="url(#arrow-teal)"/>
<path d="M700.0,370.0 Q820.0,420.0 880.0,440.0" fill="none" stroke="#5a4fcf" stroke-width="2.5" marker-end="url(#arrow-indigo)"/>
<rect x="150.0" y="420.0" width="300.0" height="80.0" rx="14" fill="#ffffff" stroke="#2b7a8c" stroke-width="2"/>
<text x="300.0" y="455.0" fill="#2b7a8c" font-size="22" text-anchor="middle" font-weight="700">推定：蛇</text>
<text x="300.0" y="480.0" fill="#5d6873" font-size="13" text-anchor="middle" font-weight="400">危険の可能性を高く見積もる</text>
<rect x="750.0" y="420.0" width="300.0" height="80.0" rx="14" fill="#ffffff" stroke="#5a4fcf" stroke-width="2"/>
<text x="900.0" y="455.0" fill="#5a4fcf" font-size="22" text-anchor="middle" font-weight="700">推定：電源コード</text>
<text x="900.0" y="480.0" fill="#5d6873" font-size="13" text-anchor="middle" font-weight="400">特に注意を向けない</text>
<text x="600.0" y="470.0" fill="#5d6873" font-size="15" text-anchor="middle" font-weight="400">感覚情報は同じ</text>
<text x="600.0" y="492.0" fill="#5d6873" font-size="15" text-anchor="middle" font-weight="400">解釈だけが変わる</text>
<text x="50.0" y="572.0" fill="#5d6873" font-size="18" text-anchor="start" font-weight="400">脳は外界に直接アクセスできない。受け取るのは感覚器官が変換した信号であり、原因は一意に決まらない。</text>
</g>
</svg>
