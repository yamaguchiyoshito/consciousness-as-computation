<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc">
<title id="title">四つの現象に共通する構造</title>
<desc id="desc">物理的な境界ではなく、内部表象の一部が「自分」として認識される</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#5d6873" stroke-width="1.4"/></marker><marker id="arrow-teal" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#2b7a8c" stroke-width="1.6"/></marker><marker id="arrow-terra" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#d0693a" stroke-width="1.6"/></marker><marker id="arrow-indigo" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#5a4fcf" stroke-width="1.6"/></marker><marker id="arrow-ink" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#232a33" stroke-width="1.6"/></marker></defs>
<rect width="1200" height="640" rx="20" fill="#f7f5ef"/>
<g font-family='system-ui, -apple-system, "Hiragino Kaku Gothic ProN", "Noto Sans CJK JP", Meiryo, sans-serif'>
<text x="50.0" y="52.0" fill="#2b7a8c" font-size="18" text-anchor="start" font-weight="700">CONSCIOUSNESS     01     図1-6</text>
<text x="50.0" y="103.0" fill="#232a33" font-size="34" text-anchor="start" font-weight="700">四つの現象に共通する構造</text>
<text x="50.0" y="141.0" fill="#5d6873" font-size="21" text-anchor="start" font-weight="400">物理的な境界ではなく、内部表象の一部が「自分」として認識される</text>
<line x1="50.0" y1="166.0" x2="1150.0" y2="166.0" stroke="#d8d4c8" stroke-width="1"/>
<rect x="70.0" y="215.0" width="330.0" height="70.0" rx="14" fill="#ffffff" stroke="#5d6873" stroke-width="2"/>
<text x="235.0" y="245.0" fill="#5d6873" font-size="17" text-anchor="middle" font-weight="700">現実と仮想の映像</text>
<text x="235.0" y="270.0" fill="#5d6873" font-size="13" text-anchor="middle" font-weight="400">感覚情報が似ていれば区別できない</text>
<path d="M400.0,250.0 Q470.0,250.0 520.0,400.0" fill="none" stroke="#5d6873" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="70.0" y="305.0" width="330.0" height="70.0" rx="14" fill="#ffffff" stroke="#5d6873" stroke-width="2"/>
<text x="235.0" y="335.0" fill="#5d6873" font-size="17" text-anchor="middle" font-weight="700">仮想の対象への感情</text>
<text x="235.0" y="360.0" fill="#5d6873" font-size="13" text-anchor="middle" font-weight="400">対象が存在しなくても感情は現実</text>
<path d="M400.0,340.0 Q470.0,340.0 520.0,400.0" fill="none" stroke="#5d6873" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="70.0" y="395.0" width="330.0" height="70.0" rx="14" fill="#ffffff" stroke="#5d6873" stroke-width="2"/>
<text x="235.0" y="425.0" fill="#5d6873" font-size="17" text-anchor="middle" font-weight="700">身体部位の自己認識の濃淡</text>
<text x="235.0" y="450.0" fill="#5d6873" font-size="13" text-anchor="middle" font-weight="400">生物学的な所属と一致しない</text>
<path d="M400.0,430.0 Q470.0,430.0 520.0,400.0" fill="none" stroke="#5d6873" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="70.0" y="485.0" width="330.0" height="70.0" rx="14" fill="#ffffff" stroke="#5d6873" stroke-width="2"/>
<text x="235.0" y="515.0" fill="#5d6873" font-size="17" text-anchor="middle" font-weight="700">アバター・作品への投影</text>
<text x="235.0" y="540.0" fill="#5d6873" font-size="13" text-anchor="middle" font-weight="400">身体の外側が自分の一部になる</text>
<path d="M400.0,520.0 Q470.0,520.0 520.0,400.0" fill="none" stroke="#5d6873" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="520.0" y="330.0" width="300.0" height="140.0" rx="14" fill="#ffffff" stroke="#2b7a8c" stroke-width="2"/>
<text x="670.0" y="395.0" fill="#2b7a8c" font-size="24" text-anchor="middle" font-weight="700">内部表象</text>
<text x="670.0" y="422.0" fill="#5d6873" font-size="15" text-anchor="middle" font-weight="400">感覚情報・記憶・経験・予測から構築</text>
<line x1="820.0" y1="400.0" x2="890.0" y2="400.0" stroke="#2b7a8c" stroke-width="2.5" marker-end="url(#arrow-teal)"/>
<rect x="890.0" y="345.0" width="250.0" height="110.0" rx="14" fill="#ffffff" stroke="#5a4fcf" stroke-width="2"/>
<text x="1015.0" y="395.0" fill="#5a4fcf" font-size="24" text-anchor="middle" font-weight="700">「自分」</text>
<text x="1015.0" y="421.0" fill="#5d6873" font-size="14" text-anchor="middle" font-weight="400">表象の一部を自分として認識</text>
<text x="1015.0" y="495.0" fill="#5d6873" font-size="14" text-anchor="middle" font-weight="400">仮説：自分とは情報処理が設定する境界</text>
<text x="50.0" y="612.0" fill="#5d6873" font-size="18" text-anchor="start" font-weight="400">自己の境界が構築されることと、主観的体験が情報処理だけで説明できることは同じではない。</text>
</g>
</svg>
