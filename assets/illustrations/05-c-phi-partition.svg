<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc">
<title id="title">分割によって失われる因果構造を測る</title>
<desc id="desc">統合情報量Φの考え方を、概念的な近似式で示す</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#5d6873" stroke-width="1.4"/></marker><marker id="arrow-teal" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#2b7a8c" stroke-width="1.6"/></marker><marker id="arrow-terra" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#d0693a" stroke-width="1.6"/></marker><marker id="arrow-indigo" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#5a4fcf" stroke-width="1.6"/></marker><marker id="arrow-ink" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#232a33" stroke-width="1.6"/></marker></defs>
<rect width="1200" height="640" rx="20" fill="#f7f5ef"/>
<g font-family='system-ui, -apple-system, "Hiragino Kaku Gothic ProN", "Noto Sans CJK JP", Meiryo, sans-serif'>
<text x="50.0" y="52.0" fill="#2b7a8c" font-size="18" text-anchor="start" font-weight="700">CONSCIOUSNESS     05     図5-3</text>
<text x="50.0" y="103.0" fill="#232a33" font-size="34" text-anchor="start" font-weight="700">分割によって失われる因果構造を測る</text>
<text x="50.0" y="141.0" fill="#5d6873" font-size="21" text-anchor="start" font-weight="400">統合情報量Φの考え方を、概念的な近似式で示す</text>
<line x1="50.0" y1="166.0" x2="1150.0" y2="166.0" stroke="#d8d4c8" stroke-width="1"/>
<text x="250.0" y="230.0" fill="#232a33" font-size="20" text-anchor="middle" font-weight="700">システム S</text>
<line x1="250.0" y1="280.0" x2="310.6" y2="385.0" stroke="#2b7a8c" stroke-width="2.5" marker-end="url(#arrow-teal)"/>
<line x1="310.6" y1="385.0" x2="189.4" y2="385.0" stroke="#2b7a8c" stroke-width="2.5" marker-end="url(#arrow-teal)"/>
<line x1="189.4" y1="385.0" x2="250.0" y2="280.0" stroke="#2b7a8c" stroke-width="2.5" marker-end="url(#arrow-teal)"/>
<circle cx="250.0" cy="280.0" r="18" fill="#ffffff"/>
<circle cx="250.0" cy="280.0" r="18" fill="none" stroke="#2b7a8c" stroke-width="2.5"/>
<circle cx="310.6" cy="385.0" r="18" fill="#ffffff"/>
<circle cx="310.6" cy="385.0" r="18" fill="none" stroke="#2b7a8c" stroke-width="2.5"/>
<circle cx="189.4" cy="385.0" r="18" fill="#ffffff"/>
<circle cx="189.4" cy="385.0" r="18" fill="none" stroke="#2b7a8c" stroke-width="2.5"/>
<text x="250.0" y="470.0" fill="#5d6873" font-size="15" text-anchor="middle" font-weight="400">C(S)：分割前の因果構造</text>
<text x="600.0" y="230.0" fill="#232a33" font-size="20" text-anchor="middle" font-weight="700">分割 P</text>
<line x1="600.0" y1="260.0" x2="600.0" y2="440.0" stroke="#d0693a" stroke-width="3" stroke-dasharray="8 7"/>
<line x1="590.0" y1="340.0" x2="610.0" y2="360.0" stroke="#d0693a" stroke-width="3"/>
<line x1="590.0" y1="360.0" x2="610.0" y2="340.0" stroke="#d0693a" stroke-width="3"/>
<text x="600.0" y="470.0" fill="#5d6873" font-size="15" text-anchor="middle" font-weight="400">要素間の相互作用を切る</text>
<text x="950.0" y="230.0" fill="#232a33" font-size="20" text-anchor="middle" font-weight="700">分割後</text>
<line x1="950.0" y1="280.0" x2="1010.6" y2="385.0" stroke="#2b7a8c" stroke-width="2.5" marker-end="url(#arrow-teal)"/>
<line x1="1010.6" y1="385.0" x2="889.4" y2="385.0" stroke="#d8d4c8" stroke-width="2" stroke-dasharray="8 7"/>
<line x1="889.4" y1="385.0" x2="950.0" y2="280.0" stroke="#d8d4c8" stroke-width="2" stroke-dasharray="8 7"/>
<circle cx="950.0" cy="280.0" r="18" fill="#ffffff"/>
<circle cx="950.0" cy="280.0" r="18" fill="none" stroke="#2b7a8c" stroke-width="2.5"/>
<circle cx="1010.6" cy="385.0" r="18" fill="#ffffff"/>
<circle cx="1010.6" cy="385.0" r="18" fill="none" stroke="#2b7a8c" stroke-width="2.5"/>
<circle cx="889.4" cy="385.0" r="18" fill="#ffffff"/>
<circle cx="889.4" cy="385.0" r="18" fill="none" stroke="#2b7a8c" stroke-width="2.5"/>
<text x="950.0" y="470.0" fill="#5d6873" font-size="15" text-anchor="middle" font-weight="400">C(P)：失われた因果関係は破線</text>
<line x1="340.0" y1="350.0" x2="520.0" y2="350.0" stroke="#5d6873" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="680.0" y1="350.0" x2="860.0" y2="350.0" stroke="#5d6873" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="150.0" y="510.0" width="900.0" height="70.0" rx="12" fill="#ffffff" stroke="#d8d4c8" stroke-width="2"/>
<text x="600.0" y="538.0" fill="#232a33" font-size="18" text-anchor="middle" font-weight="700">Φ_approx(S) = min_P  D( C(S), C(P) )</text>
<text x="600.0" y="564.0" fill="#5d6873" font-size="14" text-anchor="middle" font-weight="400">最も統合の弱い分割を探し、それでも失われる構造の大きさを統合の程度とみなす</text>
<text x="50.0" y="612.0" fill="#5d6873" font-size="18" text-anchor="start" font-weight="400">この式はIITの正式なΦの定義ではない。情報の量ではなく、全体に固有の因果構造を問うという考え方を表す。</text>
</g>
</svg>
