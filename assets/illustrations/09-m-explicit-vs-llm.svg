<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" role="img" aria-labelledby="title desc">
<title id="title">最初から大規模言語モデルを使う必要はない</title>
<desc id="desc">検証したい機能と、それを実現する技術を分ける</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#5d6873" stroke-width="1.4"/></marker><marker id="arrow-teal" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#2b7a8c" stroke-width="1.6"/></marker><marker id="arrow-terra" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#d0693a" stroke-width="1.6"/></marker><marker id="arrow-indigo" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#5a4fcf" stroke-width="1.6"/></marker><marker id="arrow-ink" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#232a33" stroke-width="1.6"/></marker></defs>
<rect width="1200" height="660" rx="20" fill="#f7f5ef"/>
<g font-family='system-ui, -apple-system, "Hiragino Kaku Gothic ProN", "Noto Sans CJK JP", Meiryo, sans-serif'>
<text x="50.0" y="52.0" fill="#2b7a8c" font-size="18" text-anchor="start" font-weight="700">CONSCIOUSNESS     09     図9-13</text>
<text x="50.0" y="103.0" fill="#232a33" font-size="34" text-anchor="start" font-weight="700">最初から大規模言語モデルを使う必要はない</text>
<text x="50.0" y="141.0" fill="#5d6873" font-size="21" text-anchor="start" font-weight="400">検証したい機能と、それを実現する技術を分ける</text>
<line x1="50.0" y1="166.0" x2="1150.0" y2="166.0" stroke="#d8d4c8" stroke-width="1"/>
<rect x="70.0" y="215.0" width="500.0" height="300.0" rx="14" fill="#ffffff" stroke="#2b7a8c" stroke-width="2"/>
<text x="320.0" y="252.0" fill="#2b7a8c" font-size="20" text-anchor="middle" font-weight="700">明示的な状態遷移モデル</text>
<rect x="100.0" y="282.0" width="24.0" height="24.0" rx="6" fill="#ffffff" stroke="#2b7a8c" stroke-width="2"/>
<path d="M106.0,294.0 L110.1,299.0 L119.0,288.0" fill="none" stroke="#2b7a8c" stroke-width="3"/>
<text x="140.0" y="300.0" fill="#232a33" font-size="15" text-anchor="start" font-weight="400">どの目的関数がどの程度重視されたか</text>
<rect x="100.0" y="330.0" width="24.0" height="24.0" rx="6" fill="#ffffff" stroke="#2b7a8c" stroke-width="2"/>
<path d="M106.0,342.0 L110.1,347.0 L119.0,336.0" fill="none" stroke="#2b7a8c" stroke-width="3"/>
<text x="140.0" y="348.0" fill="#232a33" font-size="15" text-anchor="start" font-weight="400">自己表象がどのように更新されたか</text>
<rect x="100.0" y="378.0" width="24.0" height="24.0" rx="6" fill="#ffffff" stroke="#2b7a8c" stroke-width="2"/>
<path d="M106.0,390.0 L110.1,395.0 L119.0,384.0" fill="none" stroke="#2b7a8c" stroke-width="3"/>
<text x="140.0" y="396.0" fill="#232a33" font-size="15" text-anchor="start" font-weight="400">更新が行動選択にどう影響したか</text>
<text x="320.0" y="470.0" fill="#2b7a8c" font-size="14" text-anchor="middle" font-weight="700">内部状態を直接観測し、追跡できる</text>
<rect x="630.0" y="215.0" width="500.0" height="300.0" rx="14" fill="#ffffff" stroke="#d0693a" stroke-width="2"/>
<text x="880.0" y="252.0" fill="#d0693a" font-size="20" text-anchor="middle" font-weight="700">大規模言語モデルを中心に据える</text>
<rect x="680.0" y="280.0" width="400.0" height="40.0" rx="20" fill="#ece9e0" stroke="#ece9e0" stroke-width="2"/>
<text x="880.0" y="306.0" fill="#232a33" font-size="15" text-anchor="middle" font-weight="700">「私は慎重な性格です」</text>
<text x="700.0" y="360.0" fill="#d0693a" font-size="16" text-anchor="start" font-weight="700">？</text>
<text x="730.0" y="360.0" fill="#232a33" font-size="14" text-anchor="start" font-weight="400">内部状態を反映しているのか</text>
<text x="700.0" y="396.0" fill="#d0693a" font-size="16" text-anchor="start" font-weight="700">？</text>
<text x="730.0" y="396.0" fill="#232a33" font-size="14" text-anchor="start" font-weight="400">過去の会話の表現を再利用しているのか</text>
<text x="700.0" y="432.0" fill="#d0693a" font-size="16" text-anchor="start" font-weight="700">？</text>
<text x="730.0" y="432.0" fill="#232a33" font-size="14" text-anchor="start" font-weight="400">文脈上もっともらしい文章を生成しただけか</text>
<text x="880.0" y="480.0" fill="#d0693a" font-size="14" text-anchor="middle" font-weight="700">発言と内部の情報処理を区別しにくい</text>
<text x="600.0" y="570.0" fill="#232a33" font-size="15" text-anchor="middle" font-weight="400">LLMは、ナラティブの生成や自然言語による物語の理解など、後の段階で利用する</text>
<text x="50.0" y="632.0" fill="#5d6873" font-size="18" text-anchor="start" font-weight="400">自己表象の成立条件を調べる目的に限れば、単純な計算モデルから始めるほうが適している。</text>
</g>
</svg>
