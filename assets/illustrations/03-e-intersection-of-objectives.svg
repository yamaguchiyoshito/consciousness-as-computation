<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
<title id="title">「自分」は目的関数の交差点に生まれる</title>
<desc id="desc">矢印の太さが重み。向きの異なる目的が同じ対象を評価する</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#5d6873" stroke-width="1.4"/></marker><marker id="arrow-teal" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#2b7a8c" stroke-width="1.6"/></marker><marker id="arrow-terra" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#d0693a" stroke-width="1.6"/></marker><marker id="arrow-indigo" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#5a4fcf" stroke-width="1.6"/></marker><marker id="arrow-ink" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#232a33" stroke-width="1.6"/></marker><radialGradient id="g03e-1"><stop offset="0" stop-color="#2b7a8c" stop-opacity="0.45"/><stop offset="0.55" stop-color="#2b7a8c" stop-opacity="0.20"/><stop offset="1" stop-color="#2b7a8c" stop-opacity="0"/></radialGradient></defs>
<rect width="1200" height="760" rx="20" fill="#f7f5ef"/>
<g font-family='system-ui, -apple-system, "Hiragino Kaku Gothic ProN", "Noto Sans CJK JP", Meiryo, sans-serif'>
<text x="50.0" y="52.0" fill="#2b7a8c" font-size="18" text-anchor="start" font-weight="700">CONSCIOUSNESS     03     図3-5</text>
<text x="50.0" y="103.0" fill="#232a33" font-size="34" text-anchor="start" font-weight="700">「自分」は目的関数の交差点に生まれる</text>
<text x="50.0" y="141.0" fill="#5d6873" font-size="21" text-anchor="start" font-weight="400">矢印の太さが重み。向きの異なる目的が同じ対象を評価する</text>
<line x1="50.0" y1="166.0" x2="1150.0" y2="166.0" stroke="#d8d4c8" stroke-width="1"/>
<circle cx="600.0" cy="462.0" r="150" fill="url(#g03e-1)"/>
<circle cx="600.0" cy="462.0" r="64" fill="#ffffff"/>
<circle cx="600.0" cy="462.0" r="64" fill="none" stroke="#2b7a8c" stroke-width="2.5"/>
<text x="600.0" y="471.0" fill="#2b7a8c" font-size="26" text-anchor="middle" font-weight="700">自分</text>
<line x1="600.0" y1="257.0" x2="600.0" y2="380.0" stroke="#2b7a8c" stroke-width="6.0" marker-end="url(#arrow-teal)"/>
<text x="600.0" y="229.0" fill="#232a33" font-size="21" text-anchor="middle" font-weight="700">生存</text>
<text x="600.0" y="252.0" fill="#5d6873" font-size="15" text-anchor="middle" font-weight="400">重み：大 ／ 回避を促す</text>
<line x1="795.0" y1="398.7" x2="678.0" y2="436.7" stroke="#5a4fcf" stroke-width="4.5" marker-end="url(#arrow-indigo)"/>
<text x="828.3" y="394.8" fill="#232a33" font-size="21" text-anchor="start" font-weight="700">社会的承認</text>
<text x="828.3" y="417.8" fill="#5d6873" font-size="15" text-anchor="start" font-weight="400">重み：中 ／ 期待に応える</text>
<line x1="720.5" y1="627.8" x2="648.2" y2="528.3" stroke="#5a4fcf" stroke-width="2.2" marker-end="url(#arrow-indigo)"/>
<text x="741.1" y="663.2" fill="#232a33" font-size="21" text-anchor="start" font-weight="700">美的感覚</text>
<text x="741.1" y="686.2" fill="#5d6873" font-size="15" text-anchor="start" font-weight="400">重み：小</text>
<line x1="479.5" y1="627.8" x2="551.8" y2="528.3" stroke="#d0693a" stroke-width="3.0" marker-end="url(#arrow-terra)"/>
<text x="458.9" y="663.2" fill="#232a33" font-size="21" text-anchor="end" font-weight="700">倫理的整合性</text>
<text x="458.9" y="686.2" fill="#5d6873" font-size="15" text-anchor="end" font-weight="400">重み：小 ／ 信念を守る</text>
<line x1="405.0" y1="398.7" x2="522.0" y2="436.7" stroke="#d0693a" stroke-width="3.6" marker-end="url(#arrow-terra)"/>
<text x="371.7" y="394.8" fill="#232a33" font-size="21" text-anchor="end" font-weight="700">知的好奇心</text>
<text x="371.7" y="417.8" fill="#5d6873" font-size="15" text-anchor="end" font-weight="400">重み：中 ／ 挑戦を促す</text>
<text x="1150.0" y="215.0" fill="#5d6873" font-size="14" text-anchor="end" font-weight="400">矢印の先：共通して参照される対象</text>
<text x="50.0" y="732.0" fill="#5d6873" font-size="18" text-anchor="start" font-weight="400">重みは状況で変わる。矛盾は統一された自己の失敗ではなく、複数の評価基準を持つ自己の通常の働きである。</text>
</g>
</svg>
