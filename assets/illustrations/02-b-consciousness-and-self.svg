<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
<title id="title">意識は認識する働き、「自分」は認識される対象</title>
<desc id="desc">意識は自己表象を構築し、認識し、更新する</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#5d6873" stroke-width="1.4"/></marker><marker id="arrow-teal" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#2b7a8c" stroke-width="1.6"/></marker><marker id="arrow-terra" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#d0693a" stroke-width="1.6"/></marker><marker id="arrow-indigo" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#5a4fcf" stroke-width="1.6"/></marker><marker id="arrow-ink" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#232a33" stroke-width="1.6"/></marker></defs>
<rect width="1200" height="620" rx="20" fill="#f7f5ef"/>
<g font-family='system-ui, -apple-system, "Hiragino Kaku Gothic ProN", "Noto Sans CJK JP", Meiryo, sans-serif'>
<text x="50.0" y="52.0" fill="#2b7a8c" font-size="18" text-anchor="start" font-weight="700">CONSCIOUSNESS     02     図2-2</text>
<text x="50.0" y="103.0" fill="#232a33" font-size="34" text-anchor="start" font-weight="700">意識は認識する働き、「自分」は認識される対象</text>
<text x="50.0" y="141.0" fill="#5d6873" font-size="21" text-anchor="start" font-weight="400">意識は自己表象を構築し、認識し、更新する</text>
<line x1="50.0" y1="166.0" x2="1150.0" y2="166.0" stroke="#d8d4c8" stroke-width="1"/>
<rect x="80.0" y="250.0" width="330.0" height="150.0" rx="14" fill="#ffffff" stroke="#2b7a8c" stroke-width="2"/>
<text x="245.0" y="320.0" fill="#2b7a8c" font-size="28" text-anchor="middle" font-weight="700">意識</text>
<text x="245.0" y="351.0" fill="#5d6873" font-size="19" text-anchor="middle" font-weight="400">認識する働き</text>
<rect x="700.0" y="225.0" width="430.0" height="230.0" rx="14" fill="#ffffff" stroke="#5a4fcf" stroke-width="2"/>
<text x="915.0" y="262.0" fill="#5a4fcf" font-size="24" text-anchor="middle" font-weight="700">「自分」＝自己表象</text>
<rect x="735.0" y="290.0" width="105.0" height="40.0" rx="20.0" fill="#ffffff" stroke="#5a4fcf" stroke-width="2"/>
<text x="787.5" y="316.5" fill="#5a4fcf" font-size="18" text-anchor="middle" font-weight="700">身体</text>
<rect x="860.0" y="290.0" width="105.0" height="40.0" rx="20.0" fill="#ffffff" stroke="#5a4fcf" stroke-width="2"/>
<text x="912.5" y="316.5" fill="#5a4fcf" font-size="18" text-anchor="middle" font-weight="700">感情</text>
<rect x="985.0" y="290.0" width="105.0" height="40.0" rx="20.0" fill="#ffffff" stroke="#5a4fcf" stroke-width="2"/>
<text x="1037.5" y="316.5" fill="#5a4fcf" font-size="18" text-anchor="middle" font-weight="700">能力</text>
<rect x="800.0" y="360.0" width="105.0" height="40.0" rx="20.0" fill="#ffffff" stroke="#5a4fcf" stroke-width="2"/>
<text x="852.5" y="386.5" fill="#5a4fcf" font-size="18" text-anchor="middle" font-weight="700">記憶</text>
<rect x="925.0" y="360.0" width="105.0" height="40.0" rx="20.0" fill="#ffffff" stroke="#5a4fcf" stroke-width="2"/>
<text x="977.5" y="386.5" fill="#5a4fcf" font-size="18" text-anchor="middle" font-weight="700">価値観</text>
<text x="915.0" y="435.0" fill="#5d6873" font-size="16" text-anchor="middle" font-weight="400">統合された認識上の対象</text>
<path d="M410.0,300.0 Q555.0,250.0 700.0,290.0" fill="none" stroke="#2b7a8c" stroke-width="3" marker-end="url(#arrow-teal)"/>
<text x="555.0" y="240.0" fill="#2b7a8c" font-size="18" text-anchor="middle" font-weight="700">構築する</text>
<path d="M700.0,400.0 Q555.0,450.0 410.0,360.0" fill="none" stroke="#5a4fcf" stroke-width="3" marker-end="url(#arrow-indigo)"/>
<text x="555.0" y="480.0" fill="#5a4fcf" font-size="18" text-anchor="middle" font-weight="700">認識する ／ 更新する</text>
<text x="245.0" y="500.0" fill="#5d6873" font-size="17" text-anchor="middle" font-weight="400">感覚情報・記憶・予測</text>
<line x1="245.0" y1="480.0" x2="245.0" y2="408.0" stroke="#5d6873" stroke-width="2" marker-end="url(#arrow)"/>
<text x="915.0" y="520.0" fill="#5d6873" font-size="17" text-anchor="middle" font-weight="400">例：鏡の中の姿を「自分の姿」として認識する</text>
<text x="50.0" y="592.0" fill="#5d6873" font-size="18" text-anchor="start" font-weight="400">意識のすべてが自己認識に還元できるわけではない。自己意識の成立に焦点を当てた機能的な仮説である。</text>
</g>
</svg>
