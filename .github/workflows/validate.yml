name: Validate and build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install fixed Pandoc version
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            https://github.com/jgm/pandoc/releases/download/3.7.0.2/pandoc-3.7.0.2-linux-amd64.tar.gz \
            --output "$RUNNER_TEMP/pandoc.tar.gz"
          tar -xzf "$RUNNER_TEMP/pandoc.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/pandoc-3.7.0.2/bin" >> "$GITHUB_PATH"
      - name: Validate documents, references and SVG
        run: python scripts/validate.py
      - name: Run regression tests
        run: python -m unittest discover -s tests -v
      - name: Verify reproducible illustrations
        run: |
          python scripts/draw_figures.py
          git diff --exit-code -- assets/illustrations
      - name: Build portable reader
        run: |
          python scripts/build.py
          python scripts/check_html.py
      - uses: actions/upload-artifact@v4
        with:
          name: consciousness-reader
          path: _site/
          if-no-files-found: error
          retention-days: 14
